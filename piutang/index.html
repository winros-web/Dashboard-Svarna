<html lang="id" data-theme="dark"><head><meta charset="utf-8"><script data-svarna-theme="v1">/* JINI: satu-satunya fungsi tambahan adalah preferensi tema. */
(() => {
  if (window.__svarnaThemeInstalled) return;
  window.__svarnaThemeInstalled = true;
  const key = 'svarna-dashboard-theme';
  const root = document.documentElement;
  const media = matchMedia('(prefers-color-scheme: dark)');
  let choice = null;
  try { const saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') choice = saved; } catch (_) {}
  let button;
  function apply(value) {
    root.dataset.theme = value;
    root.dataset.svarnaTheme = value;
    if (button) {
      const label = value === 'dark' ? 'TEMA TERANG' : 'TEMA GELAP';
      button.textContent = label;
      button.setAttribute('aria-label', 'GANTI KE ' + label);
      button.setAttribute('aria-pressed', String(value === 'dark'));
    }
  }
  apply(choice || (media.matches ? 'dark' : 'light'));
  media.addEventListener('change', () => { if (!choice) apply(media.matches ? 'dark' : 'light'); });
  addEventListener('storage', event => {
    if (event.key !== key) return;
    choice = ['light', 'dark'].includes(event.newValue) ? event.newValue : null;
    apply(choice || (media.matches ? 'dark' : 'light'));
  });
  function start() {
    button = document.createElement('button');
    button.id = 'svarna-theme-toggle'; button.type = 'button';
    button.addEventListener('click', () => {
      choice = root.dataset.svarnaTheme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, choice); } catch (_) {}
      apply(choice);
    });
    apply(root.dataset.svarnaTheme);
    const visible = node => node && node.getClientRects().length && getComputedStyle(node).visibility !== 'hidden';
    let ownBar = null;
    function mount() {
      const gate = [...document.querySelectorAll('#gerbang,#masuk')].find(visible);
      const top = [...document.querySelectorAll('.atas .kanan,.atas .bungkus,header.top .controls,header.top')].find(visible);
      if (gate || !top) {
        const host = gate || document.body;
        if (!ownBar) { ownBar = document.createElement('div'); ownBar.className = 'sv-tema-bilah'; }
        if (ownBar.parentElement !== host) host.prepend(ownBar);
        if (button.parentElement !== ownBar) ownBar.append(button);
      } else {
        if (button.parentElement !== top) top.append(button);
        if (ownBar && ownBar.isConnected) ownBar.remove();
      }
    }
    mount();
    let pending = false;
    new MutationObserver(() => {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; mount(); });
    }).observe(document.body, {childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class']});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
})();

<style>
[hidden]{display:none!important}
:root{color-scheme:dark;--bg:#11171d;--kartu:#18212a;--garis:#2a3642;--teks:#e6ecf1;--redup:#9aa8b5;--biru:#6fb3d2;--ok:#7ad39a;--warn:#f2c14e;--bad:#f08a80}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--teks);font:17px/1.45 "Aptos Narrow","Archivo Narrow","Arial Narrow",system-ui,sans-serif;letter-spacing:.03em;text-transform:uppercase;-webkit-font-smoothing:antialiased}
input,input::placeholder{text-transform:uppercase}
.atas{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--garis)}
.atas .bungkus{padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.atas .merek{font-weight:600;font-size:24px;letter-spacing:.3em}
.atas .waktu{color:var(--redup);font-size:15px;letter-spacing:.06em}
main{margin:14px 0 8vh;padding:0 20px}
.kembali{display:inline-block;margin:6px 0 2px;color:var(--redup);text-decoration:none;letter-spacing:.06em;font-size:15px}
.kembali:hover{color:var(--teks)}
h1{font-size:34px;line-height:1.1;letter-spacing:.08em;margin:6px 0 4px;font-weight:600}
h2{font-size:22px;letter-spacing:.1em;margin:22px 0 10px;font-weight:600;color:var(--biru)}
.sub{color:var(--redup);font-size:15px;margin-bottom:14px}
#pesan-halaman{margin:0 0 12px;color:var(--bad)}
/* tingkat 1 (cabang) dan tingkat 2 (3 kartu faktur) */
.kisi{display:grid;gap:12px;margin:8px 0 0}
.kisi.cabang{grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr))}
.kisi.jenis{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.kisi a{display:flex;flex-direction:column;color:var(--teks);text-decoration:none;background:var(--kartu);border:2px solid var(--garis);border-radius:16px;padding:18px 20px;transition:border-color .15s,transform .15s;min-width:0}
.kisi a:hover{border-color:var(--biru);transform:translateY(-2px)}
.kisi a.utama{border-color:rgba(111,179,210,.55)}
.kisi .nm{display:block;font-size:22px;font-weight:700;letter-spacing:.08em;line-height:1.15}
.kisi .ket{display:block;color:var(--redup);font-size:14px;margin-top:2px}
.kisi .besar{display:block;font:800 28px/1.15 "Bricolage Grotesque","Archivo Narrow",sans-serif;font-variant-numeric:tabular-nums;margin:10px 0 2px;overflow-wrap:anywhere}
.kisi.cabang .besar{font-size:22px;white-space:nowrap;overflow-wrap:normal}
.kisi.jenis .besar{font-size:30px;white-space:nowrap;overflow-wrap:normal}
.kisi dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--garis);font-size:15px;font-variant-numeric:tabular-nums}
.kisi dt{color:var(--redup);min-width:0} .kisi dd{margin:0;text-align:right;white-space:nowrap}
.kisi dd.telat,.kisi .telat .nm{color:var(--warn)} .kisi dd.lebih,.kisi .lebih .nm{color:var(--bad)} .kisi .belum .nm{color:var(--ok)}
.kisi dd.on{color:var(--biru)}
.kisi .on .nm{color:var(--biru)} .kisi .toko .nm{color:var(--ok)}
.kisi .masuk{display:block;margin-top:12px;color:var(--redup);font-size:14px;letter-spacing:.08em}
/* kotak umur (diagram umur Joe 16 Nov 2026). Joe 17 Nov 2026: "pecah jadi 3 kapsul antara judul, nominal dan total faktur"
   -> tombol = wadah polos (tema bersama memaksa semua tombol berbentuk kapsul), isinya 3 kapsul bertumpuk */
.jalur{display:grid;grid-template-columns:minmax(190px,240px) minmax(0,1fr);gap:12px;align-items:start;margin:0 0 12px}
.jalur .kotak{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.jalur button,html[data-svarna-theme] .jalur button{font:inherit;color:var(--teks);text-align:left;text-transform:uppercase;background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;min-height:0!important;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:6px;border-radius:0!important}
.jalur button>span{display:block;background:var(--kartu);border:1px solid var(--garis);border-radius:999px;padding:6px 14px;transition:border-color .15s;overflow-wrap:anywhere}
.jalur button:hover>span{border-color:var(--biru)}
.jalur button.aktif>span{border-color:var(--biru);box-shadow:inset 0 0 0 1px var(--biru)}
.jalur .jd{font-size:15px;font-weight:700;letter-spacing:.04em;line-height:1.25}
.jalur .rp{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow-wrap:normal}
.jalur .kt{color:var(--redup);font-size:14px;line-height:1.3;font-variant-numeric:tabular-nums}
.jalur .kepala-jalur .jd{font-size:16px}
.jalur.lewat .kepala-jalur .jd{color:var(--warn)} .jalur.belum .kepala-jalur .jd{color:var(--ok)}
.jalur .nol>span{opacity:.55}
.jalur.lewat .kotak button:last-child .rp{color:var(--bad)}
/* tabel */
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:0;text-transform:none}
.gulir{overflow:auto;border:1px solid var(--garis);border-radius:10px;max-width:100%}
.gulir.tinggi{max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--garis);text-align:left}
td{white-space:nowrap}
td.nama{white-space:normal;min-width:200px}
th{font-size:15px;color:var(--redup);font-weight:600;letter-spacing:.06em;background:#141c24;position:sticky;top:0;z-index:2}
td.a,th.a{text-align:right}
td.lewat{color:var(--warn)} td.minus{color:var(--bad)}
tfoot td{font-weight:700;background:#141c24;position:sticky;bottom:0;z-index:3}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;font-size:15px;color:var(--teks);background:#0e141a;border:2px solid var(--garis);border-radius:999px;padding:7px 14px;cursor:pointer;text-transform:uppercase}
.chip.aktif{border-color:var(--biru);background:#132029}
.alat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.alat input{font:inherit;color:var(--teks);background:#0e141a;border:1px solid var(--garis);border-radius:8px;padding:9px 12px;min-height:40px;flex:1;min-width:min(200px,100%)}
.btn{font:inherit;font-size:15px;letter-spacing:.04em;color:var(--teks);background:#1f2b36;border:1px solid var(--garis);border-radius:8px;padding:9px 14px;cursor:pointer;text-transform:uppercase}
.btn:hover{border-color:var(--biru)}
.info{color:var(--redup);font-size:15px;margin:6px 0 0}
.catatan{color:var(--redup);font-size:15px;margin:18px 0 0;padding-left:20px}
.catatan li{margin:2px 0}
/* garis titik umur tagihan per faktur (gaya Pengajuan PO, Joe 17 Nov 2026) */
.jejak{display:flex;align-items:flex-start;width:132px;margin:2px 0 3px}
.jejak .lk{flex:1;display:flex;justify-content:center;position:relative}
.jejak .lk i{display:block;width:12px;height:12px;border-radius:50%;border:2px solid var(--garis);background:var(--bg);box-sizing:border-box;position:relative;z-index:1}
.jejak .lk:not(:first-child)::before{content:"";position:absolute;left:-50%;right:50%;top:5px;height:2px;background:var(--garis)}
.jejak .lk.selesai i{background:#8dc63f;border-color:#8dc63f}
.jejak .lk.selesai::before,.jejak .lk.kini::before{background:#8dc63f}
.jejak .lk.kini i{background:#27aae1;border-color:#27aae1;box-shadow:0 0 0 4px rgba(39,170,225,.25)}
.jejak .lk.kini.parah i{background:var(--bad);border-color:var(--bad);box-shadow:0 0 0 4px rgba(240,138,128,.25)}
.jejak-ket{display:block;font-size:12px;color:var(--redup);letter-spacing:.03em;white-space:nowrap}
/* saringan kolom ala Excel (Joe 17 Nov 2026) */
th .saring{font:inherit;font-size:12px;line-height:1;color:var(--redup);background:transparent;border:1px solid var(--garis);border-radius:6px;padding:3px 5px;margin-left:6px;cursor:pointer;vertical-align:middle}
th .saring:hover{color:var(--teks);border-color:var(--biru)}
th.tersaring .saring{color:var(--bg);background:var(--biru);border-color:var(--biru)}
.pop-saring{position:fixed;z-index:50;width:min(320px,calc(100vw - 24px));max-height:min(70vh,520px);display:flex;flex-direction:column;gap:8px;background:var(--kartu);color:var(--teks);border:1px solid var(--garis);border-radius:12px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);text-transform:uppercase;font-size:15px}
.pop-saring .jd{font-weight:700;letter-spacing:.06em}
.pop-saring .baris-tombol{display:flex;gap:6px;flex-wrap:wrap}
.pop-saring input[type=search]{font:inherit;color:var(--teks);background:#0e141a;border:1px solid var(--garis);border-radius:8px;padding:8px 10px;width:100%}
.pop-saring .daftar{overflow:auto;border:1px solid var(--garis);border-radius:8px;padding:4px 8px;min-height:80px;flex:1}
.pop-saring label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer;overflow-wrap:anywhere}
.pop-saring label.semua{font-weight:700;border-bottom:1px solid var(--garis)}
.pop-saring .btn.aktif{border-color:var(--biru);color:var(--biru)}
.pop-saring .info{margin:0}
@media (max-width:700px){main{padding:0 12px}.atas .bungkus{padding:0 12px}h1{font-size:28px}td.nama{min-width:150px}.kisi.cabang .besar{font-size:22px}.kisi.jenis .besar{font-size:24px}.jalur{grid-template-columns:minmax(0,1fr)}.jalur .kotak{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* catatan telat bayar (Joe 17 Nov 2026) */
.ctt-sel{white-space:normal;min-width:230px;max-width:320px}
.ctt-alasan{display:block;text-transform:none;line-height:1.35}
.ctt-meta{display:block;color:var(--redup);font-size:12px;margin-top:2px}
td.ctt-ingkar{color:var(--bad)}
.ctt-tambah{font:inherit;font-size:13px;letter-spacing:.03em;color:var(--biru);background:transparent;border:1px dashed var(--biru);border-radius:999px;padding:5px 12px;margin-top:6px;cursor:pointer;text-transform:uppercase;white-space:nowrap}
.ctt-tambah:disabled{color:var(--redup);border-color:var(--garis);cursor:default}
.wadah-catatan{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:12px}
.latar-catatan{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.pop-catatan{position:relative;width:min(460px,100%);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:10px;background:var(--kartu);color:var(--teks);border:1px solid var(--garis);border-radius:20px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.4);text-transform:uppercase;font-size:15px}
.pop-catatan .jd{font-weight:700;letter-spacing:.06em;font-size:17px}
.pop-catatan .jd.kecil{font-size:14px;color:var(--redup)}
.pop-catatan .ctt-faktur{color:var(--redup);font-size:13px;text-transform:none}
.pop-catatan label{display:flex;flex-direction:column;gap:4px}
.pop-catatan label span{font-size:13px;color:var(--redup);letter-spacing:.06em}
.pop-catatan textarea,.pop-catatan input{font:inherit;font-size:16px;text-transform:none;color:var(--teks);background:#0e141a;border:1px solid var(--garis);border-radius:12px;padding:10px 12px;width:100%}
html[data-svarna-theme] .pop-catatan :is(textarea,input){background:var(--sv-input,#0e141a)}
.pop-catatan .baris-tombol{display:flex;gap:8px}
.pop-catatan .btn.utama{background:var(--biru);border-color:var(--biru);color:var(--bg);font-weight:700}
.ctt-riwayat{border-top:1px solid var(--garis);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.ctt-item{display:flex;flex-direction:column;gap:2px;font-size:14px;text-transform:none}
.ctt-item b{font-size:12px;color:var(--redup);font-weight:600}
.ctt-item small{color:var(--biru);font-size:12px}

html[data-svarna-theme] body:has(#lv-cabang) .kisi .masuk { display:inline-flex; align-items:center; justify-content:center; min-height:40px; margin:16px 0 0; padding:7px 16px; border:1px solid var(--garis); border-radius:999px; font-size:13px; line-height:1.35; letter-spacing:.035em; background:var(--kartu2); }

  catch (e) { $("pesan-halaman").hidden = false; $("pesan-halaman").textContent = "Data gagal dimuat: " + (e.message || e); $("sub").textContent = ""; return; }

  const API = "https://svarna5s-mac-mini.tail7a15d8.ts.net";   // layanan chat_svarna (Mac Winros@) untuk catatan telat bayar; kosong = fitur catatan mati

  const KATEGORI = [{ k: "online", judul: "Online", uji: (f) => f.o === 1 }, { k: "toko", judul: "Toko", uji: (f) => f.o === 0 }];

  // ---------------------------------------------------------------- tingkat 1: kartu Gabungan + per cabang
  function gambarCabang() {
    $("lv-cabang").replaceChildren(...CABANG.map((c) => {

      return el("a", { href: "#" + slug(c), class: c ? "" : "utama" },
        el("span", { class: "nm", text: namaCabang(c) }), el("span", { class: "ket", text: ketCabang(c) + " · " + bil(d.length) + " faktur" }),
        el("span", { class: "besar", text: "Rp " + rp(jumlah(d)) }),
        el("dl", {}, ...baris("Belum lunas", rp(jumlah(b))), ...baris("Telat bayar", rp(jumlah(t)), "telat"), ...baris("Lebih bayar", rp(jumlah(l)), "lebih")),

  function gambarKat() {

    $("lv-kat").replaceChildren(...KATEGORI.map((k) => {
      const x = dasar.filter(k.uji), lewat = x.filter((f) => f.l > 0);

            rp(jumlah(j.k === "telat" ? x.filter((f) => f.l > 35) : x.filter((f) => f.l >= -3))), j.k === "telat" ? "telat" : ""))),

  }
  function gambarUmur() {   // kotak umur sesuai jenis: belum lunas = jalur belum, telat bayar = jalur lewat, lebih bayar = tanpa
    const j = JENIS.find((x) => x.k === pilih.j), d = dipilih();

    const pilihSaring = (k) => { pilihUmur = pilihUmur === k ? "semua" : k; gambarUmur(); gambarFaktur(); $("judul-faktur").scrollIntoView({ behavior: "smooth", block: "start" }); };
    const tombol = (k, judul, ket, x, kelas) => {

<script>
(() => {
  const API = "https://svarna5s-mac-mini.tail7a15d8.ts.net/api/perbarui";

<script>
  /* lapisan-bersama BEN 12 Nov 2026: gerak saat klik untuk semua halaman; halaman dengan gerak sendiri dilewati */
  (() => {
    if (window.__gerakGIO) return; window.__gerakGIO = true;
    const TEKAN = "button,.chip,[role=button]", BARIS = "tbody tr,.kartu,.kartu-po,.kotak,.prog-kartu,.pilihan,.riwayat>div",
      ANGKA = ".kpi b,.kotak .n,.angka3 b,.angka b", AKTIF = ".aktif,[aria-pressed=\"true\"]",
      MUAT = "h1,.sub,.kpi,.ringkas,.angka3,.chips,.alat,.tabel,.gulir,main>section";
    const redam = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let klikTerakhir = performance.now(), awal = true;
    const sesudahKlik = () => awal || performance.now() - klikTerakhir < 900;
    document.addEventListener("pointerdown", (e) => {
      klikTerakhir = performance.now(); awal = false;
      const b = e.target.closest(TEKAN); if (!b || redam) return;
      const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
      const s = document.createElement("span"); s.className = "riak";
      s.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
      b.appendChild(s); setTimeout(() => s.remove(), 650);
    }, true);
    document.addEventListener("click", () => { klikTerakhir = performance.now(); awal = false; }, true);
    const angkaLama = new Map();
    const kunciAngka = (b) => (b.closest("button,div,section") || b).textContent.replace(/[\d.,]/g, "").trim().slice(0, 60);
    const keAngka = (t) => { const m = (t || "").replace(/[^\d-]/g, ""); return m === "" || m === "-" ? NaN : +m; };
    const nfID = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
    const hitungNaik = (b, dari, ke) => {
      const t0 = performance.now(), lama = Math.min(900, 300 + Math.abs(ke - dari) * 12);
      const teks = b.textContent, cocok = /^[\d.,]+$/.test(teks.trim());
      const langkah = (t) => { const p = Math.min(1, (t - t0) / lama), e = 1 - Math.pow(1 - p, 3), v = Math.round(dari + (ke - dari) * e);
        if (cocok) b.textContent = nfID.format(v); if (p < 1) requestAnimationFrame(langkah); else if (cocok) b.textContent = teks; };
      requestAnimationFrame(langkah);
    };
    const urus = (n) => {
      if (!(n instanceof Element)) return;
      const semua = [n, ...n.querySelectorAll("*")];
      if (sesudahKlik() && !redam) {
        let i = 0;
        for (const x of semua) if (x.matches(BARIS) && !x.classList.contains("anim")) { x.style.setProperty("--i", i++); x.classList.add("anim"); }
        for (const x of semua) if (x.matches(AKTIF) && !awal) { x.classList.add("kilat"); x.addEventListener("animationend", () => x.classList.remove("kilat"), { once: true }); }
      }
      for (const b of semua) if (b.matches(ANGKA)) {
        const k = kunciAngka(b), baru = keAngka(b.textContent), lama = angkaLama.get(k);
        angkaLama.set(k, baru);
        if (lama !== undefined && !Number.isNaN(lama) && !Number.isNaN(baru) && lama !== baru && !redam) {
          b.classList.add("angka-ganti"); b.addEventListener("animationend", () => b.classList.remove("angka-ganti"), { once: true });
          hitungNaik(b, lama, baru);
        }
      }
    };
    new MutationObserver((ms) => { for (const m of ms) m.addedNodes.forEach(urus); }).observe(document.body, { childList: true, subtree: true });
    document.querySelectorAll(MUAT).forEach((x) => x.classList.add("muat"));
    urus(document.body);
    setTimeout(() => { awal = false; }, 1500);
  })();
</script>

</style><script data-svarna-theme="kontras">
(() => {
  // PENJAGA KONTRAS (BEN 14 Nov 2026): teks yang kontrasnya < 3 terhadap latar diganti ke tinta tema yang paling terbaca.
  const rgb = (s) => { const m = /rgba?\(([^)]+)\)/.exec(s || ""); if (!m) return null; const v = m[1].split(",").map(Number); return { r: v[0], g: v[1], b: v[2], a: v.length > 3 ? v[3] : 1 }; };
  const lum = (c) => { const f = (x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b); };
  const kontras = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const latar = (el) => { const lap = []; for (let e = el; e && e !== document.documentElement; e = e.parentElement) { const c = rgb(getComputedStyle(e).backgroundColor); if (c && c.a > 0) { lap.push(c); if (c.a >= 0.99) break; } }
    let h = rgb(getComputedStyle(document.body).backgroundColor) || { r: 255, g: 255, b: 255, a: 1 }; if (h.a < 0.99) h = { r: 255, g: 255, b: 255, a: 1 };
    for (const c of lap.reverse()) h = { r: c.r * c.a + h.r * (1 - c.a), g: c.g * c.a + h.g * (1 - c.a), b: c.b * c.a + h.b * (1 - c.a), a: 1 }; return h; };
  const GELAP = { r: 32, g: 48, b: 61 }, TERANG = { r: 236, g: 242, b: 246 };
  function periksa() {
    if (!document.body) return;
    for (const el of document.querySelectorAll("[data-kontras-bot]")) { el.style.removeProperty("color"); el.removeAttribute("data-kontras-bot"); }
    for (const el of document.body.querySelectorAll("*")) {
      if (el.closest(".merek-raksasa,svg,script,style") || !el.firstChild) continue;
      let ada = false; for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.trim()) { ada = true; break; }
      if (!ada) continue;
      const cs = getComputedStyle(el); if (cs.display === "none" || cs.visibility === "hidden") continue;
      const fg0 = rgb(cs.color); if (!fg0) continue; const bg = latar(el);
      const fg = fg0.a < 1 ? { r: fg0.r * fg0.a + bg.r * (1 - fg0.a), g: fg0.g * fg0.a + bg.g * (1 - fg0.a), b: fg0.b * fg0.a + bg.b * (1 - fg0.a) } : fg0;
      if (kontras(fg, bg) >= 3) continue;
      const t = kontras(GELAP, bg) >= kontras(TERANG, bg) ? GELAP : TERANG;
      el.style.setProperty("color", `rgb(${t.r},${t.g},${t.b})`, "important"); el.setAttribute("data-kontras-bot", "1");
    }
  }
  let jeda = 0;
  const jadwal = () => { clearTimeout(jeda); jeda = setTimeout(() => requestAnimationFrame(periksa), 250); };
  const mulai = () => { jadwal(); new MutationObserver((m) => { if (m.every((x) => x.type === "attributes" && x.attributeName === "data-kontras-bot")) return; jadwal(); })
    .observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-svarna-theme", "class", "hidden"] }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mulai, { once: true }); else mulai();
})();
