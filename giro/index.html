(() => {
  if (window.__svarnaThemeInstalled) return;
  window.__svarnaThemeInstalled = true;
  const key = 'svarna-dashboard-theme';
  const root = document.documentElement;
  const media = matchMedia('(prefers-color-scheme: dark)');
  let choice = null;
  try { const saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') choice = saved; } catch (_) {}
  let button;
  function apply(value) {
    root.dataset.theme = value;
    root.dataset.svarnaTheme = value;
    if (button) {
      const label = value === 'dark' ? 'TEMA TERANG' : 'TEMA GELAP';
      button.textContent = label;
      button.setAttribute('aria-label', 'GANTI KE ' + label);
      button.setAttribute('aria-pressed', String(value === 'dark'));
    }
  }
  apply(choice || (media.matches ? 'dark' : 'light'));
  media.addEventListener('change', () => { if (!choice) apply(media.matches ? 'dark' : 'light'); });
  addEventListener('storage', event => {
    if (event.key !== key) return;
    choice = ['light', 'dark'].includes(event.newValue) ? event.newValue : null;
    apply(choice || (media.matches ? 'dark' : 'light'));
  });
  function start() {
    button = document.createElement('button');
    button.id = 'svarna-theme-toggle'; button.type = 'button';
    button.addEventListener('click', () => {
      choice = root.dataset.svarnaTheme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, choice); } catch (_) {}
      apply(choice);
    });
    apply(root.dataset.svarnaTheme);
    const visible = node => node && node.getClientRects().length && getComputedStyle(node).visibility !== 'hidden';
    let ownBar = null;
    function mount() {
      const gate = [...document.querySelectorAll('#gerbang,#masuk')].find(visible);
      const top = [...document.querySelectorAll('.atas .kanan,.atas .bungkus,header.top .controls,header.top')].find(visible);
      if (gate || !top) {
        const host = gate || document.body;
        if (!ownBar) { ownBar = document.createElement('div'); ownBar.className = 'sv-tema-bilah'; }
        if (ownBar.parentElement !== host) host.prepend(ownBar);
        if (button.parentElement !== ownBar) ownBar.append(button);
      } else {
        if (button.parentElement !== top) top.append(button);
        if (ownBar && ownBar.isConnected) ownBar.remove();
      }
    }
    mount();
    let pending = false;
    new MutationObserver(() => {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; mount(); });
    }).observe(document.body, {childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class']});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
})();

.baris-periode{align-items:center;margin:0}

.nav-bulan{display:flex;align-items:stretch;border:1px solid var(--garis);border-radius:14px;background:var(--masukan)}
.nav-panah{font:inherit;font-size:24px;line-height:1;min-width:44px;border:0;background:none;color:var(--teks);cursor:pointer;border-radius:14px}

.nav-nama{font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:180px;padding:8px 14px;border:0;border-left:1px solid var(--garis);border-right:1px solid var(--garis);background:none;color:var(--teks);cursor:pointer;text-transform:uppercase}
.nav-nama b{font-size:16px;letter-spacing:.06em}
.nav-nama small{font-size:12px;color:var(--redup);letter-spacing:.04em}

.chip.tgl .tgl-bawah{font-size:20px;font-weight:700}

.deret-tgl > .chip.tgl{flex-direction:column;align-items:stretch;gap:4px;padding:0;background:none !important;border:0 !important;box-shadow:none !important;border-radius:0;overflow:visible}

.chip.kecil-kembali{font-size:13px;padding:8px 14px}
.lbl-periode{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--redup);margin-right:2px}
.baris-periode .panah{font-size:22px;color:var(--redup);padding:0 2px}
.kapsul-bulan{position:relative}

.deret-chip{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip.kosong{opacity:.55}
.kk-label{color:var(--redup);font-size:12px}.kk-nilai{font-weight:700;margin-bottom:12px}
.kn-judul{font-weight:700;font-size:14px;letter-spacing:.04em;margin-bottom:8px;text-transform:uppercase;width:100%;max-width:300px}
.tabel-info{background:var(--masukan);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7;text-transform:uppercase;min-width:0;display:grid;grid-template-columns:max-content auto minmax(0,1fr);column-gap:10px;align-items:start}
.tb-baris{display:contents}
.tb-label{color:var(--redup)}
.tb-label{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tb-nilai{overflow-wrap:anywhere}
.tb-nilai.ok{color:var(--ok);font-weight:700}.tb-nilai.bad{color:var(--bad);font-weight:700}
.tb-judul{font-weight:700;grid-column:1 / -1}.tb-jeda{height:12px;grid-column:1 / -1}
.tb-status{margin-bottom:6px}
.bulat{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid currentColor;flex:0 0 auto}
.bulat.ok{color:var(--ok)}.bulat.bad{color:var(--bad)}
.foto-utama{position:relative;display:block;width:100%;max-width:300px;height:280px;padding:0;border:0;border-radius:22px;overflow:hidden;background:var(--masukan);cursor:zoom-in;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.foto-utama img{width:100%;height:100%;object-fit:cover;display:block}
.foto-utama.kosong{display:flex;align-items:center;justify-content:center;color:var(--redup);font-size:13px;cursor:default;box-shadow:none}
.foto-jml{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}

.gal-geser.kiri{left:10px}.gal-geser.kanan{right:10px}
.gal-hitung{color:#ddd;font-size:14px}
.gal-deret{display:flex;gap:6px;overflow-x:auto;max-width:100%}

.gal-deret img.aktif{opacity:1;outline:2px solid #fff}
@media (max-width:700px){.item{grid-template-columns:1fr auto}.item .foto-utama{width:100%;height:240px}.tb-baris{grid-template-columns:15ch 2ch minmax(0,1fr)}.tabel-info{font-size:12.5px;padding:12px}}
.item:first-of-type{border-top:0}

.item .brg{font-size:15px;margin-top:2px}
.item .ket-i{font-size:14px;color:var(--redup);margin-top:3px}
.jempol{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.jempol img{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--garis);background:var(--masukan);cursor:zoom-in}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;margin:2px 4px 2px 0}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.abu{color:var(--redup)} .pill.biru{color:var(--biru)}
.kartu-rt{background:var(--kartu);border:1px solid var(--garis);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.kartu-rt .kepala{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.kartu-rt .no{font:700 15px/1.2 ui-monospace,Consolas,monospace;color:var(--biru)}
.kartu-rt .info{font-size:14px;color:var(--redup)}
.banding{margin-top:8px;padding:10px 12px;border-left:3px solid var(--warn);background:rgba(242,193,78,.06);border-radius:6px;font-size:14px}
.form-banding,.form-jawab{margin-top:10px;display:grid;gap:8px}
.form-jawab .pilihan button{font-size:13px;letter-spacing:.02em;text-transform:none;padding:12px 8px}
.form-jawab .pilihan button.ok{border-color:var(--ok);color:var(--ok)} .form-jawab .pilihan button.bad{border-color:var(--bad);color:var(--bad)}
.kecil-redup{font-size:12px;color:var(--redup)}
summary{cursor:pointer}
.layar-foto{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.layar-foto img{max-width:100%;max-height:100%;border-radius:8px}
.layar-scan{position:fixed;inset:0;z-index:98;background:#000;display:flex;flex-direction:column}
.layar-scan .kepala-scan{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;color:#fff;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.layar-scan .bingkai-video{position:relative;flex:1;min-height:0;overflow:hidden}
.layar-scan video{width:100%;height:100%;object-fit:cover;display:block}
.layar-scan .kotak-bidik{position:absolute;left:8%;right:8%;top:32%;height:36%;border:3px solid var(--biru);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.layar-scan .bawah-scan{padding:12px 16px calc(14px + env(safe-area-inset-bottom));color:#ccc;font-size:14px;text-align:center;display:grid;gap:8px}
.layar-scan .status-scan{color:#fff;font-weight:700;letter-spacing:.03em}
.layar-scan .calon-scan{justify-content:center;margin:0}
.layar-scan .calon-scan button{font-size:20px;padding:12px 16px;background:#11171d;color:#fff;border-color:var(--biru)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;transition:.25s;background:var(--masukan);border:1px solid var(--biru);color:var(--teks);padding:12px 18px;border-radius:10px;z-index:100;font-size:16px;max-width:92vw;pointer-events:none}
.toast.tampil{opacity:1;transform:translateX(-50%) translateY(0)}
.kosong-teks{color:var(--redup);padding:16px 4px}
.bawah{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.lekat-bawah{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 calc(10px + env(safe-area-inset-bottom));margin-top:4px}

/* Usulan JINI, 15 Nov 2026. Lapisan tampilan saja; seluruh alur/teks/ID tetap. */
:root {
  --bg:#13191d; --kartu:#1b2227; --masukan:#151c20;
  --garis:#3e4c55; --teks:#e0e6e8; --redup:#a6b3b9;
  --biru:#a4c5d1; --aktif:#24343d; --abu:#2b363e;
  --ok:#9ac5aa; --warn:#dbc18b; --bad:#e4a19b; --teks-tombol:#172126;
  --bayang:0 3px 14px #00000014; --batas:#62737e;
  --halo:#a4c5d12e; --bidang-ok:#9ac5aa0d; --bidang-warn:#dbc18b0d;
  --lapisan:var(--bg); --bidik-bayang:rgba(19,25,29,.45);
}
:root[data-tema="terang"] {
  --bg:#eef1f0; --kartu:#fafbf9; --masukan:#f2f5f3;
  --garis:#a5b3b6; --teks:#223139; --redup:#53666e;
  --biru:#365f71; --aktif:#e3edf0; --abu:#e5ebe9;
  --ok:#38684b; --warn:#775b27; --bad:#a0443e; --teks-tombol:#fafbf9;
  --bayang:0 3px 14px #24313907; --batas:#7d8b8c;
  --halo:#365f7126; --bidang-ok:#38684b08; --bidang-warn:#775b2709;
  --lapisan:var(--bg); --bidik-bayang:rgba(238,241,240,.45);
}
@media (prefers-color-scheme:light) {
  :root:not([data-tema]) {
    --bg:#eef1f0; --kartu:#fafbf9; --masukan:#f2f5f3;
    --garis:#a5b3b6; --teks:#223139; --redup:#53666e;
    --biru:#365f71; --aktif:#e3edf0; --abu:#e5ebe9;
    --ok:#38684b; --warn:#775b27; --bad:#a0443e; --teks-tombol:#fafbf9;
    --bayang:0 3px 14px #24313907; --batas:#7d8b8c;
    --halo:#365f7126; --bidang-ok:#38684b08; --bidang-warn:#775b2709;
    --lapisan:var(--bg); --bidik-bayang:rgba(238,241,240,.45);
  }
}
html { zoom:1; scroll-padding-top:100px; -webkit-text-size-adjust:100%; }
body { font-size:16px; line-height:1.45; letter-spacing:.015em; text-transform:uppercase; }
button,input,select,textarea { touch-action:manipulation; }
button,select,summary { cursor:pointer; }
button,select,textarea,input,label { max-width:100%; }
button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,
label:has(input[type=file]:focus-visible) { outline:2px solid var(--biru); outline-offset:3px; }
input::placeholder,textarea::placeholder { color:var(--redup); opacity:1; }
button:disabled { cursor:default; }
.atas { background:var(--bg); }
.atas .bungkus { max-width:960px; min-height:64px; gap:12px; padding:8px 20px; }
.atas .merek { font-size:16px; letter-spacing:.18em; line-height:1.2; }
.atas .waktu { font-size:13px; letter-spacing:.04em; display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; min-width:0; overflow-wrap:anywhere; }
.atas button { min-height:44px; padding:10px 12px; font-size:13px; line-height:1.2; border-radius:10px; }
.atas .tombol-tema { flex:none; color:var(--teks); background:var(--kartu); border-color:var(--garis); white-space:nowrap; }
main { max-width:960px; margin:14px auto calc(28px + env(safe-area-inset-bottom)); padding:0 20px; }
h1 { font-size:24px; line-height:1.25; letter-spacing:.04em; margin:8px 0; }
.sub { font-size:14px; line-height:1.5; margin-bottom:16px; }
.kembali { min-height:44px; display:inline-flex; align-items:center; font-size:14px; margin:0; }
.tab { gap:8px; margin:0 0 12px; }
#isi > .tab { display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--masukan); padding:4px; border:1px solid var(--garis); border-radius:14px; }
.tab button,.chip { min-height:44px; border-radius:10px; padding:9px 12px; font-size:14px; line-height:1.35; letter-spacing:.025em; }
#isi > .tab button { border-color:transparent; background:transparent; color:var(--redup); font-weight:600; }
#isi > .tab button.aktif { color:var(--teks); border-color:var(--garis); background:var(--kartu); box-shadow:var(--bayang); }
#saring { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }
#saring .chip { padding:9px 6px; }
#saring select { grid-column:1 / -1; font-size:16px; }
.chip small { font-size:inherit; font-variant-numeric:tabular-nums; margin-left:3px; }
.kotak,.kartu-rt { border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--bayang); }
.kotak > .judul { color:var(--teks); font-size:16px; line-height:1.35; letter-spacing:.045em; gap:10px; margin-bottom:14px; }
.kotak > .judul .no { width:28px; height:28px; border-radius:9px; background:var(--aktif); color:var(--biru); border:1px solid var(--garis); font-size:15px; }
.kotak > .judul .no.ok { background:var(--bidang-ok); color:var(--ok); border-color:var(--ok); }
.pilihan { grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:8px; }
.pilihan.dua { grid-template-columns:repeat(2,minmax(0,1fr)); }
.pilihan button { min-height:50px; font-size:16px; line-height:1.35; letter-spacing:.025em; padding:12px 10px; border:1px solid var(--garis); border-radius:10px; font-weight:600; }
.pilihan button.aktif { box-shadow:inset 0 0 0 1px var(--biru); }
.pilihan button small { font-size:13px; letter-spacing:.02em; }
.pilihan.kecil button { min-height:48px; padding:10px 8px; font-size:14px; }
label.lbl { font-size:13px; line-height:1.45; font-weight:600; letter-spacing:.055em; margin:16px 0 7px; }
input.isian,textarea.isian { min-width:0; min-height:48px; padding:12px; font-size:16px; line-height:1.4; border:1px solid var(--batas); border-radius:10px; }
select.isian,select.chip,select.saring-produk { min-width:0; max-width:100%; min-height:48px; padding:10px 12px; border:1px solid var(--batas); border-radius:10px; background:var(--masukan); color:var(--teks); color-scheme:inherit; font:inherit; font-size:16px; }
option,optgroup { background:var(--kartu); color:var(--teks); }
input.isian:focus,textarea.isian:focus { border-color:var(--biru); box-shadow:0 0 0 3px var(--halo); outline:none; }
input.isian:disabled { opacity:1; color:var(--redup); -webkit-text-fill-color:var(--redup); background:var(--bg); border-style:dashed; }
input.kode { font-size:16px; letter-spacing:.015em; font-variant-numeric:tabular-nums; }
textarea.isian { min-height:88px; }
.baris-scan { grid-template-columns:minmax(0,1fr) auto auto; gap:8px; }
.baris-scan button,.baris-scan label.foto { min-height:44px; padding:10px 16px; border:1px solid var(--garis); border-radius:10px; font-size:14px; line-height:1.2; letter-spacing:.045em; background:var(--aktif); color:var(--biru); }
.baris-scan label.foto { background:var(--masukan); color:var(--teks); }
.dua-tombol { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.dua-tombol button,.dua-tombol label.foto { min-height:54px; padding:12px 10px; border:1px solid var(--garis); border-radius:10px; font-size:14px; line-height:1.35; letter-spacing:.045em; background:var(--aktif); color:var(--biru); }
.dua-tombol label.foto { background:var(--masukan); color:var(--teks); }
.centang { min-height:44px; gap:10px; margin-top:4px; font-size:14px; }
.centang input { flex:none; margin:0; width:22px; height:22px; accent-color:var(--biru); }
.calon button { min-height:44px; max-width:100%; overflow-wrap:anywhere; font-size:15px; line-height:1.3; }
.ket,.kecil-redup { font-size:14px; line-height:1.5; letter-spacing:.01em; }
.hasil-cari button { min-height:48px; font-size:16px; line-height:1.4; }
.barang-pilih { font-size:15px; line-height:1.5; border-color:var(--garis); background:var(--bidang-ok); color:var(--teks); padding:10px 12px; }
.barang-pilih span { min-width:0; }
.barang-pilih button { flex:none; min-height:44px; padding:10px; font-size:13px; border-radius:9px; }
.status-sn { font-size:14px; line-height:1.5; letter-spacing:.02em; padding:12px; }
.status-sn.ok { background:var(--bidang-ok); }
.status-sn.warn,.banding { background:var(--bidang-warn); }
.foto-banyak { gap:12px; padding-top:4px; }
.foto-banyak .jempol-x { padding:5px; }
.foto-banyak .jempol-x img,.tambah-foto { width:80px; height:80px; }
.foto-banyak .jempol-x button { width:44px; height:44px; top:-7px; right:-7px; background:var(--kartu); color:var(--bad); border:1px solid var(--bad); font-size:22px; }
.tambah-foto { border-width:1px; background:var(--masukan); font-size:13px; }
.tambah-foto input,.pilih-berkas input { width:100%; height:100%; }
.tiga button { min-height:44px; font-size:13px; }
.btn { min-height:48px; padding:13px 16px; border:1px solid var(--biru); border-radius:11px; font-size:16px; line-height:1.35; letter-spacing:.04em; background:var(--aktif); color:var(--biru); }
.btn.abu { background:var(--masukan); border-color:var(--garis); }
.btn.hijau { background:var(--aktif); color:var(--ok); border-color:var(--ok); }
.btn.merah { background:var(--masukan); color:var(--bad); border-color:var(--bad); }
.btn.kecil { min-height:44px; padding:10px 12px; font-size:14px; line-height:1.35; }
.baris-aksi { gap:8px; margin-top:14px; }
.item { grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:16px 0; }
.item > div { min-width:0; }
.item:not(:has(> button)) { grid-template-columns:minmax(0,1fr); }
.item .sn { font-size:17px; line-height:1.45; letter-spacing:.015em; overflow-wrap:anywhere; }
.item .brg,.item .ket-i { font-size:14px; line-height:1.5; margin-top:6px; }
.pill { font-size:13px; line-height:1.45; border-radius:7px; padding:4px 8px; white-space:normal; overflow-wrap:anywhere; max-width:100%; }
.kartu-rt .no { font-size:15px; line-height:1.5; overflow-wrap:anywhere; }
.kartu-rt .info { font-size:14px; line-height:1.5; }
.form-jawab,.form-banding { gap:10px; padding-top:4px; }

.kartu-r:hover{transform:translateY(-2px);border-color:var(--biru,#4da3ff)}
.kartu-r b{font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.kartu-r span{color:var(--redup);font-size:14px;line-height:1.45}
.kartu-r .angka{margin-top:auto;font-size:15px;color:var(--teks);font-variant-numeric:tabular-nums}
.kartu-r .angka.awas{color:var(--warn,#e6b450)}
.ringkas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px;margin:4px 0 10px}
.ringkas .angka{background:var(--kartu);border:1px solid var(--garis);border-radius:28px;padding:9px 16px}
.ringkas .angka b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.ringkas .angka span{color:var(--redup);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.saring{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px;align-items:center}
.tombol-unduh{font:inherit;font-size:14px;font-weight:700;letter-spacing:.05em;border-radius:999px;border:1px solid var(--biru,#4da3ff);
  background:var(--biru,#4da3ff);color:var(--sv-on-accent,#111d27);padding:9px 18px;cursor:pointer;white-space:nowrap}
.tombol-unduh:disabled{opacity:.6;cursor:wait}
.tombol-hapus-saring{font:inherit;font-size:13px;border-radius:999px;border:1px solid var(--garis);background:var(--kartu);color:var(--teks);
  padding:8px 14px;cursor:pointer}
.saring select,.saring input{font:inherit;font-size:15px;color:var(--teks);background:var(--kartu);border:1px solid var(--garis);
  border-radius:999px;padding:9px 14px;min-width:0;max-width:100%}
.saring input{flex:1 1 220px}
.wadah-tabel{background:var(--kartu);border:1px solid var(--garis);border-radius:28px;padding:4px 10px 10px;overflow:auto;
  max-height:calc(100dvh - 215px);min-height:240px}
table.daftar{border-collapse:collapse;font-size:13.5px;width:max-content;min-width:100%}
table.daftar th{position:sticky;top:0;z-index:2;background:var(--kartu);text-align:left;color:var(--redup);font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:7px 6px;border-bottom:1px solid var(--garis);
  white-space:normal;vertical-align:middle;line-height:1.25;text-align:center}
table.daftar th .kepala{display:flex;align-items:center;justify-content:center;gap:3px}
table.daftar th .kepala span{overflow-wrap:normal;word-break:normal;text-align:center;min-width:0}
button.saring-kol{flex:none;border:1px solid transparent;background:none;color:var(--redup);cursor:pointer;font-size:12px;line-height:1;
  padding:3px 4px;border-radius:6px}
button.saring-kol:hover{border-color:var(--garis);color:var(--teks)}
button.saring-kol.aktif{background:var(--biru,#4da3ff);color:var(--sv-on-accent,#111d27)}
.pop-saring{position:fixed;z-index:60;width:min(300px,92vw);max-height:min(460px,70vh);display:flex;flex-direction:column;gap:8px;
  padding:12px;border-radius:18px;background:var(--kartu);border:1px solid var(--garis);box-shadow:0 14px 40px #0000004d;font-size:13.5px}
.pop-saring input[type=search]{font:inherit;color:var(--teks);background:var(--kartu2,var(--kartu));border:1px solid var(--garis);
  border-radius:999px;padding:7px 12px}
.pop-saring .daftar-nilai{overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px;padding-right:4px}
.pop-saring label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:3px 4px;border-radius:8px;overflow-wrap:anywhere}
.pop-saring label:hover{background:var(--kartu2,transparent)}
.pop-saring label small{margin-left:auto;color:var(--redup)}
.pop-saring .tombol{display:flex;gap:8px;justify-content:flex-end}
.pop-saring .tombol button{font:inherit;border-radius:999px;padding:7px 14px;cursor:pointer;border:1px solid var(--garis);background:var(--kartu);color:var(--teks)}
.pop-saring .tombol button.utama{background:var(--biru,#4da3ff);border-color:var(--biru,#4da3ff);color:var(--sv-on-accent,#111d27);font-weight:700}
table.daftar td{padding:6px 6px;border-bottom:1px solid var(--garis);vertical-align:top;white-space:nowrap}
table.daftar tfoot td{position:sticky;bottom:0;background:var(--kartu);font-weight:700;border-top:1px solid var(--garis)}
table.daftar th.gr-a,table.daftar th.gr-b{font-size:12px;letter-spacing:.08em;text-align:left;font-weight:700;padding:6px 0}
table.daftar th.gr-a span,table.daftar th.gr-b span{position:sticky;left:14px;display:inline-block;padding:0 14px}
table.daftar th.gr-a{background:color-mix(in srgb,#4da3ff 30%,var(--kartu));color:var(--teks)}
table.daftar th.gr-b{background:color-mix(in srgb,#5cc28f 30%,var(--kartu));color:var(--teks)}
table.daftar th.k-a{background:color-mix(in srgb,#4da3ff 14%,var(--kartu))}
table.daftar th.k-b{background:color-mix(in srgb,#5cc28f 14%,var(--kartu))}
table.daftar td.k-a{background:color-mix(in srgb,#4da3ff 5%,transparent)}
table.daftar td.k-b{background:color-mix(in srgb,#5cc28f 6%,transparent)}
/* tabel potongan muat satu layar (Joe 25 Nov 2026): lebar = layar, teks panjang dibungkus, tanggal & angka satu baris */
table.daftar.pas{width:100%;min-width:0;font-size:12.5px}
table.daftar.pas th,table.daftar.pas td{white-space:normal;overflow-wrap:anywhere;word-break:normal;padding:5px 5px}
table.daftar.pas td.uang,table.daftar.pas td.tgl{white-space:nowrap;overflow-wrap:normal}
table.daftar.pas th{font-size:10.5px;letter-spacing:.03em}
table.daftar.pas td.pisah,table.daftar.pas th.pisah{min-width:8px;width:8px;padding:0}
/* dua kelompok kolom = dua panel terpisah (Joe 25 Nov 2026, contoh tabel Nirwana) - satu wadah gulir, baris kiri-kanan disamakan */
.wadah-dua{overflow:auto;max-height:calc(100dvh - 215px);min-height:220px;padding:2px 2px 6px}
.dua{display:flex;gap:18px;align-items:flex-start;width:max-content;min-width:100%}
.dua.pas{width:100%;min-width:0}
.dua>.panel{flex:0 0 auto;background:var(--kartu);border:1px solid var(--garis);border-radius:28px;overflow:clip;box-shadow:0 2px 10px #00000014}
.dua.pas>.panel{flex:1 1 0;min-width:0}
.dua>.panel table{border-collapse:separate;border-spacing:0;width:100%}
.dua thead{position:sticky;top:0;z-index:3}
.dua thead th{position:static!important}
.dua tr.grup th{text-align:center;font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--teks);padding:9px 8px}
.dua>.panel.a tr.grup th{background:color-mix(in srgb,#4da3ff 26%,var(--kartu))}
.dua>.panel.b tr.grup th{background:color-mix(in srgb,#5cc28f 26%,var(--kartu))}
.dua>.panel.a thead tr:not(.grup) th{background:color-mix(in srgb,#4da3ff 10%,var(--kartu))}
.dua>.panel.b thead tr:not(.grup) th{background:color-mix(in srgb,#5cc28f 10%,var(--kartu))}
table.daftar tr.bisa-klik{cursor:pointer}
table.daftar tr.bisa-klik:hover td{background:color-mix(in srgb,var(--biru,#4da3ff) 12%,transparent)}
table.daftar tr.dipilih td{background:color-mix(in srgb,var(--biru,#4da3ff) 20%,transparent)}
.panel-rinci{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.panel-rinci h2{font-size:18px;margin:6px 0 0;letter-spacing:.04em}
table.daftar td.batas,table.daftar th.batas{border-left:3px solid color-mix(in srgb,#5cc28f 60%,var(--garis))}
table.daftar td.uang{text-align:right;font-variant-numeric:tabular-nums}
table.daftar td.panjang{white-space:normal;min-width:200px;max-width:380px}
table.daftar tr.jumlah td{font-weight:700;border-bottom:0}
table.daftar tr.selisih td{font-weight:700}
table.daftar tr.jarak td{border:0;padding:6px}
table.daftar td.merah{color:var(--bad,#e5534b)}
table.daftar tr.hapus td.kanan{background:color-mix(in srgb,var(--bad,#e5534b) 16%,transparent)}
table.daftar tr.baru td{background:color-mix(in srgb,var(--warn,#e6b450) 14%,transparent)}
table.daftar td.pisah{border:0;min-width:14px;padding:0}
.lencana{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--garis)}
.lencana.ok{color:var(--ok,#5cc28f)} .lencana.awas{color:var(--warn,#e6b450)} .lencana.bad{color:var(--bad,#e5534b)}
.catatan{color:var(--redup);font-size:13.5px;line-height:1.5;margin:6px 0 12px;max-width:110ch}
.kosong{color:var(--redup);padding:24px;text-align:center}
@media (max-width:760px){.wadah-tabel{max-height:none}.kartu-r{min-height:110px}}

/* JINI REWARD scoped polish — 25 Nov 2026 rebase */
/* JINI — REWARD, baseline 2ab0a6d9. Presentation only.
   Preserve native full-width layout and samakan() row pairing. */
:root #utama { min-inline-size:0; }
:root #utama #judul {
  font-size:clamp(23px,2.2vw,30px);line-height:1.25;
  letter-spacing:.025em;overflow-wrap:anywhere;
}
:root #utama .jejak { gap:6px 8px;line-height:1.4; }
:root #utama .jejak a {
  display:inline-flex;align-items:center;box-sizing:border-box;
  min-height:36px;padding:6px 12px;border:1px solid var(--garis);
  border-radius:28px;max-width:100%;overflow-wrap:anywhere;
}
:root #utama .jejak>span { min-width:0;overflow-wrap:anywhere; }
:root #utama .kartu-r {
  display:grid;grid-template-columns:28px minmax(0,1fr);align-content:start;
  gap:7px 14px;min-width:0;padding:20px;border-radius:28px;
  box-shadow:var(--sv-card-shadow);text-align:left;
}
:root #utama .kartu-r::before {
  content:"";grid-column:1;grid-row:1/4;width:28px;height:28px;
  margin-top:2px;background:var(--biru);pointer-events:none;
  -webkit-mask:var(--reward-icon) center/contain no-repeat;
  mask:var(--reward-icon) center/contain no-repeat;
}
:root #utama .kartu-r>b,:root #utama .kartu-r>span {
  grid-column:2;min-width:0;white-space:normal;overflow-wrap:anywhere;
}
:root #utama .kartu-r>b { font-size:20px;line-height:1.3;letter-spacing:.02em; }
:root #utama .kartu-r>span { font-size:14px;line-height:1.5;letter-spacing:.01em; }
:root #utama .kartu-r>.angka { margin-top:3px;font-size:15px;line-height:1.45;letter-spacing:0; }
:root #utama .kartu-r:hover { background:var(--sv-hover,var(--kartu2));transform:none; }
:root #utama :is(a,button,select,input):focus-visible,
html body:has(#formAkses) .pop-saring :is(input,button):focus-visible {
  outline:2px solid var(--biru);outline-offset:3px;
}
:root #utama .ringkas .angka { min-width:0;box-sizing:border-box; }
:root #utama .ringkas .angka b {
  max-width:100%;white-space:nowrap;overflow-wrap:normal;
  overflow-x:auto;scrollbar-width:thin;letter-spacing:0;
}
:root #utama .ringkas .angka span { display:block;line-height:1.4;letter-spacing:.025em;overflow-wrap:anywhere; }
:root #utama .saring { min-width:0; }
:root #utama .saring :is(input,select) {
  box-sizing:border-box;font-size:16px;line-height:1.35;min-height:42px;
  border-radius:28px;background:var(--sv-input,var(--kartu));
}
:root #utama :is(.tombol-unduh,.tombol-hapus-saring) {
  box-sizing:border-box;min-height:40px;border-radius:28px;
  line-height:1.35;letter-spacing:.025em;max-width:100%;white-space:normal;
}
:root #utama :is(.wadah-tabel,.wadah-dua) {
  box-sizing:border-box;min-width:0;max-width:100%;
  overscroll-behavior-inline:contain;scrollbar-width:thin;
}
/* Round 2: override the shared display:block table rule. Real table layout
   can wrap text to the available width instead of clipping the last column. */
:root #utama .dua>.panel>table.daftar {
  display:table;max-width:none;overflow:visible;
}
/* Panels grow from their actual minimum content width. On narrow screens,
   the existing outer scroller keeps both panels and every cell reachable. */
:root #utama .dua.pas>.panel {
  flex:1 0 min-content;min-width:min-content;
}
/* Same horizontal inset on both sides; no row height or block-padding override. */
:root #utama .dua.pas>.panel>table.daftar :is(th,td):last-child {
  padding-inline-end:14px;
}
/* Compact mouse target, retaining the full native touch target and row height. */
@media(min-width:761px) and (hover:hover) and (pointer:fine) {
  :root #utama .dua.pas button.saring-kol { min-width:28px;width:28px; }
}
/* Narrow screens: same panels and reading order, stacked in the existing scroller.
   Native samakan() still gives corresponding rows the same height. */
@media(max-width:1100px) {
  :root #utama .dua.pas { flex-direction:column;gap:14px; }
  :root #utama .dua.pas>.panel { flex:0 0 auto;width:100%;box-sizing:border-box; }
}
/* Readable ink on the existing accent in both themes. */
html[data-svarna-theme="light"] body:has(#formAkses) { --sv-on-accent:#ffffff; }
html[data-svarna-theme="dark"] body:has(#formAkses) { --sv-on-accent:#111d27; }
/* These popup controls are mounted under body, outside #utama. */
html body:has(#formAkses) .pop-saring {
  box-sizing:border-box;border-radius:28px;padding:14px;
  max-width:calc(100vw - 16px);line-height:1.45;
  font-family:var(--font-ui,inherit);
}
html body:has(#formAkses) .pop-saring input[type=search] {
  box-sizing:border-box;min-width:0;width:100%;font-size:16px;
  min-height:42px;border-radius:28px;
}
html body:has(#formAkses) .pop-saring .daftar-nilai { min-height:0; }
html body:has(#formAkses) .pop-saring label { min-width:0;gap:8px;align-items:center; }
html body:has(#formAkses) .pop-saring label>span { min-width:0;overflow-wrap:anywhere; }
html body:has(#formAkses) .pop-saring input[type=checkbox] { flex:none;accent-color:var(--biru); }
html body:has(#formAkses) .pop-saring label small { flex:none; }
html body:has(#formAkses) .pop-saring .tombol { flex-wrap:wrap; }
html body:has(#formAkses) .pop-saring .tombol button {
  min-height:40px;border-radius:28px;box-sizing:border-box;
}
/* Keep the existing theme control above the access gate. */
html[data-svarna-theme] body:has(#formAkses):has(#gerbang-akses:not([hidden])) .atas { z-index:1001; }
html[data-svarna-theme] body:has(#formAkses) #gerbang-akses { padding-top:max(96px,env(safe-area-inset-top)); }
@media(max-width:600px) {
  html[data-svarna-theme] body:has(#formAkses) .atas .bungkus {
    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding-block:8px;
  }
  html[data-svarna-theme] body:has(#formAkses) .atas .merek {
    grid-column:1;grid-row:1;min-width:0;font-size:18px;letter-spacing:.12em;white-space:normal;
  }
  html[data-svarna-theme] body:has(#formAkses) .atas .waktu { grid-column:1;grid-row:2;margin:0; }
  html[data-svarna-theme] body:has(#formAkses) .atas #svarna-theme-toggle { grid-column:2;grid-row:1/3;margin:0;justify-self:end; }
  :root #utama .kartu-r { padding:18px;gap:7px 12px; }
  :root #utama .saring :is(input,select) { flex:1 1 100%;width:100%; }
  :root #utama :is(.jejak a,.tombol-unduh,.tombol-hapus-saring,.saring input,.saring select),
  html body:has(#formAkses) .pop-saring :is(input[type=search],.tombol button) { min-height:44px; }
  html body:has(#formAkses) .pop-saring label { min-height:40px; }
}
@media(prefers-reduced-motion:reduce) {
  :root #utama .kartu-r { transform:none!important;transition:none!important; }
}

      if (!CABANG_TAMPIL) berandaRingkas(isi);

<script>
  /* lapisan-bersama BEN 12 Nov 2026: gerak saat klik untuk semua halaman; halaman dengan gerak sendiri dilewati */
  (() => {
    if (window.__gerakGIO) return; window.__gerakGIO = true;
    const TEKAN = "button,.chip,[role=button]", BARIS = "tbody tr,.kartu,.kartu-po,.kotak,.prog-kartu,.pilihan,.riwayat>div",
      ANGKA = ".kpi b,.kotak .n,.angka3 b,.angka b", AKTIF = ".aktif,[aria-pressed=\"true\"]",
      MUAT = "h1,.sub,.kpi,.ringkas,.angka3,.chips,.alat,.tabel,.gulir,main>section";
    const redam = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let klikTerakhir = performance.now(), awal = true;
    const sesudahKlik = () => awal || performance.now() - klikTerakhir < 900;
    document.addEventListener("pointerdown", (e) => {
      klikTerakhir = performance.now(); awal = false;
      const b = e.target.closest(TEKAN); if (!b || redam) return;
      const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
      const s = document.createElement("span"); s.className = "riak";
      s.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
      b.appendChild(s); setTimeout(() => s.remove(), 650);
    }, true);
    document.addEventListener("click", () => { klikTerakhir = performance.now(); awal = false; }, true);
    const angkaLama = new Map();
    const kunciAngka = (b) => (b.closest("button,div,section") || b).textContent.replace(/[\d.,]/g, "").trim().slice(0, 60);
    const keAngka = (t) => { const m = (t || "").replace(/[^\d-]/g, ""); return m === "" || m === "-" ? NaN : +m; };
    const nfID = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
    const hitungNaik = (b, dari, ke) => {
      const t0 = performance.now(), lama = Math.min(900, 300 + Math.abs(ke - dari) * 12);
      const teks = b.textContent, cocok = /^[\d.,]+$/.test(teks.trim());
      const langkah = (t) => { const p = Math.min(1, (t - t0) / lama), e = 1 - Math.pow(1 - p, 3), v = Math.round(dari + (ke - dari) * e);
        if (cocok) b.textContent = nfID.format(v); if (p < 1) requestAnimationFrame(langkah); else if (cocok) b.textContent = teks; };
      requestAnimationFrame(langkah);
    };
    const urus = (n) => {
      if (!(n instanceof Element)) return;
      const semua = [n, ...n.querySelectorAll("*")];
      if (sesudahKlik() && !redam) {
        let i = 0;
        for (const x of semua) if (x.matches(BARIS) && !x.classList.contains("anim")) { x.style.setProperty("--i", i++); x.classList.add("anim"); }
        for (const x of semua) if (x.matches(AKTIF) && !awal) { x.classList.add("kilat"); x.addEventListener("animationend", () => x.classList.remove("kilat"), { once: true }); }
      }
      for (const b of semua) if (b.matches(ANGKA)) {
        const k = kunciAngka(b), baru = keAngka(b.textContent), lama = angkaLama.get(k);
        angkaLama.set(k, baru);
        if (lama !== undefined && !Number.isNaN(lama) && !Number.isNaN(baru) && lama !== baru && !redam) {
          b.classList.add("angka-ganti"); b.addEventListener("animationend", () => b.classList.remove("angka-ganti"), { once: true });
          hitungNaik(b, lama, baru);
        }
      }
    };
    new MutationObserver((ms) => { for (const m of ms) m.addedNodes.forEach(urus); }).observe(document.body, { childList: true, subtree: true });
    document.querySelectorAll(MUAT).forEach((x) => x.classList.add("muat"));
    urus(document.body);
    setTimeout(() => { awal = false; }, 1500);
  })();
</script>

</style><script data-svarna-theme="kontras">
(() => {
  // PENJAGA KONTRAS (BEN 14 Nov 2026): teks yang kontrasnya < 3 terhadap latar diganti ke tinta tema yang paling terbaca.
  const rgb = (s) => { const m = /rgba?\(([^)]+)\)/.exec(s || ""); if (!m) return null; const v = m[1].split(",").map(Number); return { r: v[0], g: v[1], b: v[2], a: v.length > 3 ? v[3] : 1 }; };
  const lum = (c) => { const f = (x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b); };
  const kontras = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const latar = (el) => { const lap = []; for (let e = el; e && e !== document.documentElement; e = e.parentElement) { const c = rgb(getComputedStyle(e).backgroundColor); if (c && c.a > 0) { lap.push(c); if (c.a >= 0.99) break; } }
    let h = rgb(getComputedStyle(document.body).backgroundColor) || { r: 255, g: 255, b: 255, a: 1 }; if (h.a < 0.99) h = { r: 255, g: 255, b: 255, a: 1 };
    for (const c of lap.reverse()) h = { r: c.r * c.a + h.r * (1 - c.a), g: c.g * c.a + h.g * (1 - c.a), b: c.b * c.a + h.b * (1 - c.a), a: 1 }; return h; };
  const GELAP = { r: 32, g: 48, b: 61 }, TERANG = { r: 236, g: 242, b: 246 };
  function periksa() {
    if (!document.body) return;
    for (const el of document.querySelectorAll("[data-kontras-bot]")) { el.style.removeProperty("color"); el.removeAttribute("data-kontras-bot"); }
    for (const el of document.body.querySelectorAll("*")) {
      if (el.closest(".merek-raksasa,svg,script,style") || !el.firstChild) continue;
      let ada = false; for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.trim()) { ada = true; break; }
      if (!ada) continue;
      const cs = getComputedStyle(el); if (cs.display === "none" || cs.visibility === "hidden") continue;
      const fg0 = rgb(cs.color); if (!fg0) continue; const bg = latar(el);
      const fg = fg0.a < 1 ? { r: fg0.r * fg0.a + bg.r * (1 - fg0.a), g: fg0.g * fg0.a + bg.g * (1 - fg0.a), b: fg0.b * fg0.a + bg.b * (1 - fg0.a) } : fg0;
      if (kontras(fg, bg) >= 3) continue;
      const t = kontras(GELAP, bg) >= kontras(TERANG, bg) ? GELAP : TERANG;
      el.style.setProperty("color", `rgb(${t.r},${t.g},${t.b})`, "important"); el.setAttribute("data-kontras-bot", "1");
    }
