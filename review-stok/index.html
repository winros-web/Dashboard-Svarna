<meta charset="utf-8"><script data-svarna-theme="v1">/* JINI: satu-satunya fungsi tambahan adalah preferensi tema. */
(() => {
  if (window.__svarnaThemeInstalled) return;
  window.__svarnaThemeInstalled = true;
  const key = 'svarna-dashboard-theme';
  const root = document.documentElement;
  const media = matchMedia('(prefers-color-scheme: dark)');
  let choice = null;
  try { const saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') choice = saved; } catch (_) {}
  let button;
  function apply(value) {
    root.dataset.theme = value;
    root.dataset.svarnaTheme = value;
    if (button) {
      const label = value === 'dark' ? 'TEMA TERANG' : 'TEMA GELAP';
      button.textContent = label;
      button.setAttribute('aria-label', 'GANTI KE ' + label);
      button.setAttribute('aria-pressed', String(value === 'dark'));
    }
  }
  apply(choice || (media.matches ? 'dark' : 'light'));
  media.addEventListener('change', () => { if (!choice) apply(media.matches ? 'dark' : 'light'); });
  addEventListener('storage', event => {
    if (event.key !== key) return;
    choice = ['light', 'dark'].includes(event.newValue) ? event.newValue : null;
    apply(choice || (media.matches ? 'dark' : 'light'));
  });
  function start() {
    button = document.createElement('button');
    button.id = 'svarna-theme-toggle'; button.type = 'button';
    button.addEventListener('click', () => {
      choice = root.dataset.svarnaTheme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, choice); } catch (_) {}
      apply(choice);
    });
    apply(root.dataset.svarnaTheme);
    const visible = node => node && node.getClientRects().length && getComputedStyle(node).visibility !== 'hidden';
    let ownBar = null;
    function mount() {
      const gate = [...document.querySelectorAll('#gerbang,#masuk')].find(visible);
      const top = [...document.querySelectorAll('.atas .kanan,.atas .bungkus,header.top .controls,header.top')].find(visible);
      if (gate || !top) {
        const host = gate || document.body;
        if (!ownBar) { ownBar = document.createElement('div'); ownBar.className = 'sv-tema-bilah'; }
        if (ownBar.parentElement !== host) host.prepend(ownBar);
        if (button.parentElement !== ownBar) ownBar.append(button);
      } else {
        if (button.parentElement !== top) top.append(button);
        if (ownBar && ownBar.isConnected) ownBar.remove();
      }
    }
    mount();
    let pending = false;
    new MutationObserver(() => {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; mount(); });
    }).observe(document.body, {childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class']});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
})();

body.layar-masuk { min-height: calc(100vh / var(--skala)); }

<script>
"use strict";
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const NAMA_KHUSUS = {DAANMOGOT: "Daan Mogot", "KALIMANTAN TIMUR": "Kalimantan Timur"};
const nama = s => NAMA_KHUSUS[s] || String(s || "").toLowerCase().replace(/(^|\s)\S/g, h => h.toUpperCase());
const angka = n => n == null ? "–" : Number(n).toLocaleString("id-ID", {maximumFractionDigits: 0});
const waktuWib = t => t ? new Date(t).toLocaleString("id-ID", {dateStyle: "long", timeStyle: "short", timeZone: "Asia/Jakarta"}) + " WIB" : "–";
let data = null, sandiAktif = null, ivData = null, gudangAktif = null, tabAktif = "risiko", cari = "", urut = {kolom: "risiko", turun: true}, terbuka = new Set();

async function buka(sandi) {
  const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error("Data tidak bisa diambil (" + r.status + ")");
  const p = await r.json();
  ivData = p.iv;
  const bahan = await crypto.subtle.importKey("raw", new TextEncoder().encode(sandi), "PBKDF2", false, ["deriveKey"]);
  const kunci = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(p.garam), iterations: p.iter, hash: "SHA-256"}, bahan, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  let polos;
  try { polos = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(p.iv)}, kunci, b64(p.isi)); }
  catch (e) { throw new Error("Sandi salah. Coba lagi."); }
  const aliran = new Blob([polos]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(aliran).text());
}

$("#masuk").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("#galat").textContent = "Sedang membuka…";
  try {
    data = await buka($("#sandi").value);
    sandiAktif = $("#sandi").value;
    document.body.classList.add("bot-siap");
    if (window.tanyaBotMasuk) window.tanyaBotMasuk("gudang", sandiAktif);
    $("#masuk").hidden = true; $("#isi").hidden = false;
    document.body.classList.remove("layar-masuk");
    gudangAktif = (location.hash.match(/#gudang-([A-Z ]+)/) || [])[1] || null;
    if (gudangAktif) gudangAktif = decodeURIComponent(gudangAktif);
    gambar();
    setInterval(cekTerbaru, 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) cekTerbaru(); });
  } catch (e) {
    $("#galat").textContent = e.message;
    $("#sandi").value = ""; $("#sandi").focus();
  }
});

async function cekTerbaru() {
  if (!data) return;
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return;
    const p = await r.json();
    const baru = terbuka_ ? p.dibuat !== data.dibuat : p.iv !== ivData;
    if (baru) {
      $("#pitaBaru").innerHTML = `<span>Ada data terbaru.</span><button class="tipis" onclick="perbarui()">Perbarui</button>`;
      $("#pitaBaru").hidden = false;
    }
  } catch (e) { /* coba lagi menit berikutnya */ }
}
async function perbarui() {
  try {
    data = terbuka_ ? await (await fetch("data.json?t=" + Date.now(), {cache: "no-store"})).json() : await buka(sandiAktif);
    $("#pitaBaru").hidden = true; gambar();
  } catch (e) { location.reload(); }
}

// Modul REVIEW STOK (Joe 4 Nov 2026): halaman terbuka tanpa layar sandi - data.json diterbitkan polos (tanpa nama pelanggan).
// Bila data.json ternyata terenkripsi (salinan di modul Gudang), layar sandi tetap dipakai.
let terbuka_ = false;
(async () => {
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return;
    const p = await r.json();
    if (p.isi && p.garam) return;          // terenkripsi: tunggu sandi
    terbuka_ = true; data = p;
    $("#masuk").hidden = true; $("#isi").hidden = false;
    document.body.classList.remove("layar-masuk");
    gudangAktif = (location.hash.match(/#gudang-([A-Z ]+)/) || [])[1] || null;
    if (gudangAktif) gudangAktif = decodeURIComponent(gudangAktif);
    gambar();
    setInterval(cekTerbaru, 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) cekTerbaru(); });
  } catch (e) { /* data belum ada: layar sandi tetap tampil */ }
})();

// ---------- tampilan ----------
function kepala() {
  const basi = data.desty_basi;
  const lencanaDesty = data.desty_waktu
    ? `<span class="lencana ${basi ? "kuning" : "hijau"}">Desty ${basi ? "basi " : ""}${data.desty_umur_menit} menit lalu</span>`
    : `<span class="lencana merah">Desty belum terbaca</span>`;
  return `<div class="atas"><div class="bungkus"><div class="merek">SVARNA DIPA</div><div class="kanan">
      <span class="lencana">Tahap ${esc(data.tahap)}</span>${lencanaDesty}
      <button class="tipis" onclick="location.reload()">Update</button></div></div></div>
    <div class="pita"><div class="bungkus">
      <div class="remah"><span>Gudang</span><span>Stok jual marketplace</span>${gudangAktif ? `<span>${esc(nama(gudangAktif))}</span>` : ""}</div>
      <h1>${gudangAktif ? esc(nama(gudangAktif)) : "Stok yang boleh dijual"}</h1>
      <div class="sub">Stok Accurate dikurangi pesanan (SO) yang belum dikirim = stok yang benar-benar boleh dijual. Dibandingkan dengan yang ditayangkan Desty ke Shopee, TikTok, dan Blibli. Data Accurate ${esc(waktuWib(data.so_terakhir))}.</div>
    </div></div>`;
}

function gambar() {
  const isi = [kepala(), '<div class="bungkus">'];
  if (!gudangAktif) {
    const r = data.ringkasan;
    const tot = k => Object.values(r).reduce((a, x) => a + (x[k] || 0), 0);
    isi.push(`<div class="angka-kecil">
      <div>SKU berisiko oversell<b class="merah">${angka(tot("sku_risiko"))}</b></div>
      <div>SKU sudah rebutan<b class="kuning">${angka(tot("sku_kurang"))}</b></div>
      <div>Pesanan online tertahan<b class="merah">${angka(tot("online_tertahan"))}</b></div>
      <div>Gudang pengirim<b>${data.gudang.length}</b></div></div>
      <div class="penjelasan"><b>Risiko oversell</b> = Desty masih menayangkan lebih banyak dari stok yang boleh dijual, jadi marketplace bisa menerima pesanan yang tidak ada barangnya. <b>Sudah rebutan</b> = SO yang belum dikirim sudah melebihi stok fisik gudang; pesanan online di SKU itu tercatat sebagai <b>tertahan</b>.</div>
      <h2>Pilih gudang</h2><div class="pilih">`);
    for (const g of data.gudang) {
      const x = r[g];
      isi.push(`<button class="cab" onclick="pilihGudang('${g}')"><div class="nama">${esc(nama(g))}</div>
        <div class="nilai ${x.sku_risiko ? "merah" : "hijau"}">${angka(x.sku_risiko)}<span>SKU risiko</span></div>
        <div class="ket">Cabang ${esc(nama(x.cabang))} · rebutan ${angka(x.sku_kurang)} · online tertahan ${angka(x.online_tertahan)}</div></button>`);
    }
    isi.push("</div>");
    if (data.perubahan && data.perubahan.length) {
      isi.push(`<h2>Perubahan stok boleh dijual (7 hari)</h2><table><thead><tr><th>Waktu</th><th>Gudang</th><th>Kode</th><th class="angka">Lama</th><th class="angka">Baru</th><th>Sebab</th></tr></thead><tbody>`);
      for (const p of data.perubahan.slice(0, 100)) {
        isi.push(`<tr><td>${esc(waktuWib(p.waktu))}</td><td>${esc(nama(p.gudang))}</td><td>${esc(p.kode)}</td><td class="angka">${angka(p.lama)}</td><td class="angka ${p.baru < p.lama ? "merah" : "hijau"}">${angka(p.baru)}</td><td class="nama">${esc(p.sebab)}</td></tr>`);
      }
      isi.push("</tbody></table>");
    }
  } else {
    const x = data.ringkasan[gudangAktif];
    isi.push(`<div class="alat"><button class="tipis" onclick="pilihGudang(null)">‹ Semua gudang</button>
      <button class="tipis ${tabAktif === "risiko" ? "aktif" : ""}" onclick="pilihTab('risiko')">Risiko oversell (${angka(x.sku_risiko)})</button>
      <button class="tipis ${tabAktif === "kurang" ? "aktif" : ""}" onclick="pilihTab('kurang')">Sudah rebutan (${angka(x.sku_kurang)})</button>
      <button class="tipis ${tabAktif === "so" ? "aktif" : ""}" onclick="pilihTab('so')">Ada SO terbuka (${angka(x.sku_so_terbuka)})</button>
      <button class="tipis ${tabAktif === "semua" ? "aktif" : ""}" onclick="pilihTab('semua')">Semua SKU (${angka(x.sku)})</button>
      <input id="cari" placeholder="Cari kode / nama" value="${esc(cari)}" oninput="cari=this.value; tabel()"></div><div id="tabel"></div>`);
  }
  isi.push("</div>");
  $("#isi").innerHTML = isi.join("");
  if (gudangAktif) tabel();
  window.scrollTo(0, 0);
}

function pilihGudang(g) { gudangAktif = g; cari = ""; terbuka.clear(); history.replaceState(null, "", g ? "#gudang-" + encodeURIComponent(g) : "#"); gambar(); }
function pilihTab(t) { tabAktif = t; urut = t === "kurang" ? {kolom: "kurang", turun: true} : {kolom: "risiko", turun: true}; gambar(); }
function urutkan(k) { urut = urut.kolom === k ? {kolom: k, turun: !urut.turun} : {kolom: k, turun: true}; tabel(); }
function bukaTutup(k) { terbuka.has(k) ? terbuka.delete(k) : terbuka.add(k); tabel(); }

function tabel() {
  const q = cari.trim().toLowerCase();
  let baris = data.baris.filter(b => b.gudang === gudangAktif);
  if (tabAktif === "risiko") baris = baris.filter(b => (b.risiko || 0) > 0);
  else if (tabAktif === "kurang") baris = baris.filter(b => b.kurang);
  else if (tabAktif === "so") baris = baris.filter(b => b.so_qty > 0);
  if (q) baris = baris.filter(b => (b.kode + " " + b.nama).toLowerCase().includes(q));
  const k = urut.kolom;
  baris.sort((a, b) => { const x = a[k] ?? -1e18, y = b[k] ?? -1e18; return (typeof x === "string" ? x.localeCompare(y) : x - y) * (urut.turun ? -1 : 1); });
  const th = (label, kolom, kelas = "") => `<th class="${kelas}" onclick="urutkan('${kolom}')">${label}${urut.kolom === kolom ? (urut.turun ? " ▼" : " ▲") : ""}</th>`;
  const h = [`<table><thead><tr>${th("Kode", "kode")}${th("Nama", "nama")}${th("Fisik Accurate", "fisik", "angka")}${th("SO belum kirim", "so_qty", "angka")}${th("Boleh dijual", "boleh_jual", "angka")}${th("Tayang Desty", "desty_tayang", "angka")}${th("Risiko oversell", "risiko", "angka")}${th("Kurang", "kurang", "angka")}</tr></thead><tbody>`];
  if (!baris.length) h.push(`<tr><td colspan="8" class="kosong">Tidak ada</td></tr>`);
  for (const b of baris.slice(0, 500)) {
    const tert = b.online_tertahan || [];
    const risikoKelas = (b.risiko || 0) > 0 ? "merah" : (b.risiko == null ? "" : "hijau");
    h.push(`<tr onclick="bukaTutup('${esc(b.kode)}')" style="cursor:pointer"><td><b>${esc(b.kode)}</b>${tert.length ? ` <span class="lencana merah">${tert.length} online tertahan</span>` : ""}</td><td class="nama" title="${esc(b.nama)}">${esc(b.nama)}</td>
      <td class="angka">${angka(b.fisik)}</td><td class="angka">${angka(b.so_qty)}</td><td class="angka ${b.boleh_jual > 0 ? "hijau" : "merah"}"><b>${angka(b.boleh_jual)}</b></td>
      <td class="angka">${angka(b.desty_tayang)}</td><td class="angka ${risikoKelas}">${b.risiko == null ? "tidak ada di Desty" : angka(b.risiko)}</td><td class="angka ${b.kurang ? "kuning" : ""}">${b.kurang ? angka(b.kurang) : ""}</td></tr>`);
    if (terbuka.has(b.kode)) {
      const rinci = [`Desty: onHand ${angka(b.desty_onhand)}, reserved ${angka(b.desty_reserved)}, tayang ${angka(b.desty_tayang)}. Cadangan gudang ${angka(b.cadangan)}.`];
      if (tert.length) rinci.push("Pesanan online yang tertahan: " + tert.map(o => `<code>${esc(o.nomor)}</code> ${esc(o.tanggal || "")} (${angka(o.qty)})`).join(", "));
      h.push(`<tr class="rinci"><td colspan="8">${rinci.join("<br>")}</td></tr>`);
    }
  }
  if (baris.length > 500) h.push(`<tr><td colspan="8" class="kosong">Menampilkan 500 dari ${angka(baris.length)}; persempit dengan kotak cari.</td></tr>`);
  h.push("</tbody></table>");
  $("#tabel").innerHTML = h.join("");
}
</script>
<style>/* lapisan-bersama BEN 12 Nov 2026 */

h1{--m:0s}.sub{--m:.07s}.kpi,.ringkas,.angka3{--m:.14s}.chips{--m:.21s}.alat{--m:.28s}.tabel,.gulir,main>section{--m:.35s}

<script>
  /* lapisan-bersama BEN 12 Nov 2026: gerak saat klik untuk semua halaman; halaman dengan gerak sendiri dilewati */
  (() => {
    if (window.__gerakGIO) return; window.__gerakGIO = true;
    const TEKAN = "button,.chip,[role=button]", BARIS = "tbody tr,.kartu,.kartu-po,.kotak,.prog-kartu,.pilihan,.riwayat>div",
      ANGKA = ".kpi b,.kotak .n,.angka3 b,.angka b", AKTIF = ".aktif,[aria-pressed=\"true\"]",
      MUAT = "h1,.sub,.kpi,.ringkas,.angka3,.chips,.alat,.tabel,.gulir,main>section";
    const redam = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let klikTerakhir = performance.now(), awal = true;
    const sesudahKlik = () => awal || performance.now() - klikTerakhir < 900;
    document.addEventListener("pointerdown", (e) => {
      klikTerakhir = performance.now(); awal = false;
      const b = e.target.closest(TEKAN); if (!b || redam) return;
      const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
      const s = document.createElement("span"); s.className = "riak";
      s.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
      b.appendChild(s); setTimeout(() => s.remove(), 650);
    }, true);
    document.addEventListener("click", () => { klikTerakhir = performance.now(); awal = false; }, true);
    const angkaLama = new Map();
    const kunciAngka = (b) => (b.closest("button,div,section") || b).textContent.replace(/[\d.,]/g, "").trim().slice(0, 60);
    const keAngka = (t) => { const m = (t || "").replace(/[^\d-]/g, ""); return m === "" || m === "-" ? NaN : +m; };
    const nfID = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
    const hitungNaik = (b, dari, ke) => {
      const t0 = performance.now(), lama = Math.min(900, 300 + Math.abs(ke - dari) * 12);
      const teks = b.textContent, cocok = /^[\d.,]+$/.test(teks.trim());
      const langkah = (t) => { const p = Math.min(1, (t - t0) / lama), e = 1 - Math.pow(1 - p, 3), v = Math.round(dari + (ke - dari) * e);
        if (cocok) b.textContent = nfID.format(v); if (p < 1) requestAnimationFrame(langkah); else if (cocok) b.textContent = teks; };
      requestAnimationFrame(langkah);
    };
    const urus = (n) => {
      if (!(n instanceof Element)) return;
      const semua = [n, ...n.querySelectorAll("*")];
      if (sesudahKlik() && !redam) {
        let i = 0;
        for (const x of semua) if (x.matches(BARIS) && !x.classList.contains("anim")) { x.style.setProperty("--i", i++); x.classList.add("anim"); }
        for (const x of semua) if (x.matches(AKTIF) && !awal) { x.classList.add("kilat"); x.addEventListener("animationend", () => x.classList.remove("kilat"), { once: true }); }
      }
      for (const b of semua) if (b.matches(ANGKA)) {
        const k = kunciAngka(b), baru = keAngka(b.textContent), lama = angkaLama.get(k);
        angkaLama.set(k, baru);
        if (lama !== undefined && !Number.isNaN(lama) && !Number.isNaN(baru) && lama !== baru && !redam) {
          b.classList.add("angka-ganti"); b.addEventListener("animationend", () => b.classList.remove("angka-ganti"), { once: true });
          hitungNaik(b, lama, baru);
        }
      }
    };
    new MutationObserver((ms) => { for (const m of ms) m.addedNodes.forEach(urus); }).observe(document.body, { childList: true, subtree: true });
    document.querySelectorAll(MUAT).forEach((x) => x.classList.add("muat"));
    urus(document.body);
    setTimeout(() => { awal = false; }, 1500);
  })();
</script>

html[data-svarna-theme] :is(.atas,.atas-merek,#gerbang,#masuk){background:var(--bg)!important;color:var(--teks)!important;border-color:var(--garis)}
html[data-svarna-theme] :is(.cab,.toko button,.card,.kartu,.panel,.kpi,.vonis,.audit-kotak,#panelBot,#kotak-kode,#kotak-faktur,#pemilih){background:var(--kartu);color:var(--teks);border-color:var(--garis)}
html[data-svarna-theme] :is(.btn,button.tipis,.chip,#svarna-theme-toggle){background:var(--kartu2);color:var(--teks);border-color:var(--garis)}
html[data-svarna-theme] :is(.btn.utama,.btn.primary){background:var(--sv-accent-fill);color:var(--teks);border-color:var(--sv-accent-line)}
html[data-svarna-theme] :is(input:not([type=checkbox]):not([type=radio]),select,textarea){background:var(--sv-input);color:var(--teks);border-color:var(--garis)}
html[data-svarna-theme] :is(th,tfoot td){background:var(--kartu2);color:var(--teks2)}
html[data-svarna-theme] :is(.cab .ket,.atas .waktu,.sub,.catatan,.muted,.redup){color:var(--redup)}
html[data-svarna-theme] :is(.cab:hover,.toko button:hover,.chip.aktif){background:var(--sv-hover);color:var(--teks)}
html[data-svarna-theme] :is(.pita,.msg){background:var(--warn-soft);color:var(--teks2)}
html[data-svarna-theme] .merek-raksasa{color:var(--sv-heading)}  /* Joe 14 Nov: efek sorot Bugatti dikembalikan */
html[data-svarna-theme] .merek-raksasa svg{max-height:90px}
html[data-svarna-theme] .merek-raksasa text{font-family:var(--font-ui);font-weight:800}
/* Joe 14 Nov 2026 09.4x "EFEK CAHAYA BUGATI NYA DI BAGUSIN LAGI ... EFEK NYA JADI TIDAK TERLIHAT": sorot elips lebar yang
   terang penuh di sekitar mouse dan memudar halus; huruf di luar sorot tetap samar terlihat (18%) sehingga merek selalu
   terbaca. Warna merek lebih tegas per tema, butiran derau tetap. Sebelum mouse bergerak sorot di tengah; layar sentuh
   (HP) sorot berjalan sendiri bolak-balik. */
html[data-svarna-theme] .merek-raksasa{--sorot-x:50%;
  -webkit-mask-image:radial-gradient(ellipse 24% 300% at var(--sorot-x) 50%,#000 0%,#000 40%,rgba(0,0,0,.45) 70%,rgba(0,0,0,.18) 100%);
  mask-image:radial-gradient(ellipse 24% 300% at var(--sorot-x) 50%,#000 0%,#000 40%,rgba(0,0,0,.45) 70%,rgba(0,0,0,.18) 100%)}
html[data-svarna-theme] .merek-raksasa svg{opacity:.92!important}
html[data-svarna-theme="light"] .merek-raksasa{color:#2f3f4c}
html[data-svarna-theme="dark"] .merek-raksasa{color:#eef3f7}
@media (hover:none){html[data-svarna-theme] .merek-raksasa{animation:sorot-jalan 6s ease-in-out infinite alternate}}
/* Joe 14 Nov 2026 15.0x (modul IKLAN, tema terang): "KALO MOUSE NYA SAYA ARAHIN KE LIST NYA ITEM GAK KELIHATAN" - sorot baris
   dan tombol saat mouse di atasnya dulu berwarna gelap tetap (#1b2630/#253641); kini ikut tema, berlaku semua halaman. */
html[data-svarna-theme] tbody tr:hover>td,html[data-svarna-theme] tbody tr:hover>th{background:var(--sv-hover)!important;color:var(--teks)}
html[data-svarna-theme="light"] tbody tr:is(.belum,.keliru):hover>td{background:#f3d9d9!important}
html[data-svarna-theme="dark"] tbody tr:is(.belum,.keliru):hover>td{background:#291c1f!important}
html[data-svarna-theme] tbody tr:hover>td.sela{background:var(--bg)!important}
html[data-svarna-theme] :where(.btn,button.tipis,.chip):hover{background:var(--sv-hover);color:var(--teks)}
html[data-svarna-theme] #gerbang{zoom:1;font-family:var(--font-ui)}
html[data-svarna-theme] #gerbang form{gap:24px;padding:24px 0;min-height:calc(100% - 58px)}
html[data-svarna-theme] #gerbang :is(input,button){border-radius:8px;color:var(--teks);border-color:var(--garis);font-family:var(--font-ui);font-size:18px}
html[data-svarna-theme] #gerbang .kolom label{color:var(--teks2);font-family:var(--font-ui)}
html[data-svarna-theme] #gerbang :is(.catatan-masuk,#ketMasuk){color:var(--redup)}
.sv-tema-bilah{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;align-items:center;min-height:52px;padding:8px 20px;border-bottom:1px solid var(--garis);background:var(--bg);box-sizing:border-box;width:100%}
html[data-svarna-theme] #svarna-theme-toggle{font:600 13px/1.3 var(--font-ui);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--garis);border-radius:6px;padding:9px 12px;min-height:36px;height:auto;white-space:nowrap;cursor:pointer}
html[data-svarna-theme] #svarna-theme-toggle:hover{background:var(--sv-hover);border-color:var(--aksen)}
html[data-svarna-theme] #svarna-theme-toggle:focus-visible{outline:2px solid var(--aksen);outline-offset:3px}
.wrap{max-width:none!important;width:100%;box-sizing:border-box;padding-inline:20px;gap:12px}
.wrap>*{min-width:0}.tbl-wrap{min-width:0;max-width:100%;overflow:auto}
nav.tabs{flex-wrap:wrap;gap:4px;padding-bottom:6px;overflow:visible}
.tab{border-radius:5px 5px 0 0;font-size:14px;padding:9px 12px}
.tab[aria-selected="true"]{background:var(--kartu2)}
.kpi .k,.card .note,.ctl,.formgrid label{font-size:13px}.kpi .v{font-family:var(--font-ui);font-size:24px;letter-spacing:0}
@media(max-width:700px){.wrap{padding-inline:12px}.sv-tema-bilah{padding-inline:12px}html[data-svarna-theme] #svarna-theme-toggle{min-height:40px}.tab{min-height:40px}nav.tabs{gap:2px}.tab{padding:8px;font-size:13px}.controls{width:100%}.controls .ctl{min-width:0;flex:1}.controls select{max-width:100%}}

html[data-svarna-theme] .audit-kotak{border-left-color:var(--sv-warn)}
html[data-svarna-theme] h2{color:var(--teks2);letter-spacing:.045em}
/* Kontras dan ukuran layar sandi mengikuti tema; tidak mengubah form/akun/sandi. */
html[data-svarna-theme] #gerbang input,
html[data-svarna-theme] #gerbang input:focus,
html[data-svarna-theme] #masuk input,
html[data-svarna-theme] #masuk input:focus{background:var(--sv-input);color:var(--teks);border:1px solid var(--garis);border-radius:8px;font-family:var(--font-ui);font-size:18px}
html[data-svarna-theme] #gerbang .kolom label,
html[data-svarna-theme] #masuk .kolom-sandi label{color:var(--teks2);font-family:var(--font-ui)}
html[data-svarna-theme] #masuk input::placeholder{color:var(--redup)}
html[data-svarna-theme] #masuk button{border:1px solid var(--garis);border-radius:8px;background:var(--kartu2);color:var(--teks)}
html[data-svarna-theme] #gerbang .merek-raksasa,
html[data-svarna-theme] #masuk .merek-raksasa,
html[data-svarna-theme] #masuk .raksasa{width:calc(100% - 32px);color:var(--sv-heading);opacity:1;flex-shrink:0}  /* Joe 14 Nov: efek sorot Bugatti + SVARNA DIPA ELEKTRONIK */
html[data-svarna-theme] #gerbang .merek-raksasa svg,
html[data-svarna-theme] #masuk .merek-raksasa svg,
html[data-svarna-theme] #masuk .raksasa svg{width:100%;height:64px;opacity:.7}
html[data-svarna-theme] #masuk{position:relative;box-sizing:border-box;min-height:100dvh;padding-top:76px;gap:24px}
html[data-svarna-theme] #masuk>.sv-tema-bilah{position:absolute;top:0;left:0;min-height:54px;background:transparent;border:0;pointer-events:none}
html[data-svarna-theme] #masuk>.sv-tema-bilah button{pointer-events:auto}
@media(max-width:700px){
 html[data-svarna-theme] #gerbang form{justify-content:flex-start;padding-top:42px;gap:28px}
 html[data-svarna-theme] #masuk{justify-content:flex-start;padding-top:100px}
 html[data-svarna-theme] #gerbang .merek-raksasa svg,
 html[data-svarna-theme] #masuk .merek-raksasa svg,
 html[data-svarna-theme] #masuk .raksasa svg{height:28px}
 html[data-svarna-theme] #gerbang .isi-masuk{gap:12px}
}
html[data-svarna-theme="light"] :is(td .audit-nilai .salah,td.calon button.aksi.salah,#kotak-kode .btn.merah){color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
html[data-svarna-theme] :is(.rk,.gulir,.tbl-wrap){scrollbar-width:thin;scrollbar-color:var(--redup) var(--kartu2)}
html[data-svarna-theme] :is(.rk,.gulir,.tbl-wrap)::-webkit-scrollbar{height:8px;width:8px}
html[data-svarna-theme] :is(.rk,.gulir,.tbl-wrap)::-webkit-scrollbar-thumb{background:var(--redup);border-radius:4px}
html[data-svarna-theme] :is(.rk,.gulir,.tbl-wrap)::-webkit-scrollbar-track{background:var(--kartu2)}
@media(max-width:700px){html[data-svarna-theme] :is(main,.web-bungkus,.atas .bungkus){padding-left:12px!important;padding-right:12px!important}}
</style>
<style data-svarna-theme="kontras">
/* Audit tampilan 14 Nov 2026 (Joe "AUDIT TOTAL"): isian ikut tema; tabel HP tidak melebarkan halaman */
html[data-svarna-theme] :is(input:not([type=checkbox]):not([type=radio]):not([type=range]),textarea,select){background-color:var(--sv-input)!important;color:var(--teks)!important;border-color:var(--garis)!important}
html[data-svarna-theme] :is(input,textarea)::placeholder{color:var(--redup)!important;opacity:1}
@media(max-width:700px){html[data-svarna-theme] :not(.rk):not(.gulir):not(.tbl-wrap)>table:not(#t){display:block;max-width:100%;overflow-x:auto}}
</style><script data-svarna-theme="kontras">
(() => {
  // PENJAGA KONTRAS (BEN 14 Nov 2026): teks yang kontrasnya < 3 terhadap latar diganti ke tinta tema yang paling terbaca.
  const rgb = (s) => { const m = /rgba?\(([^)]+)\)/.exec(s || ""); if (!m) return null; const v = m[1].split(",").map(Number); return { r: v[0], g: v[1], b: v[2], a: v.length > 3 ? v[3] : 1 }; };
  const lum = (c) => { const f = (x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b); };
  const kontras = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const latar = (el) => { const lap = []; for (let e = el; e && e !== document.documentElement; e = e.parentElement) { const c = rgb(getComputedStyle(e).backgroundColor); if (c && c.a > 0) { lap.push(c); if (c.a >= 0.99) break; } }
    let h = rgb(getComputedStyle(document.body).backgroundColor) || { r: 255, g: 255, b: 255, a: 1 }; if (h.a < 0.99) h = { r: 255, g: 255, b: 255, a: 1 };
    for (const c of lap.reverse()) h = { r: c.r * c.a + h.r * (1 - c.a), g: c.g * c.a + h.g * (1 - c.a), b: c.b * c.a + h.b * (1 - c.a), a: 1 }; return h; };
  const GELAP = { r: 32, g: 48, b: 61 }, TERANG = { r: 236, g: 242, b: 246 };
  function periksa() {
    if (!document.body) return;
    for (const el of document.querySelectorAll("[data-kontras-bot]")) { el.style.removeProperty("color"); el.removeAttribute("data-kontras-bot"); }
    for (const el of document.body.querySelectorAll("*")) {
      if (el.closest(".merek-raksasa,svg,script,style") || !el.firstChild) continue;
      let ada = false; for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.trim()) { ada = true; break; }
      if (!ada) continue;
      const cs = getComputedStyle(el); if (cs.display === "none" || cs.visibility === "hidden") continue;
      const fg0 = rgb(cs.color); if (!fg0) continue; const bg = latar(el);
      const fg = fg0.a < 1 ? { r: fg0.r * fg0.a + bg.r * (1 - fg0.a), g: fg0.g * fg0.a + bg.g * (1 - fg0.a), b: fg0.b * fg0.a + bg.b * (1 - fg0.a) } : fg0;
      if (kontras(fg, bg) >= 3) continue;
      const t = kontras(GELAP, bg) >= kontras(TERANG, bg) ? GELAP : TERANG;
      el.style.setProperty("color", `rgb(${t.r},${t.g},${t.b})`, "important"); el.setAttribute("data-kontras-bot", "1");
    }
  }
  let jeda = 0;
  const jadwal = () => { clearTimeout(jeda); jeda = setTimeout(() => requestAnimationFrame(periksa), 250); };
  const mulai = () => { jadwal(); new MutationObserver((m) => { if (m.every((x) => x.type === "attributes" && x.attributeName === "data-kontras-bot")) return; jadwal(); })
    .observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-svarna-theme", "class", "hidden"] }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mulai, { once: true }); else mulai();
})();
</script>
