(() => {
  if (window.__svarnaThemeInstalled) return;
  window.__svarnaThemeInstalled = true;
  const key = 'svarna-dashboard-theme';
  const root = document.documentElement;
  const media = matchMedia('(prefers-color-scheme: dark)');
  let choice = null;
  try { const saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') choice = saved; } catch (_) {}
  let button;
  function apply(value) {
    root.dataset.theme = value;
    root.dataset.svarnaTheme = value;
    if (button) {
      const label = value === 'dark' ? 'TEMA TERANG' : 'TEMA GELAP';
      button.textContent = label;
      button.setAttribute('aria-label', 'GANTI KE ' + label);
      button.setAttribute('aria-pressed', String(value === 'dark'));
    }
  }
  apply(choice || (media.matches ? 'dark' : 'light'));
  media.addEventListener('change', () => { if (!choice) apply(media.matches ? 'dark' : 'light'); });
  addEventListener('storage', event => {
    if (event.key !== key) return;
    choice = ['light', 'dark'].includes(event.newValue) ? event.newValue : null;
    apply(choice || (media.matches ? 'dark' : 'light'));
  });
  function start() {
    button = document.createElement('button');
    button.id = 'svarna-theme-toggle'; button.type = 'button';
    button.addEventListener('click', () => {
      choice = root.dataset.svarnaTheme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, choice); } catch (_) {}
      apply(choice);
    });
    apply(root.dataset.svarnaTheme);
    const visible = node => node && node.getClientRects().length && getComputedStyle(node).visibility !== 'hidden';
    let ownBar = null;
    function mount() {
      const gate = [...document.querySelectorAll('#gerbang,#masuk')].find(visible);
      const top = [...document.querySelectorAll('.atas .kanan,.atas .bungkus,header.top .controls,header.top')].find(visible);
      if (gate || !top) {
        const host = gate || document.body;
        if (!ownBar) { ownBar = document.createElement('div'); ownBar.className = 'sv-tema-bilah'; }
        if (ownBar.parentElement !== host) host.prepend(ownBar);
        if (button.parentElement !== ownBar) ownBar.append(button);
      } else {
        if (button.parentElement !== top) top.append(button);
        if (ownBar && ownBar.isConnected) ownBar.remove();
      }
    }
    mount();
    let pending = false;
    new MutationObserver(() => {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; mount(); });
    }).observe(document.body, {childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class']});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
})();

<script>
(async () => {
  const akar = document.getElementById("pb");
  const nf = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 2 });
  const tglId = (s) => s ? new Date(s + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }) : "";
  const el = (tag, at = {}, ...anak) => {
    const n = document.createElement(tag);

      if (v == null || v === false) continue;
      if (k === "text") n.textContent = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);

  try { D = await (await fetch("data/pabrik.json")).json(); }
  catch (e) { akar.replaceChildren(el("p", { class: "sub", text: "Data tidak bisa dibuka: " + e.message })); return; }

  const S = { cabang: "", cari: { pesan: "", po: "", datang: "" }, urut: {} };
  try { const c = new URLSearchParams(location.search).get("cabang"); if (c) S.cabang = c.toUpperCase(); } catch (e) {}
  const namaCab = (c) => c.split(" ").map((w) => w[0] + w.slice(1).toLowerCase()).join(" ");
  const cabangSemua = () => [...new Set([...(window.pesananPusat || D.pesanan), ...D.po, ...D.datang].map((r) => r.cabang))].sort();

  // tiap tabel: kolom [judul, kunci, angka?]
  const TABEL = {
    pesan: { judul: "Pesanan bulan " + D.bulan_teks, ket: "Pengajuan cabang bulan ini yang sudah di-approve pusat PT Svarna Dipa (modul Pengajuan PO), per barang per cabang tujuan.",
      kolom: [["Cabang", "cabang"], ["Kode", "item"], ["Nama barang", "nama"], ["Qty", "qty", 1], ["Program", "program"], ["Status", "status"]], get baris() { return window.pesananPusat || D.pesanan; }, jumlah: "qty" },
    po: { judul: "PO belum diterima penuh", ket: "Sisa pesanan pembelian di sistem kami yang barangnya belum datang (PO " + D.po_hari + " hari terakhir).",
      kolom: [["Tanggal", "tgl"], ["No. PO", "nomor"], ["Cabang", "cabang"], ["Kode", "item"], ["Nama barang", "nama"], ["Sisa qty", "sisa", 1]], baris: D.po, jumlah: "sisa" },
    datang: { judul: "Barang sudah diterima", ket: "Penerimaan barang (faktur pembelian) sejak " + tglId(D.datang_dari) + ".",
      kolom: [["Tanggal", "tgl"], ["No. faktur", "nomor"], ["Cabang", "cabang"], ["Kode", "item"], ["Nama barang", "nama"], ["Qty", "qty", 1]], baris: D.datang, jumlah: "qty" },
  };
  const saring = (id) => {
    const q = S.cari[id].trim().toUpperCase();
    return TABEL[id].baris.filter((r) => (!S.cabang || r.cabang === S.cabang) &&
      (!q || [r.item, r.nama, r.nomor, r.program].some((v) => String(v || "").toUpperCase().includes(q))));
  };

  function unduh(id) {
    const t = TABEL[id], rows = urutkan(id, saring(id));
    const sel = (v) => /[";\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v ?? "");
    const isi = [t.kolom.map((k) => k[0]), ...rows.map((r) => t.kolom.map((k) => r[k[1]]))].map((b) => b.map(sel).join(";")).join("\r\n");
    const a = el("a", { href: URL.createObjectURL(new Blob(["﻿" + isi], { type: "text/csv" })),
      download: D.merek + " - " + t.judul + (S.cabang ? " - " + S.cabang : "") + ".csv" });
    document.body.append(a); a.click(); a.remove();
  }
  function urutkan(id, rows) {
    const u = S.urut[id]; if (!u) return rows;
    const [k, arah] = u;
    return [...rows].sort((a, b) => (typeof a[k] === "number" ? a[k] - b[k] : String(a[k] || "").localeCompare(String(b[k] || ""))) * arah);
  }
  function tabel(id) {
    const t = TABEL[id], rows = urutkan(id, saring(id));
    const kepala = el("tr", {}, t.kolom.map(([j, k, a]) => el("th", { class: a ? "a" : null, scope: "col", onclick: () => {
      const u = S.urut[id]; S.urut[id] = [k, u && u[0] === k ? -u[1] : 1]; gambar(); }, text: j + (S.urut[id] && S.urut[id][0] === k ? (S.urut[id][1] > 0 ? " ▲" : " ▼") : "") })));
    const badan = rows.length ? rows.map((r) => el("tr", {}, t.kolom.map(([, k, a]) => el("td", { class: a ? "a" : k === "nama" ? "nama" : null },
      a ? nf.format(r[k]) : k === "tgl" ? tglId(r[k]) : k === "cabang" ? namaCab(r[k]) : k === "program" && r[k] ? el("span", { class: "pill", text: r[k] }) : r[k] || ""))))
      : [el("tr", {}, el("td", { colspan: t.kolom.length, class: "kosong", text: "Tidak ada baris" + (S.cabang ? " untuk cabang " + namaCab(S.cabang) : "") + "." }))];
    if (rows.length > 1) badan.push(el("tr", { class: "jumlah" }, t.kolom.map(([, k], i) => el("td", { class: k === t.jumlah ? "a" : null,
      text: i === 0 ? "Jumlah (" + nf.format(rows.length) + " baris)" : k === t.jumlah ? nf.format(rows.reduce((s, r) => s + r[k], 0)) : "" }))));
    return el("section", {}, el("h2", { text: t.judul }), el("p", { class: "ket", text: t.ket }),
      el("div", { class: "alat" },
        el("input", { type: "search", placeholder: "Cari kode / nama / nomor…", value: S.cari[id], "aria-label": "Cari di " + t.judul,
          oninput: (e) => { S.cari[id] = e.target.value; const pos = e.target.selectionStart; gambar(); const n = document.querySelector('[data-cari="' + id + '"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, "data-cari": id }),
        el("button", { class: "unduh", type: "button", onclick: () => unduh(id), text: "Unduh Excel (CSV)" })),
      el("div", { class: "gulir" }, el("table", {}, el("thead", {}, kepala), el("tbody", {}, badan))));
  }
  function kotak(l, n, k) { return el("div", { class: "kotak" }, el("div", { class: "l", text: l }), el("div", { class: "n", text: nf.format(n) }), el("div", { class: "k", text: k })); }
  function gambar() {
    window.gambarPabrik = gambar;
    const sp = saring("pesan"), so = saring("po"), sd = saring("datang");
    const sum = (rs, k) => rs.reduce((a, r) => a + r[k], 0);
    akar.replaceChildren(
      el("h1", { text: "Pesanan Pembelian " + D.merek }),
      el("p", { class: "sub", text: "PT Svarna Dipa · PO dari modul Pengajuan PO pusat, diperbarui otomatis tiap menit." }),
      ...[].concat(window.isiVendor ? window.isiVendor() : el("p", { class: "sub", text: "Memuat…" })));
    return;
    akar.replaceChildren(
      el("h1", { text: "Pesanan Pembelian " + D.merek }),
      el("p", { class: "sub", text: "PT Svarna Dipa · data per " + tglId(D.per) + (S.cabang ? " · cabang " + namaCab(S.cabang) : " · semua cabang") }),
      el("div", { class: "chips", role: "group", "aria-label": "Pilih cabang" },
        [["", "Semua cabang"], ...cabangSemua().map((c) => [c, namaCab(c)])].map(([c, n]) => el("button", { class: "chip", type: "button", "aria-pressed": String(S.cabang === c),
          onclick: () => { S.cabang = c; try { const u = new URL(location.href); c ? u.searchParams.set("cabang", c) : u.searchParams.delete("cabang"); history.replaceState(null, "", u); } catch (e) {} gambar(); } },
          n, el("b", { text: nf.format(jumlahCab(c)) })))),
      el("div", { class: "ringkas" },
        kotak("Pesanan bulan ini", sum(sp, "qty"), "unit · " + nf.format(sp.length) + " baris"),

        kotak("Sudah diterima", sum(sd, "qty"), "unit sejak " + tglId(D.datang_dari))),
      (window.seksiProgram ? window.seksiProgram() : el("div", { id: "programPabrik" })), tabel("pesan"), tabel("po"), tabel("datang"));
  }

<script>
  /* lapisan-bersama BEN 12 Nov 2026: gerak saat klik untuk semua halaman; halaman dengan gerak sendiri dilewati */
  (() => {
    if (window.__gerakGIO) return; window.__gerakGIO = true;
    const TEKAN = "button,.chip,[role=button]", BARIS = "tbody tr,.kartu,.kartu-po,.kotak,.prog-kartu,.pilihan,.riwayat>div",
      ANGKA = ".kpi b,.kotak .n,.angka3 b,.angka b", AKTIF = ".aktif,[aria-pressed=\"true\"]",
      MUAT = "h1,.sub,.kpi,.ringkas,.angka3,.chips,.alat,.tabel,.gulir,main>section";
    const redam = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let klikTerakhir = performance.now(), awal = true;
    const sesudahKlik = () => awal || performance.now() - klikTerakhir < 900;
    document.addEventListener("pointerdown", (e) => {
      klikTerakhir = performance.now(); awal = false;
      const b = e.target.closest(TEKAN); if (!b || redam) return;
      const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
      const s = document.createElement("span"); s.className = "riak";
      s.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
      b.appendChild(s); setTimeout(() => s.remove(), 650);
    }, true);
    document.addEventListener("click", () => { klikTerakhir = performance.now(); awal = false; }, true);
    const angkaLama = new Map();
    const kunciAngka = (b) => (b.closest("button,div,section") || b).textContent.replace(/[\d.,]/g, "").trim().slice(0, 60);
    const keAngka = (t) => { const m = (t || "").replace(/[^\d-]/g, ""); return m === "" || m === "-" ? NaN : +m; };
    const nfID = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
    const hitungNaik = (b, dari, ke) => {
      const t0 = performance.now(), lama = Math.min(900, 300 + Math.abs(ke - dari) * 12);
      const teks = b.textContent, cocok = /^[\d.,]+$/.test(teks.trim());
      const langkah = (t) => { const p = Math.min(1, (t - t0) / lama), e = 1 - Math.pow(1 - p, 3), v = Math.round(dari + (ke - dari) * e);
        if (cocok) b.textContent = nfID.format(v); if (p < 1) requestAnimationFrame(langkah); else if (cocok) b.textContent = teks; };
      requestAnimationFrame(langkah);
    };
    const urus = (n) => {
      if (!(n instanceof Element)) return;
      const semua = [n, ...n.querySelectorAll("*")];
      if (sesudahKlik() && !redam) {
        let i = 0;
        for (const x of semua) if (x.matches(BARIS) && !x.classList.contains("anim")) { x.style.setProperty("--i", i++); x.classList.add("anim"); }
        for (const x of semua) if (x.matches(AKTIF) && !awal) { x.classList.add("kilat"); x.addEventListener("animationend", () => x.classList.remove("kilat"), { once: true }); }
      }
      for (const b of semua) if (b.matches(ANGKA)) {
        const k = kunciAngka(b), baru = keAngka(b.textContent), lama = angkaLama.get(k);
        angkaLama.set(k, baru);
        if (lama !== undefined && !Number.isNaN(lama) && !Number.isNaN(baru) && lama !== baru && !redam) {
          b.classList.add("angka-ganti"); b.addEventListener("animationend", () => b.classList.remove("angka-ganti"), { once: true });
          hitungNaik(b, lama, baru);
        }
      }
    };
    new MutationObserver((ms) => { for (const m of ms) m.addedNodes.forEach(urus); }).observe(document.body, { childList: true, subtree: true });
    document.querySelectorAll(MUAT).forEach((x) => x.classList.add("muat"));
    urus(document.body);
    setTimeout(() => { awal = false; }, 1500);
  })();
</script>

(() => {
  // PENJAGA KONTRAS (BEN 14 Nov 2026): teks yang kontrasnya < 3 terhadap latar diganti ke tinta tema yang paling terbaca.
  const rgb = (s) => { const m = /rgba?\(([^)]+)\)/.exec(s || ""); if (!m) return null; const v = m[1].split(",").map(Number); return { r: v[0], g: v[1], b: v[2], a: v.length > 3 ? v[3] : 1 }; };
  const lum = (c) => { const f = (x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b); };
  const kontras = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const latar = (el) => { const lap = []; for (let e = el; e && e !== document.documentElement; e = e.parentElement) { const c = rgb(getComputedStyle(e).backgroundColor); if (c && c.a > 0) { lap.push(c); if (c.a >= 0.99) break; } }
    let h = rgb(getComputedStyle(document.body).backgroundColor) || { r: 255, g: 255, b: 255, a: 1 }; if (h.a < 0.99) h = { r: 255, g: 255, b: 255, a: 1 };
    for (const c of lap.reverse()) h = { r: c.r * c.a + h.r * (1 - c.a), g: c.g * c.a + h.g * (1 - c.a), b: c.b * c.a + h.b * (1 - c.a), a: 1 }; return h; };
  const GELAP = { r: 32, g: 48, b: 61 }, TERANG = { r: 236, g: 242, b: 246 };
  function periksa() {
    if (!document.body) return;
    for (const el of document.querySelectorAll("[data-kontras-bot]")) { el.style.removeProperty("color"); el.removeAttribute("data-kontras-bot"); }
    for (const el of document.body.querySelectorAll("*")) {
      if (el.closest(".merek-raksasa,svg,script,style") || !el.firstChild) continue;
      let ada = false; for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.trim()) { ada = true; break; }
      if (!ada) continue;
      const cs = getComputedStyle(el); if (cs.display === "none" || cs.visibility === "hidden") continue;
      const fg0 = rgb(cs.color); if (!fg0) continue; const bg = latar(el);

      if (kontras(fg, bg) >= 3) continue;
      const t = kontras(GELAP, bg) >= kontras(TERANG, bg) ? GELAP : TERANG;

<script>
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function buka(sandi) {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Data tidak bisa diambil (' + r.status + ')');
    const p = await r.json();
    const bahan = await crypto.subtle.importKey('raw', new TextEncoder().encode(sandi), 'PBKDF2', false, ['deriveKey']);
    const kunci = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.garam), iterations: p.iter, hash: 'SHA-256' },
      bahan, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let polos;
    try { polos = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, kunci, b64(p.isi)); }
    catch (e) { throw new Error('Sandi salah. Coba lagi.'); }
    const aliran = new Blob([polos]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(aliran).text());
  }
  // halaman dashboard membaca data/<nama>.json lewat fetch: dilayani dari paket yang sudah dibuka
  function pasangHalaman(paket) {
    const BERKAS = paket.berkas, asli = window.fetch.bind(window);
    window.fetch = (u, o) => {
      const p = String(u).split('?')[0].replace(/^\.\//, '');
      if (p in BERKAS) return Promise.resolve(new Response(BERKAS[p], { headers: { 'content-type': 'application/json' } }));
      if (p.startsWith('data/')) return Promise.resolve(new Response('', { status: 404 }));
      return asli(u, o);
    };
    const isi = document.getElementById('isi');
    const t = document.getElementById('halaman').content.cloneNode(true);
    const skrip = [...t.querySelectorAll('script')];
    skrip.forEach((s) => s.remove());
    const judul = t.querySelector('title');
    if (judul) { document.title = judul.textContent; judul.remove(); }
    isi.appendChild(t);
    isi.hidden = false;
    skrip.forEach((s) => { const n = document.createElement('script'); n.textContent = s.textContent; isi.appendChild(n); });
  }
  document.getElementById('masuk').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const g = document.getElementById('galat');
    g.textContent = 'Sedang membuka…';
    try {
      const sandiIsi = document.getElementById('sandi').value.replace(/\s+/g, '').toUpperCase();
      const paket = await buka(sandiIsi);
      window.isianPabrik = isianPabrik(sandiIsi);
      document.getElementById('masuk').remove();
      document.getElementById('webDibuat').textContent = new Date(paket.dibuat).toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
      document.getElementById('webKaki').hidden = false;
      pasangHalaman(paket);
      if (window.mulaiProgram) window.mulaiProgram();
    } catch (e) {
      g.textContent = e.message;
      document.getElementById('sandi').value = '';
      document.getElementById('sandi').focus();
    }
  });
  document.getElementById('webKeluar').addEventListener('click', (e) => { e.preventDefault(); location.reload(); });
</script>

      el("label", { style: "margin-bottom:10px" }, "Catatan / syarat (boleh kosong)", el("input", { value: f.catatan, placeholder: "mis. bonus 2% bila target tercapai", oninput: set("catatan") })),
      el("div", { class: "prog-ket", text: "Barang & target unit yang harus dibelanjakan selama program (kosongkan bila berlaku umum)." }),
      el("datalist", { id: "progBarangList" }, barang.slice(0, 2000).map((b) => el("option", { value: b.item, text: b.nama }))),
      f.barang.map(barisItem),
      el("div", { class: "prog-aksi" },
        el("button", { class: "prog", type: "button", text: "+ Tambah barang", onclick: () => { f.barang.push({ item: "", nama: "", target: "" }); gambarUlang(); } }),
        el("span", { class: "pesan", text: pesanForm }),
        el("button", { class: "prog", type: "button", text: "Batal", onclick: () => { form = null; pesanForm = ""; gambarUlang(); } }),
        el("button", { class: "prog utama", type: "button", text: f.id ? "Simpan perubahan" : "Simpan program", onclick: simpan })));
  }
  async function simpan() {
    const f = form;
    if (!f.nama.trim()) { pesanForm = "Nama program wajib diisi."; return gambarUlang(); }
    if (f.dari && f.sampai && f.sampai < f.dari) { pesanForm = "Tanggal Sampai lebih awal dari Mulai."; return gambarUlang(); }
    const isi = f.barang.filter((b) => b.item);
    for (const b of isi) if (!(+b.target > 0)) { pesanForm = "Isi target unit untuk " + b.item + "."; return gambarUlang(); }
    const dok = { merek: MEREK, nama: f.nama.trim().toUpperCase(), dari: f.dari || null, sampai: f.sampai || null, catatan: f.catatan.trim(),
      barang: isi.map((b) => ({ item: b.item, nama: b.nama || namaBarang(b.item), target: Math.round(+b.target) })), diubah: new Date().toISOString() };
    const id = f.id || ("pv" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    try { await isian.tulis(KOLEKSI, id, "set", dok); form = null; pesanForm = ""; await segar(); }
    catch (e) { pesanForm = "Gagal menyimpan: " + e.message; gambarUlang(); }
  }

  window.seksiProgram = () => {
    const daftar = Object.entries(program).filter(([, p]) => p && p.merek === MEREK).sort((a, b) => String(b[1].diubah || "").localeCompare(String(a[1].diubah || "")));
    return el("section", { id: "programPabrik" },
      el("h2", { text: "Program " + MEREK }),
      el("p", { class: "ket", text: "Program pembelian dari pabrik: nama, masa berlaku, barang & target unit. Sales cabang memilih program ini saat mengajukan PO; capaian dihitung dari pengajuan mereka." }),
      status === "gagal" ? el("div", { class: "prog-kosong", text: "Modul Program tidak tersambung ke Mac (isian bersama). Muat ulang halaman atau hubungi bagian pembelian." })
      : status === "memuat" ? el("div", { class: "prog-kosong", text: "Memuat program…" })
      : [form ? formulir() : el("div", { class: "prog-aksi", style: "margin-bottom:10px" }, el("button", { class: "prog utama", type: "button", text: "+ Program baru", onclick: () => { form = { nama: "", dari: hariIni(), sampai: "", catatan: "", barang: [{ item: "", nama: "", target: "" }] }; pesanForm = ""; gambarUlang(); } })),
         daftar.length ? daftar.map(([id, p]) => kartu(id, p)) : el("div", { class: "prog-kosong", text: "Belum ada program. Klik + Program baru." })]);
  };
})();
</script>

<script>
  (() => {
    const f = document.getElementById("masuk"), s = document.getElementById("sandi");
    if (!f || !s) return;
    f.style.visibility = "hidden"; s.value = "TERBUKA";
    const k = document.getElementById("webKeluar"); if (k) k.hidden = true;
    f.requestSubmit();
  })();
</script>
</body>
