<html lang="id" data-theme="dark"><head><meta charset="utf-8"><script data-svarna-theme="v1">/* JINI: satu-satunya fungsi tambahan adalah preferensi tema. */
(() => {
  if (window.__svarnaThemeInstalled) return;
  window.__svarnaThemeInstalled = true;
  const key = 'svarna-dashboard-theme';
  const root = document.documentElement;
  const media = matchMedia('(prefers-color-scheme: dark)');
  let choice = null;
  try { const saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') choice = saved; } catch (_) {}
  let button;
  function apply(value) {
    root.dataset.theme = value;
    root.dataset.svarnaTheme = value;
    if (button) {
      const label = value === 'dark' ? 'TEMA TERANG' : 'TEMA GELAP';
      button.textContent = label;
      button.setAttribute('aria-label', 'GANTI KE ' + label);
      button.setAttribute('aria-pressed', String(value === 'dark'));
    }
  }
  apply(choice || (media.matches ? 'dark' : 'light'));
  media.addEventListener('change', () => { if (!choice) apply(media.matches ? 'dark' : 'light'); });
  addEventListener('storage', event => {
    if (event.key !== key) return;
    choice = ['light', 'dark'].includes(event.newValue) ? event.newValue : null;
    apply(choice || (media.matches ? 'dark' : 'light'));
  });
  function start() {
    button = document.createElement('button');
    button.id = 'svarna-theme-toggle'; button.type = 'button';
    button.addEventListener('click', () => {
      choice = root.dataset.svarnaTheme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, choice); } catch (_) {}
      apply(choice);
    });
    apply(root.dataset.svarnaTheme);
    const visible = node => node && node.getClientRects().length && getComputedStyle(node).visibility !== 'hidden';
    let ownBar = null;
    function mount() {
      const gate = [...document.querySelectorAll('#gerbang,#masuk')].find(visible);
      const top = [...document.querySelectorAll('.atas .kanan,.atas .bungkus,header.top .controls,header.top')].find(visible);
      if (gate || !top) {
        const host = gate || document.body;
        if (!ownBar) { ownBar = document.createElement('div'); ownBar.className = 'sv-tema-bilah'; }
        if (ownBar.parentElement !== host) host.prepend(ownBar);
        if (button.parentElement !== ownBar) ownBar.append(button);
      } else {
        if (button.parentElement !== top) top.append(button);
        if (ownBar && ownBar.isConnected) ownBar.remove();
      }
    }
    mount();
    let pending = false;
    new MutationObserver(() => {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; mount(); });
    }).observe(document.body, {childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class']});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
})();

<style>

:root{color-scheme:dark;--bg:#11171d;--kartu:#18212a;--garis:#2a3642;--teks:#e6ecf1;--redup:#9aa8b5;--biru:#6fb3d2;--ok:#7ad39a;--warn:#f2c14e;--bad:#f08a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--teks);font:17px/1.45 "Aptos Narrow","Archivo Narrow","Arial Narrow",system-ui,sans-serif;letter-spacing:.03em;text-transform:uppercase;-webkit-font-smoothing:antialiased}

.toko dt{color:var(--redup)} .toko dd{margin:0;text-align:right}
.toko dd.turun{color:var(--warn)} .toko dd.hasil{color:var(--ok);font-weight:700}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}

.catatan li{margin:2px 0}

<script type="text/plain" id="gio-utama">
(async () => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, atribut, ...anak) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(atribut || {})) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
    e.append(...anak);
    return e;
  };
  const rp = (v) => Math.round(v || 0).toLocaleString("id-ID");
  const tgl = (iso) => iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4);
  const ambil = (n) => fetch("data/" + n + ".json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(n + " " + r.status); return r.json(); });
  let faktur, meta;
  try { [faktur, meta] = await Promise.all(["faktur", "meta"].map(ambil)); }
  catch (e) { $("pesan-halaman").hidden = false; $("pesan-halaman").textContent = "Data gagal dimuat: " + (e.message || e); $("sub").textContent = ""; return; }

  const P = meta.persen / 100;
  const POT = "Potongan " + rp(meta.persen) + "%";  // nama kolom diskon item (Joe 13 Nov 2026)
  const TSD = "Total sesudah diskon " + rp(meta.persen) + "%";
  // diskon item: faktur yang sudah diedit = angka Accurate; yang belum = perkiraan jumlah barang x persen
  for (const f of faktur) {
    f.dis = f.ok ? f.kotor - f.j : Math.round(f.kotor * P);
    f.akhir = f.ok ? f.tot : f.kotor - f.dis - f.d;
  }
  const jumlah = (daftar, kunci) => daftar.reduce((a, f) => a + (f[kunci] || 0), 0);
  const milik = (kode) => kode ? faktur.filter((f) => f.k === kode) : faktur;
  const pendek = (kode) => kode.replace(/^[^.]*\./, "");
  const kepala = (tabel, judul) => tabel.append(el("thead", {}, el("tr", {}, ...judul.map(([t, a]) => el("th", a ? { class: "a", text: t } : { text: t })))));
  const sel = (teks, kelas) => el("td", kelas ? { class: kelas, text: teks } : { text: teks });

  const tanggal = faktur.map((f) => f.t).sort();
  $("sub").textContent = meta.judul + " · " + faktur.length + " faktur bertanggal "
    + (tanggal.length ? tgl(tanggal[0]) + " s.d. " + tgl(tanggal[tanggal.length - 1]) : "-") + " · " + meta.database;
  $("catatan").append(...(meta.catatan || []).map((t) => el("li", { text: t })));

  // lima lembar (Joe 12 Nov 2026): nama, urutan, dan keterangan dari paket data
  const KOTAK = meta.lembar;
  const STATUS = [["semua", "Semua", () => true], ["belum", "Belum diskon item", (f) => !f.ok], ["sudah", "Sudah diskon item", (f) => f.ok],
    ["promo", "Ada potongan promo", (f) => f.d > 0], ["lunas", "Lunas", (f) => f.s === "Lunas"], ["piutang", "Belum lunas", (f) => f.s !== "Lunas"]];
  let pilihToko = "", pilihStatus = "semua";

  function gambarLembar() {
    $("lembar").replaceChildren(...KOTAK.map(([kode, nama, ket]) => {
      const b = el("button", { type: "button", title: ket || nama, class: kode === pilihToko ? "aktif" : "" }, el("b", { text: String(milik(kode).length) }), el("span", { text: nama }));
      b.addEventListener("click", () => { pilihToko = kode; gambar(); });
      return b;
    }));
  }
  function gambarKotak() {
    $("toko").replaceChildren(...KOTAK.map(([kode, nama, ket]) => {
      const d = milik(kode), sudah = d.filter((f) => f.ok).length;
      const baris = (label, nilai, kelas) => [el("dt", { text: label }), el("dd", kelas ? { class: kelas, text: nilai } : { text: nilai })];
      const b = el("button", { type: "button", class: kode === pilihToko ? "aktif" : "" },
        el("span", { class: "nm", text: kode ? pendek(kode) : "Gabungan" }), el("span", { class: "ket", text: kode ? ket : "Semua toko" }),
        el("span", { class: "besar", text: "Rp " + rp(jumlah(d, "tot")) }),
        el("dl", {}, ...baris("Faktur", String(d.length)), ...baris("Sudah diskon item", sudah + " dari " + d.length),
          ...baris("Diskon item " + rp(meta.persen) + "%", "- " + rp(jumlah(d, "dis")), "turun"),
          ...baris("Potongan promo", "- " + rp(jumlah(d, "d"))),
          ...baris(TSD, rp(jumlah(d, "akhir")), "hasil")));
      b.addEventListener("click", () => { pilihToko = kode; gambar(); });
      return b;
    }));
  }
  const tersaring = () => {
    const uji = STATUS.find((s) => s[0] === pilihStatus)[2], kata = $("cari").value.trim().toUpperCase();
    return milik(pilihToko).filter((f) => uji(f) && (!kata || f.n.toUpperCase().includes(kata) || f.b.toUpperCase().includes(kata)));
  };
  function gambarTanggal() {
    const d = milik(pilihToko), t = $("t-tanggal");
    $("judul-rinci").textContent = KOTAK.find((k) => k[0] === pilihToko)[1] + " · rincian per tanggal faktur";
    t.replaceChildren();
    kepala(t, [["Tanggal"], ["Faktur", 1], ["Lunas", 1], ["Jumlah barang (Rp)", 1], [POT + " (Rp)", 1], ["Potongan promo (Rp)", 1], ["Total sekarang (Rp)", 1], [TSD + " (Rp)", 1]]);
    const badan = el("tbody");
    const satu = (label, x) => el("tr", {}, sel(label), sel(String(x.length), "a"), sel(String(x.filter((f) => f.s === "Lunas").length), "a"), sel(rp(jumlah(x, "kotor")), "a"),
      sel(rp(jumlah(x, "dis")), "a turun"), sel(rp(jumlah(x, "d")), "a"), sel(rp(jumlah(x, "tot")), "a"), sel(rp(jumlah(x, "akhir")), "a hasil"));
    for (const h of [...new Set(d.map((f) => f.t))].sort()) badan.append(satu(tgl(h), d.filter((f) => f.t === h)));
    t.append(badan, el("tfoot", {}, satu("Jumlah", d)));
  }
  function gambarFaktur() {
    $("chip-status").replaceChildren(...STATUS.map(([id, label, uji]) => {
      const c = el("button", { class: "chip" + (id === pilihStatus ? " aktif" : ""), type: "button", text: label }, el("small", { text: String(milik(pilihToko).filter(uji).length) }));
      c.addEventListener("click", () => { pilihStatus = id; gambarFaktur(); });
      return c;
    }));
    const baris = tersaring(), t = $("t-faktur");
    t.replaceChildren();
    kepala(t, [["No", 1], ["Tanggal"], ["Nomor faktur"], ["Toko"], ["Status"], ["Jumlah barang (Rp)", 1], [POT + " (Rp)", 1], ["Potongan promo (Rp)", 1], ["Total sekarang (Rp)", 1], [TSD + " (Rp)", 1], ["Diskon item"], ["Barang"]]);
    const badan = el("tbody");
    baris.forEach((f, i) => badan.append(el("tr", {}, sel(String(i + 1), "a"), sel(tgl(f.t)), el("td", { class: "mono", text: f.n }), sel(pendek(f.k)), sel(f.s),
      sel(rp(f.kotor), "a"), sel(rp(f.dis), "a turun"), sel(f.d ? rp(f.d) : "-", "a"), sel(rp(f.tot), "a"), sel(rp(f.akhir), "a hasil"),
      el("td", {}, el("span", { class: "pill" + (f.ok ? " ok" : ""), text: f.ok ? "Sudah" : "Belum" })), sel(f.b, "brg"))));
    t.append(badan, el("tfoot", {}, el("tr", {}, sel(""), sel("Jumlah"), sel(baris.length + " faktur"), sel(""), sel(""), sel(rp(jumlah(baris, "kotor")), "a"), sel(rp(jumlah(baris, "dis")), "a turun"),
      sel(rp(jumlah(baris, "d")), "a"), sel(rp(jumlah(baris, "tot")), "a"), sel(rp(jumlah(baris, "akhir")), "a hasil"), sel(""), sel(""))));
  }
  function gambar() { gambarLembar(); gambarKotak(); gambarTanggal(); gambarFaktur(); }
  $("cari").addEventListener("input", gambarFaktur);
  $("unduh").addEventListener("click", () => {
    const esc = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const judul = ["Tanggal", "Nomor faktur", "Toko", "Status", "Jumlah barang", POT, "Potongan promo", "Total sekarang", TSD, "Sisa piutang", "Sudah diskon item", "Barang"];
    const isi = tersaring().map((f) => [tgl(f.t), f.n, f.k, f.s, f.kotor, f.dis, f.d, f.tot, f.akhir, f.sisa, f.ok ? "Sudah" : "Belum", f.b].map(esc).join(";"));
    const teks = "﻿" + [judul.map(esc).join(";"), ...isi].join("\r\n");
    const a = el("a", { href: URL.createObjectURL(new Blob([teks], { type: "text/csv;charset=utf-8" })), download: "Faktur Nirwana " + new Date().toISOString().slice(0, 10) + ".csv" });
    document.body.append(a); a.click(); a.remove();
  });
  gambar();
})();
</script>

<script type="text/plain" id="gio-utama">
(() => {
  const API = "https://svarna5s-mac-mini.tail7a15d8.ts.net/api/perbarui";

  function buat() {

    const btn = document.createElement("button");
    btn.className = "btn"; btn.type = "button"; btn.textContent = "⟳ Perbarui semua data";
    btn.addEventListener("click", async () => {
      btn.disabled = true; info.style.color = ""; info.textContent = "meminta Mac…";
      try {

<script type="text/plain" id="gio-utama">
  /* lapisan-bersama BEN 12 Nov 2026: gerak saat klik untuk semua halaman; halaman dengan gerak sendiri dilewati */
  (() => {
    if (window.__gerakGIO) return; window.__gerakGIO = true;
    const TEKAN = "button,.chip,[role=button]", BARIS = "tbody tr,.kartu,.kartu-po,.kotak,.prog-kartu,.pilihan,.riwayat>div",
      ANGKA = ".kpi b,.kotak .n,.angka3 b,.angka b", AKTIF = ".aktif,[aria-pressed=\"true\"]",
      MUAT = "h1,.sub,.kpi,.ringkas,.angka3,.chips,.alat,.tabel,.gulir,main>section";
    const redam = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let klikTerakhir = performance.now(), awal = true;
    const sesudahKlik = () => awal || performance.now() - klikTerakhir < 900;
    document.addEventListener("pointerdown", (e) => {
      klikTerakhir = performance.now(); awal = false;
      const b = e.target.closest(TEKAN); if (!b || redam) return;
      const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
      const s = document.createElement("span"); s.className = "riak";
      s.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
      b.appendChild(s); setTimeout(() => s.remove(), 650);
    }, true);
    document.addEventListener("click", () => { klikTerakhir = performance.now(); awal = false; }, true);
    const angkaLama = new Map();
    const kunciAngka = (b) => (b.closest("button,div,section") || b).textContent.replace(/[\d.,]/g, "").trim().slice(0, 60);
    const keAngka = (t) => { const m = (t || "").replace(/[^\d-]/g, ""); return m === "" || m === "-" ? NaN : +m; };
    const nfID = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
    const hitungNaik = (b, dari, ke) => {
      const t0 = performance.now(), lama = Math.min(900, 300 + Math.abs(ke - dari) * 12);
      const teks = b.textContent, cocok = /^[\d.,]+$/.test(teks.trim());
      const langkah = (t) => { const p = Math.min(1, (t - t0) / lama), e = 1 - Math.pow(1 - p, 3), v = Math.round(dari + (ke - dari) * e);
        if (cocok) b.textContent = nfID.format(v); if (p < 1) requestAnimationFrame(langkah); else if (cocok) b.textContent = teks; };
      requestAnimationFrame(langkah);
    };
    const urus = (n) => {
      if (!(n instanceof Element)) return;
      const semua = [n, ...n.querySelectorAll("*")];
      if (sesudahKlik() && !redam) {
        let i = 0;
        for (const x of semua) if (x.matches(BARIS) && !x.classList.contains("anim")) { x.style.setProperty("--i", i++); x.classList.add("anim"); }
        for (const x of semua) if (x.matches(AKTIF) && !awal) { x.classList.add("kilat"); x.addEventListener("animationend", () => x.classList.remove("kilat"), { once: true }); }
      }
      for (const b of semua) if (b.matches(ANGKA)) {
        const k = kunciAngka(b), baru = keAngka(b.textContent), lama = angkaLama.get(k);
        angkaLama.set(k, baru);
        if (lama !== undefined && !Number.isNaN(lama) && !Number.isNaN(baru) && lama !== baru && !redam) {
          b.classList.add("angka-ganti"); b.addEventListener("animationend", () => b.classList.remove("angka-ganti"), { once: true });
          hitungNaik(b, lama, baru);
        }
      }
    };
    new MutationObserver((ms) => { for (const m of ms) m.addedNodes.forEach(urus); }).observe(document.body, { childList: true, subtree: true });
    document.querySelectorAll(MUAT).forEach((x) => x.classList.add("muat"));
    urus(document.body);
    setTimeout(() => { awal = false; }, 1500);
  })();
</script>

</style><script data-svarna-theme="kontras">
(() => {
  // PENJAGA KONTRAS (BEN 14 Nov 2026): teks yang kontrasnya < 3 terhadap latar diganti ke tinta tema yang paling terbaca.
  const rgb = (s) => { const m = /rgba?\(([^)]+)\)/.exec(s || ""); if (!m) return null; const v = m[1].split(",").map(Number); return { r: v[0], g: v[1], b: v[2], a: v.length > 3 ? v[3] : 1 }; };
  const lum = (c) => { const f = (x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b); };
  const kontras = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const latar = (el) => { const lap = []; for (let e = el; e && e !== document.documentElement; e = e.parentElement) { const c = rgb(getComputedStyle(e).backgroundColor); if (c && c.a > 0) { lap.push(c); if (c.a >= 0.99) break; } }
    let h = rgb(getComputedStyle(document.body).backgroundColor) || { r: 255, g: 255, b: 255, a: 1 }; if (h.a < 0.99) h = { r: 255, g: 255, b: 255, a: 1 };
    for (const c of lap.reverse()) h = { r: c.r * c.a + h.r * (1 - c.a), g: c.g * c.a + h.g * (1 - c.a), b: c.b * c.a + h.b * (1 - c.a), a: 1 }; return h; };
  const GELAP = { r: 32, g: 48, b: 61 }, TERANG = { r: 236, g: 242, b: 246 };
  function periksa() {
    if (!document.body) return;
    for (const el of document.querySelectorAll("[data-kontras-bot]")) { el.style.removeProperty("color"); el.removeAttribute("data-kontras-bot"); }
    for (const el of document.body.querySelectorAll("*")) {
      if (el.closest(".merek-raksasa,svg,script,style") || !el.firstChild) continue;
      let ada = false; for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.trim()) { ada = true; break; }
      if (!ada) continue;
      const cs = getComputedStyle(el); if (cs.display === "none" || cs.visibility === "hidden") continue;
      const fg0 = rgb(cs.color); if (!fg0) continue; const bg = latar(el);
      const fg = fg0.a < 1 ? { r: fg0.r * fg0.a + bg.r * (1 - fg0.a), g: fg0.g * fg0.a + bg.g * (1 - fg0.a), b: fg0.b * fg0.a + bg.b * (1 - fg0.a) } : fg0;
      if (kontras(fg, bg) >= 3) continue;
      const t = kontras(GELAP, bg) >= kontras(TERANG, bg) ? GELAP : TERANG;
      el.style.setProperty("color", `rgb(${t.r},${t.g},${t.b})`, "important"); el.setAttribute("data-kontras-bot", "1");
    }
  }
  let jeda = 0;
  const jadwal = () => { clearTimeout(jeda); jeda = setTimeout(() => requestAnimationFrame(periksa), 250); };
  const mulai = () => { jadwal(); new MutationObserver((m) => { if (m.every((x) => x.type === "attributes" && x.attributeName === "data-kontras-bot")) return; jadwal(); })
    .observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-svarna-theme", "class", "hidden"] }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mulai, { once: true }); else mulai();
})();
</script>

<script>
(() => {
  const API = "https://svarna5s-mac-mini.tail7a15d8.ts.net", HTTP = "http://100.98.122.77:8791", KUNCI = "tanya-bot-svarna";
  const $ = (i) => document.getElementById(i), isi = $("pbIsi");
  let sesi = null, riwayat = [], sibuk = false, pakaiHistori = true;
  try { sesi = JSON.parse(sessionStorage.getItem(KUNCI) || "null"); } catch (e) { sesi = null; }
  try { localStorage.removeItem(KUNCI); } catch (e) {}        // token versi lama (localStorage) dibuang
  const simpanSesi = (s) => { sesi = s; try { s ? sessionStorage.setItem(KUNCI, JSON.stringify(s)) : sessionStorage.removeItem(KUNCI); } catch (e) {} };
  // Masuk latar (Joe 29 Okt 22.17): sandi modul yang sudah benar dipakai untuk masuk ke Chat AI Svarna, jadi panel tidak
  // minta masuk lagi. Sandi hanya di memori halaman ini (untuk masuk ulang bila token habis); tidak disimpan, tidak dicatat.
  let latar = null, janjiLatar = null, takTerjangkau = false, khususTailscale = "";
  function masukLatar() {
    if (!API || !latar) return Promise.resolve(false);
    return janjiLatar = janjiLatar || (async () => {
      try { const r = await fetch(API + "/api/masuk", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(latar) });
        const j = await r.json().catch(() => ({}));
        takTerjangkau = false; khususTailscale = (r.status === 403 || r.status === 423) ? (j.galat || "") : "";
        if (r.ok && j.token) { simpanSesi(j); return true; }
        if (r.status === 401) latar = null;       // akun/sandi tidak diterima layanan chat: pakai layar MASUK
      } catch (e) { takTerjangkau = true; }       // layanan chat tak terjangkau (internet putus / Mac mati)
      return false;
    })().finally(() => { janjiLatar = null; });
  }
  window.tanyaBotMasuk = (akun, sandi) => { latar = { akun, sandi };
    if (!sesi || sesi.akun !== akun) masukLatar().then((ok) => { if (ok && document.body.classList.contains("panel-bot-buka")) layar(); }); };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n{2,}/).map((p) => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
  const tambah = (kelas, html) => { const d = document.createElement("div"); d.className = kelas; d.innerHTML = html; isi.append(d); isi.scrollTop = isi.scrollHeight; return d; };
  function layar() {
    isi.innerHTML = ""; $("pbBawah").hidden = true; $("pbKeluar").hidden = !sesi;
    if (!API) {                       // belum ada alamat https: buka chat di jendela kecil (perangkat Tailscale)
      isi.innerHTML = '<div class="pb-kosong"><b>AI Svarna</b>Chat di dalam panel aktif setelah alamat aman (https) layanan chat tersedia.</div>' +
        '<button class="pb-tombol" type="button" id="pbJendela">Buka chat</button><div class="pb-ket">Membuka jendela chat kecil di kanan layar. Hanya dari perangkat yang tersambung Tailscale.</div>';
      $("pbJendela").onclick = () => { const w = 400, l = (screen.availLeft || 0) + screen.availWidth - w;
        window.open(HTTP, "tanyaBotSvarna", "popup,width=" + w + ",height=" + screen.availHeight + ",left=" + l + ",top=0"); };
      return;
    }
    if (!sesi && takTerjangkau) {      // layar MASUK pasti gagal: beri tahu sebabnya
      isi.innerHTML = '<div class="pb-kosong"><b>Belum tersambung</b>Tanya Bot Svarna sedang tidak bisa dihubungi. ' +

      return;

    if (!sesi && khususTailscale) {    // akun penting dari internet publik: hanya boleh lewat Tailscale (server 403)
      isi.innerHTML = '<div class="pb-kosong"><b>Belum tersambung</b>' + esc(khususTailscale) + '</div>' +
        '<button class="pb-tombol" type="button" id="pbUlang">Coba lagi</button>';

    }
    if (!sesi) {                       // tanpa form masuk (Joe 30 Okt): masuk hanya lewat sandi modul
      isi.innerHTML = '<div class="pb-kosong"><b>Belum tersambung</b>Sesi Tanya Bot sudah habis. ' +
        'Muat ulang halaman, lalu masukkan sandi modul lagi.</div><button class="pb-tombol" type="button" id="pbMuat">Muat ulang</button>';
      $("pbMuat").onclick = () => location.reload();

    $("pbSiapa").textContent = (sesi.nama || "") + (sesi.ai ? " · " + sesi.ai : "");
    $("pbBawah").hidden = false;
    if (!riwayat.length) { tambah("pb-kosong", "<b>" + esc(sesi.ai || "AI Svarna") + "</b>Ada yang bisa dibantu?<br>Bot ikut membaca layar yang sedang dibuka."); if (pakaiHistori) muatHistori(); }

    $("pbTeks").focus();
  }

    try { const r = await fetch(API + "/api/histori", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sesi.token },
        body: JSON.stringify({ batas: 50 }) });

      if (!r.ok) return;              // layanan versi lama (belum ada /api/histori): panel tetap jalan tanpa histori

      if (!daftar.length || riwayat.length || sibuk) return;
      isi.innerHTML = ""; let hari = "";

        const w = String(h.waktu || ""), tgl = w.slice(0, 10);
        if (tgl && tgl !== hari) { hari = tgl; tambah("pb-waktu", esc(tgl)); }
        const siapa = h.akun && h.akun !== sesi.akun ? "<b>" + esc(h.akun) + "</b> · " : "";
        tambah("pb-saya", esc(h.tanya)); tambah("pb-ai", md(h.jawab || "") + '<div class="pb-ket" style="text-align:left;margin-top:4px">' + siapa + esc(w.slice(11, 16)) + "</div>");

  function bacaLayar() {
    const lewati = new Set(["panelBot", "gerbang", "tombolBot", "pita-isian"]);
    const bagian = [...document.body.children].filter((el) => !lewati.has(el.id) && !/^(SCRIPT|STYLE|TEMPLATE|NOSCRIPT)$/.test(el.tagName));
    const filter = [];
    for (const s of document.querySelectorAll("select")) {
      if (s.closest("#panelBot, #gerbang") || !s.offsetParent) continue;
      const label = (s.labels && s.labels[0] && s.labels[0].innerText) || s.getAttribute("aria-label") || s.name || s.id || "Pilihan";
      const pilih = s.selectedOptions[0];

    finally { pilihan.forEach((s, i) => { s.style.display = semula[i]; }); }
    const judul = [...document.querySelectorAll("h1, h2")].find((h) => !h.closest("#panelBot, #gerbang") && h.offsetParent);
    return { modul: document.title || "", judul: judul ? judul.innerText.trim() : "", alamat: location.pathname + location.hash,
      teks: ((filter.length ? "Filter terpilih:\n" + filter.join("\n") + "\n\n" : "") + isiLayar).slice(0, 40000) };
  }
  async function kirim(ev) {

      if (r.status === 401) { simpanSesi(null); tunggu.remove(); layar(); return; }
      const j = await r.json().catch(() => ({}));
      tunggu.classList.remove("pb-tunggu");
      if (j.status === "ok") { tunggu.innerHTML = md(j.jawab || ""); riwayat.push({ dari: "saya", teks }, { dari: "ai", teks: j.jawab || "" }); }

    } catch (e) { tunggu.innerHTML = '<span class="pb-galat">Belum tersambung. Periksa sambungan internet, lalu kirim ulang.</span>'; }

    const tulis = (n, isi) => { try { localStorage.setItem(AWAL + n, JSON.stringify(isi)); } catch (e) { throw { code: "failed", message: "Isian tidak bisa disimpan di browser ini" }; } };
    const pendengar = new Map();   // koleksi -> Set(cb)
    const kabari = (n) => { const s = baca(n), docs = Object.entries(s).map(([id, d]) => ({ id, data: () => JSON.parse(JSON.stringify(d)) }));
      for (const cb of pendengar.get(n) || []) { try { cb({ docs, size: docs.length, empty: !docs.length }); } catch (e) { console.error(e); } } };
    addEventListener("storage", (e) => { if (e.key && e.key.startsWith(AWAL)) kabari(e.key.slice(AWAL.length)); });
    const dok = (n, id) => ({ id,
      async set(isi) { const s = baca(n); s[id] = isi; tulis(n, s); kabari(n); },
      async update(isi) { const s = baca(n); s[id] = { ...(s[id] || {}), ...isi }; tulis(n, s); kabari(n); },
      async delete() { const s = baca(n); delete s[id]; tulis(n, s); kabari(n); } });
    const db = {
      collection(n) { return {
        onSnapshot(cb) { if (!pendengar.has(n)) pendengar.set(n, new Set()); pendengar.get(n).add(cb); setTimeout(() => kabari(n), 0); return () => pendengar.get(n).delete(cb); },
        async add(isi) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await dok(n, id).set(isi); return { id }; },
        doc(id) { return dok(n, id); } }; },
      doc(jalur) { const [n, id] = String(jalur).split("/"); return dok(n, id); },
    };
    const pengguna = { async id() { return "browser-ini"; }, async can(h) { return h === "data.write" ? true : null; } };
    const unduhan = { async save({ filename, data }) { const b = data instanceof Blob ? data : new Blob([data]); const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = filename || "unduhan"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000); } };
    return { use(nama) { return Promise.resolve(nama === "db" ? db : nama === "user" ? pengguna : nama === "downloads" ? unduhan : null); } };
  }
  // Isian BERSAMA di Mac (Joe 31 Okt 2026; isian_web.py di layanan chat): masuk dengan akun & sandi halaman ini,
  // baca tiap 30 detik + sesudah menulis. Gagal tersambung -> isian browser ini (isianLokal) dengan pita peringatan.
  async function isianServer(akun, sandi) {
    const API = "https://svarna5s-mac-mini.tail7a15d8.ts.net/api/isian/";
    const kirim = async (jalan, isi, token) => {
      const r = await fetch(API + jalan, { method: "POST", body: JSON.stringify(isi),
        headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) } });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: r.status === 403 ? "permission_denied" : "failed", message: d.galat || ("gagal " + r.status) };
      return d;
    };
    const { token } = await kirim("masuk", { akun, sandi });
    const cache = new Map(), pendengar = new Map();
    const kabari = (n) => { const s = cache.get(n) || {}, docs = Object.entries(s).map(([id, d]) => ({ id, data: () => JSON.parse(JSON.stringify(d)) }));
      for (const cb of pendengar.get(n) || []) { try { cb({ docs, size: docs.length, empty: !docs.length }); } catch (e) { console.error(e); } } };
    const tarik = async (n) => { try { cache.set(n, (await kirim("baca", { koleksi: n }, token)).docs || {}); kabari(n); } catch (e) { console.error("isian " + n, e); } };
    setInterval(() => { if (!document.hidden) for (const n of pendengar.keys()) tarik(n); }, 30000);
    const ubah = async (n, id, op, isi) => {
      const d = await kirim("tulis", { koleksi: n, id, op, isi }, token);
      const s = cache.get(n) || {};
      if (d.isi) s[id] = d.isi; else delete s[id];
      cache.set(n, s); kabari(n);
    };
    const dok = (n, id) => ({ id, set: (isi) => ubah(n, id, "set", isi), update: (isi) => ubah(n, id, "update", isi), delete: () => ubah(n, id, "delete") });
    const db = {
      collection(n) { return {
        onSnapshot(cb) { if (!pendengar.has(n)) pendengar.set(n, new Set()); pendengar.get(n).add(cb); if (cache.has(n)) setTimeout(() => kabari(n), 0); else tarik(n); return () => pendengar.get(n).delete(cb); },
        async add(isi) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await dok(n, id).set(isi); return { id }; },
        doc(id) { return dok(n, id); } }; },
      doc(jalur) { const [n, id] = String(jalur).split("/"); return dok(n, id); },
    };
    // use("assets").upload(file, opsi) (halaman GIO 4 Nov 2026): lampiran pengajuan -> Mac -> Drive PENGAJUAN SALES
    // / <cabang> / <toko> / "<ket> <nama asli>", lewat rclone Bot Drive; balasan {id, url} = link lihat Drive.
    const assets = { async upload(file, opsi) {
      opsi = opsi || {};
      if (!file || !file.size) throw { code: "failed", message: "berkas kosong" };
      if (file.size > 20 * 1024 * 1024) throw { code: "too_large", message: "lebih dari 20 MB" };
      const meta = { cabang: opsi.cabang || "", toko: opsi.toko || "", ket: opsi.ket || "", nama: opsi.nama || file.name || "berkas" };
      let r;
      try {
        r = await fetch(API + "unggah?meta=" + encodeURIComponent(JSON.stringify(meta)), { method: "POST", body: file,
          headers: { "Content-Type": opsi.type || file.type || "application/octet-stream", Authorization: "Bearer " + token } });
      } catch (e) { throw { code: "failed", message: "Mac tidak bisa dihubungi" }; }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: r.status === 413 ? "too_large" : r.status === 429 ? "rate_limited" : (r.status === 401 || r.status === 403) ? "not_granted" : "failed",
        message: d.galat || ("gagal " + r.status) };
      return { id: d.id, url: d.url };
    } };
    return { db, pengguna: { async id() { return akun; }, async can(h) { return h === "data.write" ? true : null; } }, assets };
  }
  async function buka(akun, sandi) {
    const id = hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("svarna-dipa-akun:" + akun))).slice(0, 24);
    let a; try { a = await ambil("a/" + id + ".json"); } catch (e) { throw new Error("salah"); }
    const bahan = await crypto.subtle.importKey("raw", new TextEncoder().encode(sandi), "PBKDF2", false, ["deriveKey"]);
    const ks = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: dari64(a.garam), iterations: a.iter },
      bahan, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    let mentah; try { mentah = await crypto.subtle.decrypt({ name: "AES-GCM", iv: dari64(a.iv) }, ks, dari64(a.isi)); } catch (e) { throw new Error("salah"); }
    if (a.iv2) {   // akun format v2 (Kelola akun, 30 Okt 2026): yang terbuka sandi = kunci akun, lalu kunci paket
      const ka = await crypto.subtle.importKey("raw", mentah, "AES-GCM", false, ["decrypt"]);
      mentah = await crypto.subtle.decrypt({ name: "AES-GCM", iv: dari64(a.iv2) }, ka, dari64(a.isi2));
    }
    const kp = await crypto.subtle.importKey("raw", mentah, "AES-GCM", false, ["decrypt"]);
    tampil("MEMBUKA DATA ...");
    const p = await ambil("p/" + a.paket + ".json");
    const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: dari64(p.iv) }, kp, dari64(p.isi));
    const teks = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(teks);
  }
  document.getElementById("formMasuk").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const akun = document.getElementById("akunMasuk").value.trim().toLowerCase(), sandi = document.getElementById("sandiMasuk").value;
    tombol.disabled = true; tampil("MEMERIKSA ...");
    let berkas;
    try { berkas = await buka(akun, sandi); }
    catch (e) { tombol.disabled = false; tampil(e.message === "salah" ? (document.getElementById("akunMasuk").type === "hidden" ? "SANDI SALAH" : "AKUN ATAU SANDI SALAH") :"GAGAL MEMBUKA DATA, COBA MUAT ULANG HALAMAN", true); return; }
    if (window.tanyaBotMasuk) window.tanyaBotMasuk(akun, sandi);   // panel Tanya Bot Svarna ikut masuk (latar)
    document.getElementById("sandiMasuk").value = "";
    // halaman pajak (templat web GIO GRUP-PAJAK): paket.json = {dibuat, data:{id: isi}} -> dash._isi
    if (berkas["paket.json"] && window.dash && window.dash._isi) {
      const pk = JSON.parse(berkas["paket.json"]);
      // sisa_hari dihitung dari hari ini (WIB), bukan dari tanggal data dibaca GIO (audit 31 Okt 2026)
      const jt = pk.data && pk.data.jatuh_tempo;
      if (Array.isArray(jt)) {
        const kini = Date.parse(new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Jakarta" }) + "T00:00:00Z");
        for (const r of jt) {
          const t = Date.parse(String(r.jatuh_tempo) + "T00:00:00Z");
          if (!isNaN(t) && !isNaN(kini)) r.sisa_hari = Math.round((t - kini) / 864e5);
        }
      }
      const m = document.getElementById("masuk"), i = document.getElementById("isi"), w = document.getElementById("webDibuat");
      if (m) m.hidden = true;
      if (i) i.hidden = false;
      if (w && pk.dibuat) w.textContent = new Date(pk.dibuat).toLocaleString("id-ID", { dateStyle: "long", timeStyle: "short" });
      document.body.classList.add("terbuka");
      window.dash._isi(pk);
      return;
    }
    const isianBersama = isianServer(akun, sandi).catch((e) => { console.error("isian bersama", e); return null; });
    // halaman GIO membaca data/<nama>.json - dilayani dari paket yang sudah dibuka, tidak ke internet
    const asli = window.fetch.bind(window);
    window.fetch = (u, o) => {
      const m = String(u && u.url || u).match(/(?:^|\/)data\/([\w.-]+\.json)(?:[?#]|$)/);
      if (!m) return asli(u, o);
      return Promise.resolve(m[1] in berkas ? new Response(berkas[m[1]], { headers: { "Content-Type": "application/json" } }) : new Response("", { status: 404 }));
    };
    try {
      const meta = JSON.parse(berkas["meta.json"] || "{}"), kl = (meta.sumber_mac || {}).kelengkapan || {};
      const belum = Object.values(kl).reduce((n, v) => n + (v.rincian_belum_diambil_bot || 0), 0);
      if (belum) document.body.prepend(Object.assign(document.createElement("div"), { id: "pita-belum",
        textContent: "DATA BELUM LENGKAP: " + belum.toLocaleString("id-ID") + " rincian transaksi masih diambil dari Accurate, jadi angka masih bisa berubah." }));
    } catch (e) { console.error(e); }
    // Isian (fix pesan + approve, target, catatan, pengajuan, dst.) seperti artifact asli: pengganti window.claude.
    // db & user = penyimpanan bersama Mac (isianServer); bila gagal tersambung -> browser ini saja (isianLokal) + pita.
    if (!window.claude) {
      const lokal = isianLokal();
      window.claude = { use(nama) {
        if (nama !== "db" && nama !== "user" && nama !== "assets") return lokal.use(nama);
        return isianBersama.then((b) => {
          if (b) return nama === "db" ? b.db : nama === "user" ? b.pengguna : b.assets;
          if (nama === "assets") return null;   // tanpa isian bersama tidak ada unggahan (tombol memberi pesan sendiri)
          if (!document.getElementById("pita-isian")) document.body.append(Object.assign(document.createElement("div"), { id: "pita-isian",
            textContent: "ISIAN (TARGET, CATATAN, PENGAJUAN) TERSIMPAN DI BROWSER INI SAJA" }));
          return lokal.use(nama);
        });
      } };
    }
    document.body.classList.add("terbuka");
    const s = document.createElement("script");
    s.textContent = document.getElementById("gio-utama").textContent;
    document.body.append(s);
  });
})();
