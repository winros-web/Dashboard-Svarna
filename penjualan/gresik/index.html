          el("div", { class: "row", style: "gap:12px;flex-wrap:wrap;align-items:end" },
            S.cabang ? null : selB("bCab", "Cabang", [["", "Semua cabang"], ...cabB.map((c) => [c, c])], "cab"),
            selB("bKend", "Kendaraan", [["Mobil", "Mobil barang saja"], ["Mobil box/bak", "Terdaftar di DATABASE MOBIL"], ["Mobil barang (belum", "Belum di DATABASE MOBIL"], ["Kendaraan lain", "Mobil/motor kantor"], ["", "Semua kendaraan"]], "kend"),
            selB("bNopol", "Mobil", [["", "Semua mobil (" + nopolB.length + ")"], ...nopolB.map((n) => [n, n])], "nopol"),
            tglB("bDari", "Dari", "dari"), tglB("bSampai", "Sampai", "sampai"),
            selB("bJenis", "Jenis biaya", [["", "Semua ongkos jalan"], ...jenisB.map((j) => [j, j])], "jenis")),
          el("div", { class: "kpis" },
            kpi(fb.jenis || "Ongkos jalan", rpK(totB), perMobil.length + " kendaraan · " + nf0.format(hariB) + " hari-mobil jalan"),
            kpi("Rata-rata per hari jalan", hariB ? rp(totB / hariB) : "–", "satu mobil satu hari")),
          table([
            { h: "Mobil", f: (r) => r.nopol, node: (r) => el("span", null, el("b", { class: "mono", text: r.nopol }), el("div", { class: "muted", style: "font-size:12px", text: r.cabang + " · " + r.kendaraan + (daftarMobil.get(r.cabang + "|" + r.nopol)?.volume_m3 ? " · " + m3(daftarMobil.get(r.cabang + "|" + r.nopol).volume_m3) : "") })) },
            { h: "Hari jalan", f: (r) => r.hari, num: true, bar: true },
            { h: fb.jenis || "Ongkos jalan", f: (r) => r.total, num: true, fmt: (v) => rp(v), bar: true },
            { h: "Per hari jalan", f: (r) => r.hari ? r.total / r.hari : 0, num: true, fmt: (v) => v ? rp(v) : "–" },
            { h: "Rincian (termasuk servis/lain)", f: (r) => Object.keys(r.rinci).length, node: (r) => el("div", { style: "font-size:12px;display:grid;gap:1px;min-width:13em" }, Object.entries(r.rinci).sort((a, b) => b[1] - a[1]).map(([j, n]) => el("div", null, j + ": ", el("b", { text: rpK(n) })))) },
            { h: "Terakhir jalan", f: (r) => r.terakhir, fmt: (v) => tglPendek(v) },
          ], perMobil, { sort: 2, dir: "desc", limit: 60, empty: "Tidak ada biaya mobil untuk pilihan ini." })),
        card("Rincian per hari per mobil", "Satu baris = satu mobil pada satu tanggal jalan, dengan keterangan aslinya dari Accurate.",
          table([
            { h: "Tanggal", f: (r) => r.tanggal, fmt: (v) => tglPendek(v) },
            { h: "Mobil", f: (r) => r.nopol, node: (r) => el("span", null, el("b", { class: "mono", text: r.nopol }), el("div", { class: "muted", style: "font-size:12px", text: r.cabang })) },
            { h: fb.jenis || "Ongkos jalan", f: nilaiB, num: true, fmt: (v) => rp(v), bar: true },
            { h: "Servis / surat / lain", f: (r) => r.lain, num: true, fmt: (v) => v ? rp(v) : el("span", { class: "muted", text: "–" }) },
            { h: "Keterangan Accurate", f: (r) => r.ket, node: (r) => el("div", { class: "muted", style: "font-size:12px;max-width:42em", text: r.ket }) },
          ], rowsB, { sort: 0, dir: "desc", limit: 300 })),
        bulanB.length ? card("Per bulan: ongkos jalan vs penjualan toko cabang",
          "Ongkos jalan nyata sebulan dibandingkan omset dan laba kotor penjualan ke toko (tanpa akun online/marketplace) di cabang yang sama. Kalau persennya kecil, mobil yang jalan tidak penuh pun tidak membuat cabang rugi ongkos.",
          table([
            { h: "Bulan", f: (r) => r.bulan, fmt: (v) => new Date(v + "-01").toLocaleDateString("id-ID", { month: "short", year: "numeric" }) },
            { h: "Cabang", f: (r) => r.cabang },
            { h: "Ongkos jalan", f: (r) => r.jalan, num: true, fmt: (v) => rp(v), bar: true },
            { h: "Hari-mobil", f: (r) => r.hari_mobil, num: true, fmt: (v, r) => v + " (" + r.mobil + " kendaraan)" },
            { h: "Ongkos per hari-mobil", f: (r) => r.ongkos_per_hari || 0, num: true, fmt: (v) => v ? rp(v) : "–" },
            { h: "Omset toko", f: (r) => r.omset, num: true, fmt: (v) => rpK(v) },
            { h: "Ongkos / omset", f: (r) => r.persen_omset ?? -1, num: true, fmt: (v) => v < 0 ? "–" : nf1.format(v) + "%" },
            { h: "Ongkos / laba kotor", f: (r) => r.persen_laba ?? -1, num: true, fmt: (v) => v < 0 ? "–" : el("span", { class: "pill " + (v > 100 ? "bad" : v > 30 ? "warn" : "ok"), text: nf1.format(v) + "%" }) },
          ], bulanB, { sort: 0, dir: "desc", limit: 120 }),
          el("p", { class: "note", text: "Catatan: Jakarta/Tangerang dan sebagian Makassar & Kaltim hampir tidak mencatat ongkos mobil bernopol di Pembayaran Lain (kemungkinan lewat jurnal atau tanpa nopol), jadi angka cabang itu belum lengkap. Laba kotor memakai HPP rata-rata Accurate saat ini." })) : null);
    }

    const kolomMobil = [
      { h: "Cabang", f: (r) => r.cabang },
      { h: "Nopol", f: (r) => r.nopol, cls: "mono" },
      { h: "Jenis", f: (r) => r.jenis },
      { h: "Ukuran box", f: (r) => r.ukuran },
      { h: "Volume", f: (r) => r.volume_m3, num: true, fmt: (v) => m3(v), bar: true },
      { h: "Catatan data", f: (r) => r.catatan || "", fmt: (v) => v ? el("span", { class: "pill warn", text: "perlu dicek" }) : el("span", { class: "muted", text: "–" }) },
    ];
    const kolomRing = [
      { h: "Cabang", f: (r) => r.cabang },
      { h: "Muatan", f: (r) => r.m3, num: true, fmt: (v) => m3(v), bar: true },
      { h: "Toko", f: (r) => r.toko, num: true },
      { h: "Pengiriman", f: (r) => r.do, num: true },
      { h: "Mobil dipakai", f: (r) => r.mobil_dipakai, num: true, fmt: (v, r) => r.mobil_ada ? v + " dari " + r.mobil_ada : el("span", { class: "muted", text: "belum ada data mobil" }) },
      { h: "Terpakai dari batas muat", f: (r) => r.persen_armada || 0, num: true, fmt: (v) => v ? el("span", { class: "pill " + (v > 100 ? "bad" : v > 80 ? "warn" : "ok"), text: nf1.format(v) + "%" }) : el("span", { class: "muted", text: "–" }) },
      { h: "Belum terangkut", f: (r) => r.belum_terangkut_m3, num: true, fmt: (v, r) => v ? el("span", { class: "pill warn", title: r.belum_terangkut_sebab, text: nf1.format(v) + " m³ · " + r.belum_terangkut_toko + " toko" }) : el("span", { class: "muted", text: "–" }) },
      { h: "Rit melebihi batas muat", f: (r) => r.rit_melebihi || 0, num: true, fmt: (v) => v ? el("span", { class: "pill warn", text: v + " rit" }) : el("span", { class: "muted", text: "–" }) },
      { h: "Unit tanpa ukuran", f: (r) => r.unit_tanpa_ukuran, num: true, fmt: (v) => v ? nf0.format(v) : el("span", { class: "muted", text: "–" }) },
      { h: "Kiriman online (di luar rute)", f: (r) => r.online_m3 || 0, num: true, fmt: (v, r) => v ? nf1.format(v) + " m³ · " + nf0.format(r.online_do) + " kiriman" : el("span", { class: "muted", text: "–" }) },
    ];
    const kolomTanpa = [
      { h: "Kode barang", f: (r) => r.kode, cls: "mono" },
      { h: "Nama barang", f: (r) => r.nama },
      { h: "Unit dikirim", f: (r) => r.unit, num: true, fmt: (v) => nf0.format(v), bar: true },
      { h: "Cabang", f: (r) => r.cabang },
    ];

    sec.replaceChildren(
      card("Cara baca halaman ini",
        "Pertanyaannya sederhana: muatan hari ini cukup untuk berapa mobil, dan satu mobil sebaiknya ke toko mana saja.",
        el("ol", { class: "cat" },
          el("li", { text: "Ambil semua Pengiriman Pesanan (surat jalan) cabang itu pada tanggal yang dipilih." }),
          el("li", { text: "Tiap barang dihitung kubikasinya: panjang × lebar × tinggi kemasan, dikali kuantiti. Contoh Kak Intan: mobil 100 m³, toko A 20, B 15, C 25, D 30 → jumlahnya 90 m³, jadi satu mobil cukup." }),
          el("li", { text: "Toko dikelompokkan menurut arah dari kota gudang, supaya satu mobil jalannya searah." }),
          el("li", { text: "Mobil diisi dari yang paling besar sampai batas muatnya; yang tidak kebagian muncul di kartu \u201cBelum kebagian mobil\u201d." }),
          el("li", { text: "Penjualan online (MDM, Shopee, Tokopedia, TikTok dan akun gunggungan lain) tidak ikut dibagi ke mobil karena kirimannya paket kecil lewat kurir — angkanya ada di kartu tersendiri di bawah." })),
        el("p", { class: "note", text: "Yang masih perkiraan: " + R.meta.asumsi.length + " hal, tercantum di bawah." })),
      pilih, pesanRencana,
      ring ? el("div", { class: "kpis" },
        kpi("Muatan " + S.ruteCab, m3(ring.m3), nf0.format(ring.toko) + " toko · " + nf0.format(ring.do) + " pengiriman · " + nf0.format(ring.unit) + " unit"),
        kpi("Batas muat armada", m3(ring.kapasitas_pakai_m3), ring.mobil_ada ? ring.mobil_ada + " mobil, volume box " + m3(ring.kapasitas_m3) : "belum ada data mobil cabang ini"),
        kpi("Terpakai", ring.persen_armada != null ? nf1.format(ring.persen_armada) + "%" : "–", "dari batas muat armada", ring.persen_armada > 100 ? "bad" : ring.persen_armada > 80 ? "warn" : ""),
        kpi("Mobil dipakai", ring.mobil_dipakai + (ring.mobil_ada ? " dari " + ring.mobil_ada : ""), "satu mobil = satu rit"),
        kpi("Belum terangkut", ring.belum_terangkut_m3 ? m3(ring.belum_terangkut_m3) : "tidak ada", ring.belum_terangkut_m3 ? ring.belum_terangkut_toko + " toko · " + ring.belum_terangkut_sebab : "semua muatan kebagian mobil", ring.belum_terangkut_m3 ? "bad" : ""),
        kpi("Unit tanpa ukuran", nf0.format(ring.unit_tanpa_ukuran), "belum ada dimensi resminya", ring.unit_tanpa_ukuran ? "warn" : ""),
        kpi("Kiriman online", ring.online_m3 ? m3(ring.online_m3) : "tidak ada", nf0.format(ring.online_do || 0) + " pengiriman · di luar rute mobil")) : el("div", { class: "msg", text: "Tidak ada pengiriman untuk cabang dan tanggal ini." }),
      rits.length ? card("Pembagian mobil — " + S.ruteCab + ", " + hariDari(S.ruteTgl),
        "Satu baris = satu mobil (satu rit): toko yang didatangi berurutan dari yang terdekat gudang, dan semua barang yang diangkut. Pembagian ini usulan hitungan dashboard dari kubikasi & arah toko — Accurate tidak mencatat mobil/supir di Pengiriman Pesanan.",
        table([
          { h: "Mobil", f: (r) => r.mobil || "zz", node: (r) => el("span", null, el("b", { text: r.mobil || (r.nopol === "(belum terangkut)" ? "Belum ada mobil" : r.nopol) }), r.mobil ? el("div", { class: "muted mono", style: "font-size:12px", text: r.nopol + " · " + r.jenis }) : null) },
          { h: "Jalur", f: (r) => r.jalur, node: (r) => el("span", { style: "font-size:12px", text: r.jalur + (r.km != null ? " (± " + nf0.format(r.km) + " km)" : "") }) },
          { h: "Toko (urut kirim)", f: (r) => r.toko, node: (r) => el("ol", { style: "margin:0;padding-left:18px;font-size:12px" }, R.rit_toko.filter((t) => t.kunci_rit === r.kunci).sort((a, b) => a.urut - b.urut).map((t) => el("li", { text: t.toko + " · " + t.kota }))) },
          { h: "Barang diangkut", f: (r) => r.unit, num: true, node: (r) => el("span", null, el("div", { style: "font-size:12px", text: nf0.format(r.unit) + " unit" }), nodeBarangRute(barangRit(r.kunci))) },
          { h: "Muatan", f: (r) => r.persen ?? -1, num: true, node: (r) => el("span", { class: r.persen_dari_batas > 100 ? "down" : null, text: m3(r.muatan_m3) + (r.persen != null ? " · " + nf1.format(r.persen) + "%" : "") }) },
          { h: "Nilai jual muatan", f: (r) => r.nilai || 0, num: true, node: nodeNilai },
          { h: "Ongkos jalan", f: (r) => r.ongkos ?? -1, num: true, node: nodeOngkos },
          { h: "Laba − ongkos", f: (r) => r.sisa ?? -1e15, num: true, node: nodeSisa },
        ], ritsTampil, { sort: 0, dir: "asc", maxH: "none" })) : null,
      kartuOngkos,
      kartuRit.length ? el("h2", { style: "margin:4px 0 0", text: "Rincian per mobil — " + S.ruteCab + ", " + hariDari(S.ruteTgl) }) : null,
      ...kartuRit,
      (R.online || []).filter((r) => r.cabang === S.ruteCab && r.tanggal === S.ruteTgl).length
        ? card("Kiriman online — di luar rute mobil",
          "Akun penjualan online dan gunggungan marketplace. Kirimannya paket kecil lewat kurir, jadi tidak dibagi ke mobil cabang — tapi tetap ditampilkan supaya tidak ada yang hilang.",
          table([{ h: "Akun", f: (r) => r.toko },
                 { h: "Pengiriman", f: (r) => r.do, num: true, fmt: (v) => nf0.format(v) },
                 { h: "Unit", f: (r) => r.unit, num: true, fmt: (v) => nf0.format(v) },
                 { h: "Kubikasi", f: (r) => r.m3, num: true, fmt: (v) => m3(v), bar: true },
                 { h: "Kenapa dianggap online", f: (r) => r.sebab }],
                (R.online || []).filter((r) => r.cabang === S.ruteCab && r.tanggal === S.ruteTgl), { sort: 1 }))
        : null,
      kartuBiaya,
      card("Semua cabang pada tanggal ini", "Cabang yang belum ada data mobilnya tetap dihitung muatannya, tapi belum bisa dibagi ke mobil.",
        table(kolomRing, R.ringkasan.filter((r) => r.tanggal === S.ruteTgl), { sort: 1 })),
      card("Mobil yang dipakai hitungan ini", "Dari DATABASE MOBIL. Volume = panjang × lebar × tinggi box; yang bertanda \u201cperlu dicek\u201d ukurannya belum lengkap di berkas asli.",
        table(kolomMobil, R.mobil, { sort: 4, limit: 20 })),
      R.barang_tanpa_ukuran.length ? card("Barang yang belum ada ukuran resminya",
        "Unit ini ikut dikirim tapi kubikasinya belum terhitung, jadi muatan sebenarnya sedikit lebih besar dari angka di atas. Kalau ukurannya dilengkapi di berkas Dimensi Barang, angkanya langsung ikut.",
        table(kolomTanpa, R.barang_tanpa_ukuran, { sort: 2, limit: 15 })) : null,
      R.toko_tanpa_kota.length ? card("Toko yang belum bisa ditaruh di peta",
        "Alamat kota/kabupatennya belum ada di master pelanggan, jadi tokonya tetap dihitung muatannya tapi arah dan urutannya belum bisa ditentukan.",
        table([{ h: "Cabang", f: (r) => r.cabang }, { h: "Tanggal", f: (r) => r.tanggal },
               { h: "Toko", f: (r) => r.toko }, { h: "Kubikasi", f: (r) => r.m3, num: true, fmt: (v) => m3(v) },
               { h: "Sebabnya", f: (r) => r.alasan }], R.toko_tanpa_kota, { sort: 3, limit: 15 })) : null,
      card("Angka mana yang masih perkiraan",
        "Dibuat " + R.meta.dibuat.slice(0, 16).replace("T", " ") + ". Sumber: " + R.meta.sumber.muatan + ".",
        el("ul", { class: "cat" }, R.meta.asumsi.map((t) => el("li", { text: t }))),
        el("p", { class: "note", text: "Dimensi barang: " + R.meta.sumber.dimensi + ". Mobil: " + R.meta.sumber.mobil + ". Alamat: " + R.meta.sumber.alamat + "." })));
  }

  const PAGES = { ringkasan: pRingkasan, harian: pHarian, sales: pSales, laba: pLaba, umur: pUmur, jualslow: pJualSlow, beli: pPesan, pindah: pPindah, piutang_all: pPiutangAll, cod: pCod, pasif: pPasif, telat: pTelat,penagihan: pPenagihan, rute: pRute, tanda: pTanda, balik: pBalik, retur: pRetur, program: pProgram, pengajuan: pPengajuan, aturan: pAturan };
  let renderSeq = 0;
  async function render() {
    const seq = ++renderSeq;
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.p === S.page ? "true" : "false"));
    for (const id of Object.keys(PAGES)) { const sc = $("#" + id); if (sc) sc.hidden = id !== S.page; }
    const sec = $("#" + S.page);
    if (!sec) return;
    try { await PAGES[S.page](sec); }
    catch (e) { if (seq === renderSeq) sec.replaceChildren(el("div", { class: "msg", text: "Bagian ini gagal dimuat: " + (e.message || e) })); console.error(e); }
  }
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { S.page = t.dataset.p; try { history.replaceState(null, "", "#" + S.page); } catch (e) {} render(); }));
  $("#selBulan").addEventListener("change", (e) => { S.bulan = e.target.value; render(); });
  $("#selCabang").addEventListener("change", (e) => { S.cabang = e.target.value; render(); });
  $("#selSales").addEventListener("change", (e) => { S.sales = e.target.value === "" ? "" : +e.target.value; render(); });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.page === "ringkasan") render(); }, 250); });

  // ---------- tombol "Perbarui semua data" (pusat saja; Kak Intan 31 Okt 2026) ----------
  // Klik = buat berkas PERBARUI-*.txt di folder Drive "Agen Pajak\DASHBOARD PENJUALAN\TOMBOL PERBARUI DASHBOARD"
  // lewat Google Drive yang mengklik. Laptop Kak Intan (cek_tombol_perbarui.ps1, tiap 5 menit) menjalankan tarikan
  // Accurate + penagihan + tanda terima, lalu agen menerbitkan pusat + 8 cabang dan menandai db perbarui/status selesai.
  const FOLDER_TOMBOL = "1Ku2AE0sz1gIiI4Jvq3LFzy5bckg0H1PN";
  const TOMBOL_PERBARUI_MATI = true;
  const jamPendek = (iso) => new Date(iso).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  function gambarPerbarui() {
    const box = $("#perbarui");
    // Kak Intan 31 Okt 2026 sore: "perbarui semua data lewat mac mini aja yg setiap malam aja" - tombol tidak ditampilkan
    if (TOMBOL_PERBARUI_MATI || !box || S.kunci || !D.meta) return;
    box.hidden = false;
    const st = S.perbarui || {}, dataPer = new Date(D.meta.dibuat).getTime();
    const diminta = st.diminta ? new Date(st.diminta).getTime() : 0, selesai = st.selesai ? new Date(st.selesai).getTime() : 0;
    const jalan = diminta && selesai < diminta && Date.now() - diminta < 4 * 3600e3;
    const info = el("span", { class: "muted", role: "status", style: "font-size:12px" });
    const btn = el("button", { class: "btn", type: "button", text: "⟳ Perbarui semua data" });
    if (jalan) {
      btn.disabled = true; btn.textContent = "⟳ Sedang diperbarui…";
      info.textContent = "diminta " + jamPendek(st.diminta) + " · laptop mengecek tiap 5 menit, prosesnya ±1–2 jam (tarikan Accurate). Muat ulang halaman setelah selesai.";
    } else if (selesai && selesai > dataPer + 60e3) {
      info.textContent = "Selesai diperbarui " + jamPendek(st.selesai) + " - muat ulang halaman untuk melihat data terbaru.";
      info.style.color = "var(--ok)";
    } else {
      info.textContent = selesai ? "terakhir diperbarui " + jamPendek(st.selesai) : "semua tab pusat + 8 cabang";
    }
    btn.addEventListener("click", async () => {
      if (!S.mcp) { info.textContent = "Google Drive belum tersambung di halaman ini. Sambungkan Google Drive di claude.ai lalu muat ulang, atau minta Kak Intan yang klik."; info.style.color = "var(--bad)"; return; }
      btn.disabled = true; info.style.color = ""; info.textContent = "mengirim permintaan…";
      const iso = new Date().toISOString();
      try {
        await S.mcp.callTool("Google Drive", "create_file", { title: "PERBARUI-" + iso.replace(/[:.]/g, "-") + ".txt", parentId: FOLDER_TOMBOL,
          textContent: "Permintaan perbarui dashboard " + iso + (S.uid ? " oleh " + S.uid : ""), contentMimeType: "text/plain", disableConversionToGoogleType: true });
      } catch (e) {
        btn.disabled = false; info.style.color = "var(--bad)";
        info.textContent = "Permintaan TIDAK terkirim (" + (e.code || e.message || "galat") + ")" + (e.code === "tool_error" ? " - akun Google ini mungkin belum punya akses ke folder TOMBOL PERBARUI DASHBOARD." : ".");
        return;
      }
      S.perbarui = { ...st, diminta: iso, oleh: S.uid || null };
      try { if (S.db) await S.db.doc("perbarui/status").set(S.perbarui); } catch (e) { /* status hanya tampilan; permintaan tetap terkirim lewat Drive */ }
      gambarPerbarui();
    });
    box.replaceChildren(info, btn);
  }

  // ---------- penyimpanan isian (target, program, harga spesial) ----------
  async function sambungDb() {
    const c = window.claude;
    if (!c || !c.use) { S.canWrite = false; return; }
    c.use("mcp").then((m) => { S.mcp = m || null; }).catch(() => {});
    gambarPerbarui();
    // unggah foto pengajuan (null untuk Viewer / akun luar organisasi: tombol unggah tidak muncul)
    c.use("assets").then((a) => { S.assets = a || null; if (a && S.page === "pengajuan") render(); }).catch(() => {});
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db) { S.canWrite = false; render(); return; }
    S.db = db;
    if (user) { try { S.uid = await user.id(); const w = await user.can("data.write"); S.canWrite = w === null ? null : !!w; } catch (e) {} }
    let pending = 0;
    const ulang = () => { clearTimeout(pending); pending = setTimeout(() => { const a = document.activeElement; if (a && a.matches("input,select,textarea") && a.closest("section.page")) return; render(); }, 150); };
    db.collection("target").onSnapshot((snap) => { S.target = { ...SINKRON.target }; for (const d of snap.docs) S.target[d.id] = d.data(); ulang(); }, () => {});
    db.collection("program").onSnapshot((snap) => { S.program = snap.docs.map((d) => ({ ...d.data(), _id: d.id })); ulang(); }, () => {});
    db.collection("harga_spesial").onSnapshot((snap) => { S.harga = snap.docs.map((d) => ({ ...d.data(), _id: d.id })); ulang(); }, () => {});
    db.collection("tagih_cek").onSnapshot((snap) => { S.tagihCek = {}; for (const d of snap.docs) S.tagihCek[d.id] = d.data(); ulang(); }, () => {});
    db.collection("pindah_barang").onSnapshot((snap) => { S.pindah = snap.docs.map((d) => ({ ...d.data(), _id: d.id })); if (S.page === "pindah") ulang(); }, () => {});
    db.collection("tanda_cek").onSnapshot((snap) => { S.tandaCek = {}; for (const d of snap.docs) S.tandaCek[d.id] = d.data(); ulang(); }, () => {});
    db.collection("catatan_piutang").onSnapshot((snap) => { S.catatan = {}; for (const d of snap.docs) S.catatan[d.id] = d.data(); ulang(); }, () => {});
    db.collection("catatan_retur").onSnapshot((snap) => { S.catatanRetur = {}; for (const d of snap.docs) S.catatanRetur[d.id] = d.data(); ulang(); }, () => {});
    db.collection("foto_retur").onSnapshot((snap) => { S.fotoRetur = {}; for (const d of snap.docs) S.fotoRetur[d.id] = d.data(); ulang(); }, () => {});
    // pengajuan sales: cabang mengajukan di database halamannya, agen memindahkan ke pusat dan membawa keputusan balik
    if (!S.kunci) db.collection("perbarui").onSnapshot((snap) => { const d = snap.docs.find((x) => x.id === "status"); S.perbarui = d ? d.data() : null; gambarPerbarui(); }, () => {});
    db.collection("pengajuan").onSnapshot((snap) => { S.pengajuan = snap.docs.map((d) => ({ ...d.data(), _id: d.id })); ulang(); }, () => {});
    // program pembelian: selama aktif, batas stok pesanan pembelian boleh ditambah
    db.collection("program_beli").onSnapshot((snap) => { S.programBeli = snap.docs.map((d) => ({ ...d.data(), _id: d.id })).concat(SINKRON.program_beli); ulang(); }, () => {});
    // isian fix pesan & program per baris; di tab pesanan statusnya sudah diperbarui langsung saat mengetik,
    // jadi tab itu tidak digambar ulang (posisi gulir tabel tidak lompat)
    let pfAwal = true;
    db.collection("pesan_fix").onSnapshot((snap) => { S.pesanFix = { ...SINKRON.pesan_fix }; for (const d of snap.docs) S.pesanFix[d.id] = d.data(); if (S.page !== "beli" || pfAwal) ulang(); pfAwal = false; }, () => {});
  }

  muat().then((boleh) => {
    const h = location.hash.slice(1) === "piutang" ? "piutang_all" : location.hash.slice(1); // tab Piutang overdue sudah digabung
    if (PAGES[h] && (!boleh || boleh.includes(h))) S.page = h;
    render();
    sambungDb();
  }).catch((e) => { $("#ringkasan").replaceChildren(el("div", { class: "msg", text: "Data dashboard belum ada atau gagal dimuat (" + (e.message || e) + "). Minta Gio menjalankan ulang tarikan data Accurate." })); });
})();
</script>

<script type="text/plain" id="gio-utama">
(() => {
  const API = "https://svarna5s-mac-mini.tail7a15d8.ts.net/api/perbarui";
  let isi = null;
  function buat() {
    const wadah = document.createElement("span");
    wadah.className = "perbarui-web";
    wadah.style.cssText = "display:flex;align-items:center;gap:10px;flex-wrap:wrap";
    const info = document.createElement("span");
    info.className = "muted"; info.setAttribute("role", "status"); info.style.fontSize = "12px";
    info.textContent = "data web diperbarui otomatis tiap 30 menit";
    const btn = document.createElement("button");
    btn.className = "btn"; btn.type = "button"; btn.textContent = "⟳ Perbarui semua data";
    btn.addEventListener("click", async () => {
      btn.disabled = true; info.style.color = ""; info.textContent = "meminta Mac…";
      try {
        const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        const d = await r.json().catch(() => ({}));
        info.textContent = d.pesan || d.galat || ("gagal (" + r.status + ")");
        info.style.color = r.ok ? "var(--ok)" : "var(--bad)";
        if (!r.ok) btn.disabled = false;
      } catch (e) {
        info.textContent = "Mac tidak bisa dihubungi, coba lagi nanti."; info.style.color = "var(--bad)"; btn.disabled = false;
      }
    });
    wadah.append(info, btn);
    return wadah;
  }
  function pasang() {
    const kotak = document.getElementById("perbarui");
    if (!kotak || kotak.querySelector(".perbarui-web")) return;
    kotak.append(isi ||= buat());
  }
  new MutationObserver(pasang).observe(document.documentElement, { childList: true, subtree: true });
  pasang();
})();
</script>

<script>
(() => {
  const dari64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  const ket = document.getElementById("ketMasuk"), tombol = document.getElementById("tombolMasuk");
  const tampil = (t, salah) => { ket.textContent = t; ket.className = "ket" + (salah ? " salah" : ""); };
  async function ambil(p) { const r = await fetch(p, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
  // Pengganti window.claude dengan penyimpanan di browser (antarmuka sama dengan shim.js server Mac):
  // use("db") -> collection(n).onSnapshot/add/doc(id), doc("n/id").set/update/delete; use("user"); use("downloads").
  function isianLokal() {
    const AWAL = "isian:" + location.pathname.replace(/index.html$/, "") + ":";
    const baca = (n) => { try { return JSON.parse(localStorage.getItem(AWAL + n) || "{}"); } catch (e) { return {}; } };
    const tulis = (n, isi) => { try { localStorage.setItem(AWAL + n, JSON.stringify(isi)); } catch (e) { throw { code: "failed", message: "Isian tidak bisa disimpan di browser ini" }; } };
    const pendengar = new Map();   // koleksi -> Set(cb)
    const kabari = (n) => { const s = baca(n), docs = Object.entries(s).map(([id, d]) => ({ id, data: () => JSON.parse(JSON.stringify(d)) }));
      for (const cb of pendengar.get(n) || []) { try { cb({ docs, size: docs.length, empty: !docs.length }); } catch (e) { console.error(e); } } };
    addEventListener("storage", (e) => { if (e.key && e.key.startsWith(AWAL)) kabari(e.key.slice(AWAL.length)); });
    const dok = (n, id) => ({ id,
      async set(isi) { const s = baca(n); s[id] = isi; tulis(n, s); kabari(n); },
      async update(isi) { const s = baca(n); s[id] = { ...(s[id] || {}), ...isi }; tulis(n, s); kabari(n); },
      async delete() { const s = baca(n); delete s[id]; tulis(n, s); kabari(n); } });
    const db = {
      collection(n) { return {
        onSnapshot(cb) { if (!pendengar.has(n)) pendengar.set(n, new Set()); pendengar.get(n).add(cb); setTimeout(() => kabari(n), 0); return () => pendengar.get(n).delete(cb); },
        async add(isi) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await dok(n, id).set(isi); return { id }; },
        doc(id) { return dok(n, id); } }; },
      doc(jalur) { const [n, id] = String(jalur).split("/"); return dok(n, id); },
    };
    const pengguna = { async id() { return "browser-ini"; }, async can(h) { return h === "data.write" ? true : null; } };

      a.href = URL.createObjectURL(b); a.download = filename || "unduhan"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000); } };
    return { use(nama) { return Promise.resolve(nama === "db" ? db : nama === "user" ? pengguna : nama === "downloads" ? unduhan : null); } };
  }
  // Isian BERSAMA di Mac (Joe 31 Okt 2026; isian_web.py di layanan chat): masuk dengan akun & sandi halaman ini,
  // baca tiap 30 detik + sesudah menulis. Gagal tersambung -> isian browser ini (isianLokal) dengan pita peringatan.
  async function isianServer(akun, sandi) {
    const API = "https://svarna5s-mac-mini.tail7a15d8.ts.net/api/isian/";
    const kirim = async (jalan, isi, token) => {
      const r = await fetch(API + jalan, { method: "POST", body: JSON.stringify(isi),
        headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) } });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: r.status === 403 ? "permission_denied" : "failed", message: d.galat || ("gagal " + r.status) };
      return d;

    const { token } = await kirim("masuk", { akun, sandi });

      for (const cb of pendengar.get(n) || []) { try { cb({ docs, size: docs.length, empty: !docs.length }); } catch (e) { console.error(e); } } };

      const d = await kirim("tulis", { koleksi: n, id, op, isi }, token);
      const s = cache.get(n) || {};
      if (d.isi) s[id] = d.isi; else delete s[id];
      cache.set(n, s); kabari(n);
    };

    const db = {
      collection(n) { return {
        onSnapshot(cb) { if (!pendengar.has(n)) pendengar.set(n, new Set()); pendengar.get(n).add(cb); if (cache.has(n)) setTimeout(() => kabari(n), 0); else tarik(n); return () => pendengar.get(n).delete(cb); },
        async add(isi) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await dok(n, id).set(isi); return { id }; },
        doc(id) { return dok(n, id); } }; },
      doc(jalur) { const [n, id] = String(jalur).split("/"); return dok(n, id); },

    }
    const isianBersama = isianServer(akun, sandi).catch((e) => { console.error("isian bersama", e); return null; });

    const asli = window.fetch.bind(window);

      const m = String(u && u.url || u).match(/(?:^|\/)data\/([\w.-]+\.json)(?:[?#]|$)/);

    } catch (e) { console.error(e); }

    // db & user = penyimpanan bersama Mac (isianServer); bila gagal tersambung -> browser ini saja (isianLokal) + pita.

    s.textContent = document.getElementById("gio-utama").textContent;
    document.body.append(s);
