<style>
/* Layout: header buku besar (judul + pilihan bulan/cabang), baris tab, lalu kartu angka dan tabel per tab. */
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --fg: #16202b;
  --muted: #5b6876;
  --line: #dde3ea;
  --accent: #1d5c78;
  --accent-soft: #e3eef3;
  --ok: #1f7a4d;
  --warn: #9a6200;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --warn-soft: #fdf1dc;
  --ok-soft: #e4f3ea;
  --bar: #9fc0d0;
  --font-ui: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", "Consolas", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --panel: #18212a; --fg: #e6ecf1; --muted: #9aa8b5; --line: #2a3642;
    --accent: #6fb3d2; --accent-soft: #1d3240; --ok: #5cc28d; --warn: #e0a84a; --bad: #f08a80;
    --bad-soft: #3a2220; --warn-soft: #3a2f1c; --ok-soft: #1c3428; --bar: #3f6b80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #18212a; --fg: #e6ecf1; --muted: #9aa8b5; --line: #2a3642;
  --accent: #6fb3d2; --accent-soft: #1d3240; --ok: #5cc28d; --warn: #e0a84a; --bad: #f08a80;
  --bad-soft: #3a2220; --warn-soft: #3a2f1c; --ok-soft: #1c3428; --bar: #3f6b80;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1280px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
header.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
header.top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
label.ctl { display: grid; gap: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
select, input, textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { appearance: none; border: 0; background: none; font: inherit; font-weight: 600; font-size: 13.5px; color: var(--muted); padding: 9px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover { color: var(--fg); }
section.page { display: grid; gap: 16px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--font-num); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .n { font-size: 12.5px; color: var(--muted); }
.up { color: var(--ok); } .down { color: var(--bad); } .warn { color: var(--warn); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.card h2 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
.card .note { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 75ch; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
/* min-width:0 supaya tabel lebar menggulir di dalam kotaknya, bukan melebarkan halaman */
.card > * { min-width: 0; }
.tbl-wrap { overflow: auto; min-width: 0; max-height: 560px; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 9px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; z-index: 1; cursor: pointer; user-select: none; white-space: nowrap; }
th[aria-sort="ascending"]::after { content: " ▲"; } th[aria-sort="descending"]::after { content: " ▼"; }
td.num, th.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.num { font-family: var(--font-ui); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
.bar-cell { position: relative; }
.bar-cell .b { position: absolute; inset: 4px auto 4px 0; background: var(--accent-soft); border-radius: 3px; z-index: 0; }
.bar-cell span { position: relative; z-index: 1; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.mut { background: var(--accent-soft); color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
button.btn { appearance: none; font: inherit; font-weight: 600; font-size: 13px; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); padding: 7px 12px; border-radius: 6px; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--accent); }
button.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
button.btn:disabled { opacity: .5; cursor: default; }
.formgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.formgrid label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
.formgrid .wide { grid-column: 1 / -1; }
input.tgt { width: 9.5em; text-align: right; font-family: var(--font-num); padding: 3px 6px; }
    input.cat { width: 20em; max-width: 46vw; padding: 3px 6px; }
.chart { width: 100%; min-height: 220px; position: relative; }
.chart svg text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; z-index: 5; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
.msg { font-size: 13px; padding: 8px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.muted { color: var(--muted); }
details.detail summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--accent); }
.mono { font-family: var(--font-num); font-size: 12.5px; }
@media (max-width: 520px) { .kpi .v { font-size: 19px; } header.top h1 { font-size: 19px; } }
</style>

<script type="text/plain" id="gio-utama">
(() => {
  "use strict";
  // ---------- util tampilan ----------
  const $ = (s, r = document) => r.querySelector(s);
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
    return e;
  }
  const nf0 = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
  const rp = (x) => "Rp " + nf0.format(Math.round(x || 0));
  function rpK(x) { // ringkas: jt / M
    const a = Math.abs(x || 0), s = x < 0 ? "-" : "";
    if (a >= 1e9) return s + "Rp " + nf1.format(a / 1e9).replace(/,0$/, "") + " M";
    if (a >= 1e6) return s + "Rp " + nf1.format(a / 1e6).replace(/,0$/, "") + " jt";
    return s + "Rp " + nf0.format(a);
  }
  const pct = (x) => (x == null || !isFinite(x)) ? "–" : nf1.format(x * 100) + "%";
  const BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  const namaBulan = (m) => { const [y, b] = m.split("-"); return BLN[+b - 1] + " " + y; };
  const sum = (rows, f) => rows.reduce((a, r) => a + (+r[f] || 0), 0);
  function groupSum(rows, keyFn, fields) {
    const m = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      let a = m.get(k); if (!a) { a = { key: k }; for (const f of fields) a[f] = 0; m.set(k, a); }
      for (const f of fields) a[f] += +r[f] || 0;
    }
    return [...m.values()];
  }

  // tabel yang bisa diurutkan: cols = [{h, f (row=>value), num, fmt, bar, cls}]
  function table(cols, rows, opts = {}) {
    const wrap = el("div", { class: "tbl-wrap", style: opts.maxH ? "max-height:" + opts.maxH : null });
    const t = el("table");
    const thead = el("thead"), tb = el("tbody");
    let sortI = opts.sort ?? -1, dir = opts.dir || "desc", urut = rows, batas = opts.limit || 0;
    // tabel panjang ditampilkan bertahap; tombol di bawah tabel menambah barisnya
    const kaki = el("div", { class: "row", style: "gap:8px;align-items:center;margin-top:6px" });
    const trh = el("tr");
    cols.forEach((c, i) => {
      const th = el("th", { class: c.num ? "num" : null, scope: "col", text: c.h, tabindex: "0" });
      if (c.hn) th.append(c.hn());   // isi tambahan di judul kolom (mis. ceklis semua); klik di dalamnya tidak mengurutkan
      const act = () => { if (sortI === i) dir = dir === "asc" ? "desc" : "asc"; else { sortI = i; dir = c.num ? "desc" : "asc"; } draw(); };
      th.addEventListener("click", act);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter") act(); });
      trh.append(th);
    });
    thead.append(trh);
    const maxBar = {};
    cols.forEach((c, i) => { if (c.bar) maxBar[i] = Math.max(1, ...rows.map((r) => Math.abs(+c.f(r) || 0))); });
    function draw() {
      [...trh.children].forEach((th, i) => th.setAttribute("aria-sort", i === sortI ? (dir === "asc" ? "ascending" : "descending") : "none"));
      const rs = rows.slice();
      if (sortI >= 0) {
        const c = cols[sortI];
        rs.sort((a, b) => { const x = c.f(a), y = c.f(b); const r = c.num ? (x || 0) - (y || 0) : String(x ?? "").localeCompare(String(y ?? ""), "id"); return dir === "asc" ? r : -r; });
      }
      tb.replaceChildren();
      urut = rs;
      const lim = batas ? rs.slice(0, batas) : rs;
      for (const r of lim) {
        const tr = el("tr", { class: opts.onRow ? "click" : null });
        if (opts.onRow) tr.addEventListener("click", () => opts.onRow(r));
        cols.forEach((c, i) => {
          const v = c.f(r);
          const td = el("td", { class: [c.num ? "num" : "", c.bar ? "bar-cell" : "", c.cls || ""].join(" ").trim() || null });
          const shown = c.node ? c.node(r) : (c.fmt ? c.fmt(v, r) : (v ?? ""));
          if (c.bar) { td.append(el("div", { class: "b", style: "width:" + Math.min(100, Math.abs(+v || 0) / maxBar[i] * 100) + "%" }), el("span", null, shown)); }
          else td.append(shown instanceof Node ? shown : String(shown));
          tr.append(td);
        });
        tb.append(tr);
      }
      if (opts.total) {
        const tr = el("tr", { class: "total" });
        cols.forEach((c, i) => tr.append(el("td", { class: c.num ? "num" : null }, opts.total[i] ?? "")));
        tb.append(tr);
      }
      if (!rows.length) tb.append(el("tr", null, el("td", { colspan: cols.length, class: "empty", text: opts.empty || "Tidak ada data untuk pilihan ini." })));
      kaki.replaceChildren();
      if (batas && rows.length > batas) {
        const tambah = (n) => { batas = n ? Math.min(rows.length, batas + n) : 0; draw(); };
        kaki.append(el("span", { class: "note", style: "margin:0", text: "Menampilkan " + nf0.format(batas) + " dari " + nf0.format(rows.length) + " baris teratas sesuai urutan." }),
          el("button", { class: "btn ghost", type: "button", style: "padding:3px 10px;font-size:12px", onclick: () => tambah(opts.limit) }, "Tampilkan " + nf0.format(Math.min(opts.limit, rows.length - batas)) + " baris lagi"),
          el("button", { class: "btn ghost", type: "button", style: "padding:3px 10px;font-size:12px", onclick: () => tambah(0) }, "Tampilkan semua"),
          el("span", { class: "muted", style: "font-size:12px", text: "Unduh Excel berisi semua baris." }));
      }
    }
    draw();
    t.append(thead, tb); wrap.append(t);
    const pesan = el("span", { class: "muted", style: "font-size:12px" });
    const tombol = el("button", { class: "btn ghost", type: "button", style: "padding:3px 10px;font-size:12px", title: "Semua baris tabel ini, sesuai pilihan bulan/cabang/sales dan urutan saat ini" }, "Unduh Excel");
    tombol.addEventListener("click", () => unduhExcel(cols, urut, wrap, tombol, pesan));
    const bar = rows.length ? el("div", { class: "row", style: "gap:8px;align-items:center;justify-content:flex-end;margin:0 0 6px" }, pesan, tombol) : null;
    if (opts.limit && rows.length > opts.limit) return el("div", null, bar, wrap, kaki);
    return bar ? el("div", null, bar, wrap) : wrap;
  }

  // halaman web biasa (GitHub Pages) tidak punya window.claude, jadi berkasnya diunduh lewat Blob
  function simpanBerkas(nama, buf) {
    const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = el("a", { href: url, download: nama, style: "display:none" });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  // ---------- unduh Excel (SheetJS dimuat saat tombol pertama kali diklik) ----------
  let xlsxSiap = null;
  const muatXlsx = () => xlsxSiap || (xlsxSiap = new Promise((ok, gagal) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxSiap = null; gagal(new Error("muat")); };
    document.head.append(s);
  }));
  async function unduhExcel(cols, rows, wrap, tombol, pesan) {
    const judul = (wrap.closest(".card")?.querySelector("h2")?.textContent || "Dashboard").trim();
    pesan.textContent = "Menyiapkan…"; tombol.disabled = true;
    try {
      const [X, dl] = await Promise.all([muatXlsx(), window.claude ? window.claude.use("downloads").catch(() => null) : null]);
      const aoa = [cols.map((c) => c.h)].concat(rows.map((r) => cols.map((c) => {
        const v = c.f(r);
        return typeof v === "number" ? (isFinite(v) ? v : null) : v == null ? "" : String(v);
      })));
      const info = [["Dashboard", document.title], ["Tabel", judul], ["Data per", D.meta.periode_sampai || ""],

  // ---------- penahan bonus (Kak Intan 30 Okt 2026) ----------
  // "bonus sales slowmoving + masih ada DO yang belum lunas gak" -> bonus TETAP dihitung penuh,
  // barisnya hanya diberi status DITAHAN supaya kelihatan sebelum dibayar. Dua sebabnya:
  //   1. DO belum lunas yang sudah lewat jatuh tempo (data/piutang.json, nomornya DO.xxxx, per sales)
  //   2. stok sangat lambat di cabangnya lewat TAHAN_SLOW (dari umur stok, bukan slow moving lama)
  // Slow moving per sales tidak bisa dihitung dari datanya: stok dibukukan per gudang, tidak ada nama
  // sales di sana - jadi yang dipakai angka cabangnya, dibaca berdampingan dengan porsi target cabang.
  const TAHAN_SLOW = 0.2;
  // tenggang telat DO sebelum bonus ditandai DITAHAN. Tanpa tenggang, 35 dari 41 sales ikut
  // tertanda karena DO telat beberapa hari itu kejadian sehari-hari (uji 30 Okt 2026).
  const TAHAN_HARI = 30;
  function penahanBonus(bon, m) {
    const perSales = new Map();
    for (const p of D.piutang || []) {
      if (!(p.sisa > 0)) continue;
      let a = perSales.get(p.sales_id);
      if (!a) { a = { n: 0, sisa: 0, nOver: 0, over: 0, tua: 0, nTua: 0, tuaRp: 0 }; perSales.set(p.sales_id, a); }
      a.n++; a.sisa += p.sisa;
      if (p.hari_lewat > 0) { a.nOver++; a.over += p.sisa; a.tua = Math.max(a.tua, p.hari_lewat); }
      if (p.hari_lewat > TAHAN_HARI) { a.nTua++; a.tuaRp += p.sisa; }
    }
    const perCabang = new Map();
    for (const r of D.umur_stok || []) {
      let a = perCabang.get(r.cabang);
      if (!a) { a = { nilai: 0, sl: 0 }; perCabang.set(r.cabang, a); }
      a.nilai += r.nilai;
      if (r.status === "SANGAT LAMBAT") a.sl += r.nilai;
    }
    // target cabang = jumlah target sales cabang itu bulan ini. Belum diisi -> dipakai omset cabang,
    // jadi kolomnya tetap terbaca (porsi omset) dan ditandai di barisnya.
    const tgt = new Map(), oms = new Map();
    for (const s of bon) {
      tgt.set(s.cabang, (tgt.get(s.cabang) || 0) + (s.target || 0));
      oms.set(s.cabang, (oms.get(s.cabang) || 0) + (s.omset_ppn || 0));
    }
    for (const s of bon) {
      const d = perSales.get(s.sales_id) || { n: 0, sisa: 0, nOver: 0, over: 0, tua: 0, nTua: 0, tuaRp: 0 };
      const u = perCabang.get(s.cabang) || { nilai: 0, sl: 0 };
      s.do_n = d.n; s.do_sisa = d.sisa; s.do_over_n = d.nOver; s.do_over = d.over; s.do_tua = d.tua;
      s.do_tua_n = d.nTua; s.do_tua_rp = d.tuaRp;
      s.slow_cab = u.nilai ? u.sl / u.nilai : 0; s.slow_cab_rp = u.sl; s.stok_cab = u.nilai;
      const tc = tgt.get(s.cabang) || 0, oc = oms.get(s.cabang) || 0;
      s.target_cab = tc || null;
      s.porsi_cab = tc ? s.omset_ppn / tc : (oc ? s.omset_ppn / oc : null);
      s.sebab_tahan = [];
      if (d.nTua) s.sebab_tahan.push(nf0.format(d.nTua) + " DO telat lebih dari " + TAHAN_HARI + " hari senilai " + rpK(d.tuaRp) + " (terlama " + nf0.format(d.tua) + " hari)");
      if (s.slow_cab > TAHAN_SLOW) s.sebab_tahan.push("stok sangat lambat cabang " + pct(s.slow_cab) + " (" + rpK(u.sl) + ")");
      s.tahan = s.sebab_tahan.length > 0;
    }
  }
  const nodeDO = (r) => !r.do_n ? el("span", { class: "muted", text: "–" })
    : el("span", { title: nf0.format(r.do_n) + " DO belum lunas, sisa " + rpK(r.do_sisa) + (r.do_over_n ? "; " + nf0.format(r.do_over_n) + " di antaranya lewat jatuh tempo, " + nf0.format(r.do_tua_n) + " telat lebih dari " + TAHAN_HARI + " hari" : "; semuanya belum lewat jatuh tempo") },
        el("b", { class: r.do_over_n ? "down" : null, text: rpK(r.do_sisa) }),
        el("div", { class: "muted", style: "font-size:11px", text: nf0.format(r.do_n) + " DO" + (r.do_over_n ? " · " + nf0.format(r.do_over_n) + " lewat tempo " + rpK(r.do_over) : "") }),
        r.do_tua_n ? el("div", { class: "down", style: "font-size:11px", text: nf0.format(r.do_tua_n) + " telat > " + TAHAN_HARI + " hr " + rpK(r.do_tua_rp) }) : null);
  const nodeSlowCab = (r) => !r.stok_cab ? el("span", { class: "muted", text: "–" })
    : el("span", { class: "pill " + (r.slow_cab > TAHAN_SLOW ? "bad" : r.slow_cab > 0.1 ? "warn" : "ok"), title: "Dari umur stok cabang " + r.cabang + ": " + rpK(r.slow_cab_rp) + " dari nilai stok " + rpK(r.stok_cab), text: pct(r.slow_cab) });
  const nodeTahan = (r) => r.tahan
    ? el("span", { class: "pill bad", title: r.sebab_tahan.join("; "), text: "DITAHAN" })
    : el("span", { class: "pill ok", text: "Bisa dibayar" });
  const nodeTargetCab = (r) => r.porsi_cab == null ? el("span", { class: "muted", text: "–" })
    : el("span", { title: r.target_cab ? "Target cabang " + r.cabang + " " + rpK(r.target_cab) + " (jumlah target sales cabang itu bulan ini)" : "Target cabang " + r.cabang + " belum diisi, jadi yang ditampilkan porsi omsetnya terhadap omset cabang" },
        pct(r.porsi_cab), r.target_cab ? null : el("div", { class: "muted", style: "font-size:11px", text: "porsi omset" }));

    const bon = hitungBonus(m), ins = insentifSales(m), hs = bonusHargaSpesial(m);

  // ---------- grafik komposisi umur stok (Kak Intan 30 Okt 2026: "slowmoving pakai grafik") ----------
  // Satu batang per cabang (atau per merk kalau satu cabang sedang dipilih). Panjang batang = nilai
  // stoknya dibanding yang terbesar, isinya dipecah menurut status umur - jadi sekali pandang kelihatan
  // mana yang nilainya besar DAN mana yang banyak mengendap.
  const UMUR_SEGMEN = [["sl", "SANGAT LAMBAT", "bad"], ["l", "LAMBAT", "warn"], ["dp", "PERLU DIPANTAU", "acc"], ["nm", "NORMAL", "ok"]];
  const UMUR_VAR = { bad: "bad", warn: "warn", acc: "accent", ok: "ok" };
  function chartUmurCabang(host, data) {
    host.replaceChildren();
    const rows = data.filter((d) => d.nilai > 0).sort((a, b) => b.sl - a.sl || b.nilai - a.nilai).slice(0, 14);
    if (!rows.length) { host.append(el("div", { class: "empty", text: "Belum ada nilai stok untuk pilihan ini." })); return; }
    const c = warnaCss(), W = Math.max(320, host.clientWidth || 700), mL = 112, mR = 62, bh = 18, gap = 10;
    const H = rows.length * (bh + gap) + 8, maks = Math.max(...rows.map((d) => d.nilai)), lebar = Math.max(40, W - mL - mR);
    const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img",
      "aria-label": "Nilai stok dipecah menurut status umur stok" });
    rows.forEach((d, i) => {
      const y = i * (bh + gap) + 4, total = d.nilai * lebar / maks;
      const nm = svgEl("text", { x: mL - 8, y: y + bh - 4, "text-anchor": "end" });
      nm.textContent = String(d.key).length > 15 ? String(d.key).slice(0, 14) + "…" : d.key;
      const tn = svgEl("title"); tn.textContent = d.key + " · nilai stok " + rpK(d.nilai); nm.append(tn);
      svg.append(nm);
      let x = mL;
      for (const [k, lbl, warna] of UMUR_SEGMEN) {
        const w = (d[k] || 0) / d.nilai * total;
        if (!(w > 0)) continue;
        const r = svgEl("rect", { x: x, width: Math.max(0.8, w), y: y, height: bh, fill: c[warna] });
        const tt = svgEl("title");
        tt.textContent = d.key + " · " + lbl + " " + rpK(d[k]) + " = " + pct(d[k] / d.nilai) + " dari " + rpK(d.nilai);
        r.append(tt); svg.append(r); x += w;
      }
      const buruk = d.sl / d.nilai;
      const tx = svgEl("text", { x: mL + total + 6, y: y + bh - 4, fill: buruk > 0.2 ? c.bad : c.mut });
      tx.textContent = pct(buruk); svg.append(tx);
    });
    host.append(svg,
      el("div", { class: "row", style: "gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12px" },
        ...UMUR_SEGMEN.map(([, lbl, warna]) => el("span", { class: "row", style: "gap:5px;align-items:center" },
          el("span", { style: "width:11px;height:11px;border-radius:2px;display:inline-block;background:var(--" + UMUR_VAR[warna] + ")" }), lbl))),
      el("p", { class: "note", style: "margin:4px 0 0", text: "Angka di kanan batang = porsi nilai stok yang berstatus SANGAT LAMBAT; merah kalau lewat 20%. Panjang batang = nilai stok dibanding yang terbesar. Arahkan kursor ke batang untuk nilai tiap status." }));
  }

  // batas stok dalam HARI rata-rata jual - Bu Diana 30 Okt 2026 (sebelumnya Cosmos 10, Miyako 21,

  const PO_LOKASI_LUAR = ["ONLINE", "TRANSIT", "GUDANG BELUM DIPETAKAN"];

  const jumatPO = () => { const d = new Date(); d.setDate(d.getDate() + (12 - d.getDay()) % 7); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  const kenaProgram = (p, item, merk, cabang, tgl) => (!p.dari || p.dari <= tgl) && (!p.sampai || p.sampai >= tgl) &&
    (!p.brand || p.brand === merk) && (!p.cabang || p.cabang === cabang) &&
    (!p.item || p.item.toUpperCase().split(/[\s,;]+/).filter(Boolean).includes(String(item).toUpperCase()));
  // status satu baris dari isian fix & program saat ini
  function statusPesan(r) {
    const isi = S.pesanFix[r.key] || {};

    const progBaris = (isi.program || "").trim(), adaProgram = !!(r.prog || progBaris || r.pp);
    // approve otomatis (Kak Intan 31 Okt 2026): fix pesan yang tidak melebihi saran pesan saat diisi, kecuali
    // pusat membatalkannya (acc_tolak). Saran pembanding = saran yang tersimpan bersama isian fix itu.
    const saranRef = isi.saran != null ? +isi.saran : r.saran;
    const otomatis = !isi.acc && !isi.acc_tolak && fix != null && fix > 0 && fix <= saranRef;
    const acc = !!isi.acc || otomatis;

    if (fix == null) return { fix, progBaris, adaProgram, acc, otomatis, accWaktu, pesan: r.saran, over: 0, ket: r.saran > 0 ? "pesan" : r.lebih > 0 ? "lebih" : "cukup" };
    const over = Math.max(0, Math.max(0, r.stok) + r.po + fix - r.maks);
    return { fix, progBaris, adaProgram, acc, otomatis, accWaktu, pesan: fix, over, ket: !over ? "fix" : adaProgram ? "over_prog" : "over" };
  }
  const KET_PESAN = { pesan: ["Saran pesan", "warn"], lebih: ["Stok lebih", "bad"], cukup: ["Cukup", "ok"], fix: ["Fix sesuai batas", "ok"], over: ["Overlimit", "bad"], over_prog: ["Overlimit · catatan", "warn"] };
  const nodeStatusPesan = (r, st) => el("span", { class: "pill " + KET_PESAN[st.ket][1],
    title: st.over ? nf0.format(st.over) + " unit di atas maks stok " + nf0.format(r.maks) + (st.ket === "over_prog" ? ", diperbolehkan karena ada program / catatan" : ", isi kolom Catatan kalau memang ada program atau tambahan order sales") : r.lebih && st.ket === "lebih" ? nf0.format(r.lebih) + " unit di atas batas" : null,
    text: KET_PESAN[st.ket][0] + (st.over ? " +" + nf0.format(st.over) : st.ket === "lebih" ? " " + nf0.format(r.lebih) : "") });
  // PO terbuka (data/po_terbuka.json, ditarik tiap malam): sisa barang yang belum datang dihitung
  // sebagai stok yang akan masuk. PO yang lebih tua dari PO_UMUR_HARI tidak dikurangkan - per

  const PO_UMUR_HARI = 90;
  function petaPO() {
    if (D.poPeta) return D.poPeta;

    }

  // ---------- pemindahan barang JKT -> cabang (Kak Intan 31 Okt 2026) ----------
  // Alur: cabang/sales minta tipe yang dikirim dari JKT -> cek stok JKT -> tanya Hana kiriman ke cabang ->
  // input Pemindahan Barang (Kirim Barang) di Accurate -> diterima cabang. Tiap tahap satu ceklis.

  // tahap "Siap input Accurate" menyiapkan daftar per gudang asal -> tujuan untuk diketik/disalin admin.
  // gudang asal JKT: DAANMOGOT atau LAKSANA (Tangerang, digabung ke Jakarta) - dipilih yang stoknya lebih banyak
  const PINDAH_GUDANG_JKT = ["DAANMOGOT", "LAKSANA"];
  const PINDAH_ASAL = PINDAH_GUDANG_JKT.join(" / ");
  const PINDAH_TAHAP = [
    ["cek_stok", "Stok JKT dicek"],
    ["hana", "Hana OK kirim"],
    ["input_acc", "Sudah input Accurate"],
    ["terima", "Diterima cabang"],
  ];

    : p.hana ? ["Siap input Accurate", "warn"] : p.cek_stok ? ["Menunggu Hana", "mut"] : ["Menunggu cek stok", "mut"];
  // stok JKT per barang: pusat dari slow_moving (semua cabang), halaman cabang dari data/stok_jkt.json
  function stokJkt() {
    if (D.stokJktPeta) return D.stokJktPeta;
    const rows = D.stok_jkt || (D.slow_moving || []).filter((r) => r.cabang === "JAKARTA");
    const m = new Map();
    for (const r of rows) {
      const maks = Math.ceil(Math.max(0, r.rata || 0) / 30 * batasMerk(brandItem(r.item)));
      const utama = (r.gudang || []).filter(([g]) => PINDAH_GUDANG_JKT.includes(g)).sort((a, b) => b[1] - a[1]);
      const total = utama.reduce((a, x) => a + x[1], 0);
      m.set(r.item, { stok: r.stok || 0, asal: total, asalG: utama.length ? utama[0][0] : PINDAH_GUDANG_JKT[0], gudang: r.gudang || [], maks, bebas: Math.max(0, total - maks) });
    }
    return (D.stokJktPeta = m);

  // gudang utama cabang = gudang bukan RETUR/SERVICE/FAS dengan baris barang terbanyak
  function gudangUtama(cabang) {
    const n = new Map();
    for (const r of D.slow_moving || []) if (r.cabang === cabang) for (const [g] of r.gudang || []) if (!/RETUR|SERVICE|FAS/.test(g)) n.set(g, (n.get(g) || 0) + 1);

        { h: "Pelanggan", f: (r) => r.pelanggan },
        { h: "Cabang", f: (r) => r.cabang },
        { h: "Sales", f: (r) => namaSales(r.sales_id) },

        { h: "Sisa piutang", f: (r) => r.sisa, num: true, fmt: rp, bar: true },
        { h: cab ? "Alasan overdue" : "Catatan cabang", f: (r) => (catatanFaktur(r.nomor) || {}).teks || "", node: (r) => inputCatatan(r) },
      ], odFak, { sort: 5, limit: 300, empty: "Tidak ada faktur yang lewat jatuh tempo untuk pilihan ini." }));
    sec.replaceChildren(...[
      el("div", { class: "kpis" },
        kpi("Piutang belum tertagih", rpK(tot), nf0.format(pu.length) + " faktur"),
        kpi("Overdue", rpK(tot - bucket[0].sisa), pct((tot - bucket[0].sisa) / tot) + " dari piutang", "down"),
        kpi("Overdue > 90 hari", rpK(bucket[4].sisa), nf0.format(bucket[4].n) + " faktur", bucket[4].sisa ? "down" : ""),

          cab ? "faktur overdue yang alasannya sudah diisi" : "faktur overdue yang sudah dijelaskan cabang", odFak.length && !adaCat.length ? "warn" : "")),

      el("div", { class: "grid2" },
        card("Umur piutang", "Dihitung dari tanggal jatuh tempo sampai hari data ditarik.", table([
          { h: "Umur", f: (r) => r.key },
          { h: "Sisa piutang", f: (r) => r.sisa, num: true, fmt: rpK, bar: true },
          { h: "Faktur", f: (r) => r.n, num: true, fmt: nf0.format },
          { h: "%", f: (r) => r.sisa / tot, num: true, fmt: pct },
        ], bucket, { sort: -1 })),
        card("Per sales", "Online/marketplace tanpa sales digabung di baris pertama.", table([
          { h: "Sales", f: (r) => namaSales(r.sid) },
          { h: "Piutang", f: (r) => r.sisa, num: true, fmt: rpK },

        { h: "Cabang", f: (r) => r.cab },
        { h: "Sales", f: (r) => r.sales },
        { h: "Piutang", f: (r) => r.sisa, num: true, fmt: rp },

        { h: "Terlama", f: (r) => r.maks, num: true, node: (r) => r.maks > 0 ? el("span", { class: "pill " + (r.maks > 90 ? "bad" : r.maks > 30 ? "warn" : "mut"), text: r.maks + " hari" }) : el("span", { class: "muted", text: "–" }) },

  }

  // piutang all (Kak Intan, 28 Okt 2026): semua faktur belum lunas, bukan hanya yang overdue,
  // dengan tanggal beli, tempo, dan tanggal wajib bayar. Sumbernya piutang.json yang sama.
  async function pPiutangAll(sec) {
    await Promise.all([muatLain("piutang"), muatCatatanCabang()]);
    const minus = D.piutang.filter((p) => p.sisa < 0 && filt(p));
    const pu = D.piutang.filter((p) => p.sisa > 0 && filt(p));
    const hariAntara = (a, b) => (a && b) ? Math.round((Date.parse(b) - Date.parse(a)) / 864e5) : null;
    const tglData = (D.meta.dibuat || "").slice(0, 10) || new Date().toISOString().slice(0, 10);
    // sisa hari menuju jatuh tempo (positif) / sudah lewat (negatif), dihitung dari hari data ditarik
    const semuaRows = pu.map((p) => ({ ...p, tempo: hariAntara(p.tgl, p.jatuh_tempo), umur: hariAntara(p.tgl, tglData), sisaHari: p.hari_lewat > 0 ? -p.hari_lewat : hariAntara(tglData, p.jatuh_tempo) }));
    // filter tambahan (Kak Intan 28 Okt 2026); cabang & sales ikut pilihan di atas halaman
    const STATUS_PA = { "": "Semua status", belum: "Belum jatuh tempo", minggu: "Jatuh tempo ≤ 7 hari", od: "Sudah overdue", od30: "Overdue > 30 hari", od90: "Overdue > 90 hari" };
    const cocokStatus = (r) => !S.paStatus || (S.paStatus === "belum" ? !(r.hari_lewat > 0) : S.paStatus === "minggu" ? !(r.hari_lewat > 0) && r.sisaHari != null && r.sisaHari <= 7
      : S.paStatus === "od" ? r.hari_lewat > 0 : S.paStatus === "od30" ? r.hari_lewat > 30 : r.hari_lewat > 90);
    const adaAlasan = (r) => !!((catatanFaktur(r.nomor) || {}).teks);
    const cariPel = String(S.paPel || "").trim().toUpperCase();
    const rows = semuaRows.filter((r) => cocokStatus(r) && (!cariPel || String(r.pelanggan || "").toUpperCase().includes(cariPel) || String(r.nomor || "").toUpperCase().includes(cariPel))
      && (!S.paAlasan || (S.paAlasan === "ada" ? adaAlasan(r) : !adaAlasan(r))));
    const selStatus = el("select", { id: "paStatus" }, Object.entries(STATUS_PA).map(([k, v]) => el("option", { value: k, text: v, selected: k === (S.paStatus || "") })));
    selStatus.addEventListener("change", () => { S.paStatus = selStatus.value; render(); });
    const inpPel = el("input", { id: "paPel", type: "search", placeholder: "nama pelanggan / no faktur", value: S.paPel || "", style: "min-width:14em" });
    inpPel.addEventListener("change", () => { S.paPel = inpPel.value; render(); });
    const selAlasan = el("select", { id: "paAlasan" }, [["", "Semua"], ["ada", "Sudah ada alasan"], ["belum", "Belum ada alasan"]].map(([k, v]) => el("option", { value: k, text: v, selected: k === (S.paAlasan || "") })));
    selAlasan.addEventListener("change", () => { S.paAlasan = selAlasan.value; render(); });
    const saringan = el("div", { class: "row", style: "gap:12px;flex-wrap:wrap;align-items:end" },
      el("label", { class: "ctl", for: "paPel" }, "Pelanggan", inpPel),
      el("label", { class: "ctl", for: "paStatus" }, "Status", selStatus),
      el("label", { class: "ctl", for: "paAlasan" }, "Alasan", selAlasan),
      el("span", { class: "muted", style: "font-size:12px;padding-bottom:7px", text: "Cabang & sales: pakai pilihan di bagian atas halaman. " + nf0.format(rows.length) + " dari " + nf0.format(semuaRows.length) + " faktur tampil." }));
    const tot = sum(rows, "sisa");
    const od = rows.filter((r) => r.hari_lewat > 0);
    const blm = rows.filter((r) => !(r.hari_lewat > 0));
    const minggu = blm.filter((r) => r.sisaHari != null && r.sisaHari <= 7);
    const status = (r) => r.hari_lewat > 0
      ? el("span", { class: "pill " + (r.hari_lewat > 90 ? "bad" : r.hari_lewat > 30 ? "warn" : "mut"), text: "Lewat " + r.hari_lewat + " hari dari jatuh tempo" })
      : r.sisaHari == null ? el("span", { class: "muted", text: "–" })
      : el("span", { class: "pill " + (r.sisaHari <= 7 ? "warn" : "ok"), text: r.sisaHari <= 0 ? "Jatuh tempo hari ini" : r.sisaHari + " hari lagi" });
    sec.replaceChildren(...[
      el("div", { class: "kpis" },
        kpi("Total piutang", rpK(tot), nf0.format(rows.length) + " faktur belum lunas"),
        kpi("Belum jatuh tempo", rpK(sum(blm, "sisa")), pct(sum(blm, "sisa") / tot) + " dari piutang · " + nf0.format(blm.length) + " faktur"),
        kpi("Jatuh tempo ≤ 7 hari", rpK(sum(minggu, "sisa")), nf0.format(minggu.length) + " faktur segera ditagih", minggu.length ? "warn" : ""),
        kpi("Sudah overdue", rpK(sum(od, "sisa")), pct(sum(od, "sisa") / tot) + " dari piutang · " + nf0.format(od.length) + " faktur", od.length ? "down" : "")),
      card("Semua faktur belum lunas", "Semua piutang yang belum lunas per hari data ditarik, baik yang belum maupun yang sudah lewat jatuh tempo. Tgl beli = tanggal faktur; Tempo = jumlah hari kredit (tgl wajib bayar − tgl beli); Tgl wajib bayar = tanggal jatuh tempo di Accurate; Umur = sudah berapa hari sejak tgl beli sampai hari data ditarik; Status = sudah lewat berapa hari dari tgl wajib bayar (atau berapa hari lagi kalau belum jatuh tempo). Urutan bawaannya menurut tanggal wajib bayar, yang paling awal dulu (yang paling lama menunggak di atas); klik judul kolom untuk mengurutkan ulang. Kolom Alasan bisa diketik langsung (Enter atau klik di luar kotak untuk menyimpan); alasan yang sudah ditulis cabang di tab Piutang overdue otomatis tampil di sini karena tersimpan di tempat yang sama.",
        saringan,
        el("div", { id: "aksesCatatan", class: "msg", hidden: S.canWrite !== false, text: "Akun Anda saat ini hanya bisa MELIHAT dashboard ini, jadi alasan yang diketik tidak bisa tersimpan. Minta pemilik dashboard mengubah akses Anda menjadi Contributor." }),
        table([
          { h: "Faktur", f: (r) => r.nomor, cls: "mono" },
          { h: "Pelanggan", f: (r) => r.pelanggan },
          { h: "Cabang", f: (r) => r.cabang },
          { h: "Sales", f: (r) => namaSales(r.sales_id) },
          { h: "Tgl beli", f: (r) => r.tgl },
          { h: "Tempo", f: (r) => r.tempo, num: true, fmt: (v) => v == null ? "–" : v + " hari" },
          { h: "Tgl wajib bayar", f: (r) => r.jatuh_tempo },
          { h: "Umur", f: (r) => r.umur, num: true, fmt: (v) => v == null ? "–" : v + " hari" },
          { h: "Status", f: (r) => r.sisaHari, num: true, node: status },
          { h: "Nilai faktur", f: (r) => r.total, num: true, fmt: rp },
          { h: "Sisa piutang", f: (r) => r.sisa, num: true, fmt: rp, bar: true },
          { h: "Alasan", f: (r) => (catatanFaktur(r.nomor) || {}).teks || "", node: (r) => inputCatatan(r) },
        ], rows, { sort: 6, dir: "asc", limit: 300, empty: "Tidak ada piutang untuk pilihan ini." })),
      minus.length ? el("p", { class: "note", text: "Hanya piutang bernilai positif yang ditampilkan. " + nf0.format(minus.length) + " dokumen bernilai minus (nota retur SR/SRT dan sejenisnya, total " + rpK(-sum(minus, "sisa")) + ") tidak dimasukkan; lihat tab Retur." }) : null].filter(Boolean));
  }

  // ---------- COD belum lunas: tab sendiri (Kak Intan 31 Okt 2026: "sheet terpisah aja ... terkhusus COD belum lunas") ----------
  // faktur bersyarat C.O.D di Accurate yang masih ada sisanya (field cod/termin di piutang.json)
  async function pCod(sec) {
    await Promise.all([muatLain("piutang"), muatCatatanCabang()]);
    const hariAntara = (a, b) => (a && b) ? Math.round((Date.parse(b) - Date.parse(a)) / 864e5) : null;
    const tglData = (D.meta.dibuat || "").slice(0, 10) || new Date().toISOString().slice(0, 10);
    const adaTermin = D.piutang.some((p) => p.termin);
    const semua = D.piutang.filter((p) => p.cod && p.sisa > 0 && filt(p)).map((p) => ({ ...p, umur: hariAntara(p.tgl, tglData) }));
    const cari = String(S.codCari || "").trim().toUpperCase();
    const UMUR_COD = { "": "Semua umur", lama: "Lebih dari 3 hari", seminggu: "Lebih dari 7 hari", baru: "0-3 hari" };
    const rows = semua.filter((r) => (!cari || String(r.pelanggan || "").toUpperCase().includes(cari) || String(r.nomor || "").toUpperCase().includes(cari))
      && (!S.codUmur || (S.codUmur === "lama" ? r.umur > 3 : S.codUmur === "seminggu" ? r.umur > 7 : !(r.umur > 3))));
    const lama = rows.filter((r) => r.umur > 3), seminggu = rows.filter((r) => r.umur > 7);
    const inpCari = el("input", { id: "codCari", type: "search", placeholder: "nama pelanggan / no faktur", value: S.codCari || "", style: "min-width:14em" });
    inpCari.addEventListener("change", () => { S.codCari = inpCari.value; render(); });
    const selUmur = el("select", { id: "codUmur" }, Object.entries(UMUR_COD).map(([k, v]) => el("option", { value: k, text: v, selected: k === (S.codUmur || "") })));
    selUmur.addEventListener("change", () => { S.codUmur = selUmur.value; render(); });
    // ringkasan per cabang (pusat) atau per sales (halaman cabang)
    const kunci = S.kunci ? (r) => namaSales(r.sales_id) : (r) => r.cabang;
    const g = new Map();
    for (const r of rows) {
      const k = kunci(r); let a = g.get(k);
      if (!a) { a = { key: k, n: 0, sisa: 0, n3: 0, sisa3: 0 }; g.set(k, a); }
      a.n++; a.sisa += r.sisa; if (r.umur > 3) { a.n3++; a.sisa3 += r.sisa; }
    }
    const ring = [...g.values()];
    sec.replaceChildren(...[
      el("div", { class: "kpis" },
        kpi("COD belum lunas", rpK(sum(rows, "sisa")), nf0.format(rows.length) + " faktur", rows.length ? "warn" : "up"),
        kpi("Lebih dari 3 hari", rpK(sum(lama, "sisa")), nf0.format(lama.length) + " faktur", lama.length ? "down" : "up"),
        kpi("Lebih dari 7 hari", rpK(sum(seminggu, "sisa")), nf0.format(seminggu.length) + " faktur", seminggu.length ? "down" : "up")),
      !adaTermin ? el("div", { class: "msg", text: "Syarat bayar faktur belum ada di data ini - muncul sesudah tarikan data berikutnya." }) : null,
      card(S.kunci ? "Per sales" : "Per cabang", "COD semestinya lunas di hari barang diterima, jadi yang umurnya lebih dari 3 hari perlu segera ditagih.",
        table([
          { h: S.kunci ? "Sales" : "Cabang", f: (r) => r.key },
          { h: "Faktur", f: (r) => r.n, num: true, fmt: nf0.format },
          { h: "Sisa belum dibayar", f: (r) => r.sisa, num: true, fmt: rp, bar: true },
          { h: "Faktur > 3 hari", f: (r) => r.n3, num: true, fmt: nf0.format },
          { h: "Sisa > 3 hari", f: (r) => r.sisa3, num: true, fmt: rp },
        ], ring, { sort: 2, total: ["Total", nf0.format(rows.length), rp(sum(rows, "sisa")), nf0.format(lama.length), rp(sum(lama, "sisa"))], empty: "Tidak ada COD yang belum lunas." })),
      card("Daftar COD belum lunas", "Faktur dengan syarat bayar C.O.D di Accurate yang masih ada sisa piutangnya per hari data ditarik. Umur = hari sejak tgl faktur sampai hari data ditarik; lebih dari 3 hari ditandai merah. Urutan bawaan: yang paling lama dulu. Kolom Alasan bisa diketik langsung (tersimpan di tempat yang sama dengan alasan di tab Piutang all). Cabang & sales: pakai pilihan di bagian atas halaman.",
        el("div", { class: "row", style: "gap:12px;flex-wrap:wrap;align-items:end" },
          el("label", { class: "ctl", for: "codCari" }, "Pelanggan", inpCari),
          el("label", { class: "ctl", for: "codUmur" }, "Umur", selUmur),
          el("span", { class: "muted", style: "font-size:12px;padding-bottom:7px", text: nf0.format(rows.length) + " dari " + nf0.format(semua.length) + " faktur tampil." })),
        el("div", { id: "aksesCatatan", class: "msg", hidden: S.canWrite !== false, text: "Akun Anda saat ini hanya bisa MELIHAT dashboard ini, jadi alasan yang diketik tidak bisa tersimpan." }),
        table([
          { h: "Faktur", f: (r) => r.nomor, cls: "mono" },
          { h: "Pelanggan", f: (r) => r.pelanggan },
          { h: "Cabang", f: (r) => r.cabang },
          { h: "Sales", f: (r) => namaSales(r.sales_id) },
          { h: "Tgl faktur", f: (r) => r.tgl },
          { h: "Umur", f: (r) => r.umur, num: true, node: (r) => el("span", { class: "pill " + ((r.umur || 0) > 3 ? "bad" : (r.umur || 0) > 0 ? "warn" : "ok"), text: r.umur == null ? "–" : r.umur + " hari" }) },
          { h: "Nilai faktur", f: (r) => r.total, num: true, fmt: rp },
          { h: "Sisa belum dibayar", f: (r) => r.sisa, num: true, fmt: rp, bar: true },
          { h: "Alasan", f: (r) => (catatanFaktur(r.nomor) || {}).teks || "", node: (r) => inputCatatan(r) },
        ], rows, { sort: 5, dir: "desc", limit: 500, empty: adaTermin ? "Tidak ada COD yang belum lunas untuk pilihan ini." : "Belum ada data syarat bayar." }))].filter(Boolean));
  }

  // ---------- pelanggan pasif (Kak Intan 31 Okt 2026) ----------
  // "langganan yang pengambilan banyak tapi udah gak aktif, pelanggan yg pembayarannya bagus tepat waktu tapi gak order lagi"
  // data/pelanggan_pasif.json dari skrip/pelanggan_pasif.py; hari tidak order = order terakhir s.d. hari data ditarik
  const PASIF_HARI = { 30: "30 hari", 45: "45 hari", 60: "60 hari", 90: "90 hari", 120: "120 hari" };
  function sparkBulan(v) {
    const max = Math.max(1, ...v), w = 6, h = 22, warna = warnaCss().bar;
    const svg = svgEl("svg", { viewBox: `0 0 ${v.length * w} ${h}`, width: v.length * w, height: h, role: "img", "aria-label": "Omset per bulan" });
    v.forEach((x, i) => {
      const t = x > 0 ? Math.max(2, h * x / max) : 0;
      svg.append(svgEl("rect", { x: i * w + 1, width: w - 2, y: h - t, height: t, rx: 1, fill: warna }));
    });
    return svg;
  }
  async function pPasif(sec) {
    const d = await muatLain("pelanggan_pasif").catch(() => null);
    if (!d) { sec.replaceChildren(el("div", { class: "msg", text: "Data pelanggan pasif belum ada - muncul sesudah tarikan data berikutnya." })); return; }
    const tglData = (d.meta.dibuat || D.meta.dibuat || "").slice(0, 10) || new Date().toISOString().slice(0, 10);
    const tahun = d.meta.bulan[0].slice(0, 4);
    const batas = +(S.pasifHari || 60);
    const cari = String(S.pasifCari || "").trim().toUpperCase();
    const semua = d.pelanggan.filter(filt).map((r) => ({ ...r,
      pasif: Math.round((Date.parse(tglData) - Date.parse(r.terakhir)) / 864e5),
      rata: r.bulan_aktif ? r.omset / r.bulan_aktif : 0,
      tepatP: r.lunas ? r.tepat / r.lunas : null }))
      .filter((r) => !cari || String(r.pelanggan).toUpperCase().includes(cari));
    // langganan = order di 2 bulan atau lebih; bayar bagus = min. 3 faktur lunas, >= 80% lunas sebelum/pada jatuh tempo, tanpa overdue sekarang
    const besar = semua.filter((r) => r.bulan_aktif >= 2 && r.pasif >= batas);
    const bagus = semua.filter((r) => r.lunas >= 3 && r.tepatP >= 0.8 && !(r.overdue > 0) && r.pasif >= batas);
    const selHari = el("select", { id: "pasifHari" }, Object.entries(PASIF_HARI).map(([k, v]) => el("option", { value: k, text: v, selected: +k === batas })));
    selHari.addEventListener("change", () => { S.pasifHari = selHari.value; render(); });
    const inpCari = el("input", { id: "pasifCari", type: "search", placeholder: "nama pelanggan", value: S.pasifCari || "", style: "min-width:14em" });
    inpCari.addEventListener("change", () => { S.pasifCari = inpCari.value; render(); });
    const kolom = (bayar) => [
      { h: "Pelanggan", f: (r) => r.pelanggan, node: (r) => el("div", { style: "min-width:160px" }, r.pelanggan, el("div", { class: "muted", style: "font-size:12px", text: r.brand + " · " + nf0.format(r.faktur) + " faktur" })) },
      { h: "Cabang", f: (r) => r.cabang },
      { h: "Sales", f: (r) => namaSales(r.sales_id) },
      { h: "Omset " + tahun + " (tanpa PPN)", f: (r) => r.omset, num: true, fmt: rp, bar: true },
      { h: "Rata per bulan aktif", f: (r) => r.rata, num: true, fmt: rpK },
      { h: "Bulan aktif", f: (r) => r.bulan_aktif, num: true, node: (r) => el("div", { style: "display:flex;gap:6px;align-items:center;justify-content:flex-end" }, sparkBulan(r.bln), el("span", { text: r.bulan_aktif + "/" + r.bln.length })) },
      { h: "Order terakhir", f: (r) => r.terakhir },
      { h: "Tidak order", f: (r) => r.pasif, num: true, node: (r) => el("span", { class: "pill " + (r.pasif >= 90 ? "bad" : "warn"), text: r.pasif + " hari" }) },

  function kelasTelat(r) {

    if ((tp < 0.2 && r.rata_telat > 30) || (r.lewat_maks > 60 && r.overdue >= 5e6 && tp < 0.5)) return "berat";
    if (tp < 0.5 && r.rata_telat > 7) return "turun";
    if (r.rata_telat > 3 && (tp < 0.5 || (r.lunas3 >= 3 && r.tepat3 / r.lunas3 < 0.5))) return "pantau";
    return null;

      const usul = kelas === "pantau" ? (r.limit > 1 ? r.limit : null) : Math.max(0, Math.round(dasar * TELAT_KELAS[kelas][2] / 1e6) * 1e6);
      return { ...r, kelas, tepatP: r.tepat / r.lunas, rata, usul, turun: r.limit > 1 && usul != null ? Math.max(0, r.limit - usul) : 0 };
    }).filter(Boolean).filter((r) => (!S.telatKelas || r.kelas === S.telatKelas) && (!cari || String(r.pelanggan).toUpperCase().includes(cari)));

  // ---------- retur penjualan ----------
  // grafik batang retur per bulan; tinggi = nilai retur, tooltip = % terhadap omset
  function chartRetur(host, data) {   // data: [{bulan, retur, omset}]
    host.replaceChildren();
    const W = Math.max(280, host.clientWidth || 600), H = 220, mL = 64, mB = 24, mT = 10, mR = 8;
    const max = Math.max(1, ...data.map((d) => d.retur));
    const c = warnaCss();
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Nilai retur per bulan" });
    const y = (v) => mT + (H - mT - mB) * (1 - v / max);
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4, yy = y(v);
      svg.append(svgEl("line", { x1: mL, x2: W - mR, y1: yy, y2: yy, stroke: c.line }));
      const tx = svgEl("text", { x: mL - 6, y: yy + 4, "text-anchor": "end" }); tx.textContent = rpK(v).replace("Rp ", ""); svg.append(tx);
    }
    const band = (W - mL - mR) / Math.max(1, data.length), bw = Math.min(34, band * 0.5);
    const tip = el("div", { class: "tip", hidden: true });
    data.forEach((d, i) => {
      const cx = mL + band * i + band / 2, top = y(d.retur);
      const r = svgEl("rect", { x: cx - bw / 2, width: bw, y: top, height: Math.max(1, y(0) - top), rx: 3, fill: d.bulan === S.bulan ? c.bad : c.bar });
      svg.append(r);
      const tx = svgEl("text", { x: cx, y: H - 6, "text-anchor": "middle" }); tx.textContent = namaBulan(d.bulan); svg.append(tx);
      r.addEventListener("mouseenter", () => {
        tip.hidden = false;
        tip.replaceChildren(el("div", { class: "muted", text: namaBulan(d.bulan) }), el("div", { text: "Retur " + rpK(d.retur) }), el("div", { text: pct(d.omset ? d.retur / d.omset : null) + " dari omset " + rpK(d.omset) }));
        tip.style.left = Math.min(Math.max(0, cx / W * host.clientWidth - 80), host.clientWidth - 200) + "px"; tip.style.top = "6px";
      });
      r.addEventListener("mouseleave", () => (tip.hidden = true));
    });
    host.append(svg, tip);
  }

  const kunciTagih = (h, n) => "g" + (h.tanggal + "_" + n.nomor_do).replace(/[^A-Za-z0-9]+/g, "_");
  function inputCekTagih(h, n, field) {
    const key = kunciTagih(h, n), cur = S.tagihCek[key] || {};
    if (S.canWrite === false || !S.db) return field === "selesai" ? el("span", { class: cur.selesai ? "pill ok" : "muted", text: cur.selesai ? "\u2713" : "\u2013" }) : el("span", { class: cur.keterangan ? null : "muted", text: cur.keterangan || "" });
    const status = el("span", { class: "muted", role: "status", style: "font-size:11px" });

      const isi = { ...(S.tagihCek[key] || {}), ...ubah, nomor_do: n.nomor_do, tanggal: h.tanggal, kolektor: h.kolektor, diubah: new Date().toISOString(), oleh: S.uid || null };

      { h: "Unit", f: (r) => r.unit, num: true, fmt: (v) => nf0.format(v) },
      { h: "Kubikasi", f: (r) => r.m3, num: true, fmt: (v) => m3(v), bar: true },
      { h: "Unit tanpa ukuran", f: (r) => r.tak_terukur_unit, num: true, fmt: (v) => v ? el("span", { class: "pill warn", text: nf0.format(v) + " unit" }) : el("span", { class: "muted", text: "–" }) },
      { h: "Barang diangkut", f: (r) => teksBarang(r.barang), node: (r) => nodeBarangRute(r.barang) },

    ];
    const kartuRit = ritsTampil.map((r) => {
      const toko = R.rit_toko.filter((x) => x.kunci_rit === r.kunci).sort((a, b) => a.urut - b.urut);
      const belum = r.nopol === "(belum terangkut)";
      const tanpaMobil = belum && /belum ada data mobil/.test(r.sebab || "");
      return el("div", { class: "card" },
        el("h2", null, belum ? (tanpaMobil ? "Muatan belum dibagi ke mobil" : "Belum kebagian mobil") : (r.mobil ? r.mobil + " · " : "") + r.nopol,
          el("span", { class: "pill " + (belum ? "bad" : "mut"), style: "margin-left:8px",
            text: belum ? nf1.format(r.muatan_m3) + " m³ sisa" : r.jenis + " · " + m3(r.volume_m3) })),
        el("p", { class: "note", text: belum
          ? (tanpaMobil
            ? "Cabang ini belum ada data mobilnya di DATABASE MOBIL, jadi muatannya dihitung tapi belum bisa dibagi per mobil. Kirim daftar mobil cabang ini (nopol + ukuran box) dan pembagiannya langsung jalan."
            : "Muatan ini tidak kebagian mobil pada tanggal itu — perlu rit kedua, mobil tambahan, atau digeser ke hari berikutnya.")
          : "Jalur: " + r.jalur + (r.km != null ? " · perkiraan " + nf0.format(r.km) + " km pergi-pulang (" + r.sumber_km + ")" : "") }),
        belum ? null : bar(r.muatan_m3, r.volume_m3),
        el("div", { class: "row", style: "gap:14px;flex-wrap:wrap;font-size:13px" },
          el("span", null, el("b", null, nf0.format(r.toko)), " toko"),
          el("span", null, el("b", null, nf0.format(r.do)), " pengiriman"),
          el("span", null, el("b", null, nf0.format(r.unit)), " unit"),
          belum ? null : el("span", null, "arah ", el("b", null, r.arah))),
        r.melebihi_mobil ? el("div", { class: "msg", text: "Satu toko ini saja muatannya sudah melebihi batas muat mobil — perlu dibagi dua kali jalan." }) : null,
        table(kolomToko, toko, { sort: 0, dir: "asc" }));
    });

    // ongkos vs muatan (Kak Intan 29 Okt 2026): mobil tidak penuh belum tentu rugi ongkos jalan
    const ritOngkos = ritsTampil.filter((r) => r.ongkos != null);
    const totLaba = ritOngkos.reduce((a, r) => a + (r.laba || 0), 0);
    const totOngkos = ritOngkos.reduce((a, r) => a + r.ongkos, 0);
    const ritRugi = ritOngkos.filter((r) => r.sisa < 0);
    const ritTipis = ritOngkos.filter((r) => r.persen != null && r.persen < 60 && r.sisa >= 0);
    const nodeOngkos = (r) => r.ongkos == null
      ? el("span", { class: "muted", style: "font-size:12px", text: r.nopol === "(belum terangkut)" ? "–" : r.sumber_ongkos || "–" })
      : el("span", null, el("b", { text: rp(r.ongkos) }), el("div", { class: "muted", style: "font-size:12px", text: (r.ongkos_persen_omset != null ? nf1.format(r.ongkos_persen_omset) + "% dari nilai jual · " : "") + r.sumber_ongkos }));
    const nodeSisa = (r) => r.ongkos == null ? el("span", { class: "muted", text: "–" })
      : el("span", null, el("span", { class: "pill " + (r.sisa >= 0 ? "ok" : "bad"), text: (r.sisa >= 0 ? "Untung " : "Rugi ") + rpK(Math.abs(r.sisa)) }),
        el("div", { class: "muted", style: "font-size:12px", text: r.laba <= 0 ? "barangnya sendiri dijual di bawah HPP" : r.impas_persen != null ? "impas kalau muatan ≥ " + nf1.format(r.impas_persen) + "% box (" + m3(r.impas_m3) + ")" : "" }),
        r.rasio_laba_ongkos != null ? el("div", { style: "font-size:12px", text: "laba " + nf1.format(r.rasio_laba_ongkos) + "× ongkos · " + (r.putusan || "") + (r.rencana ? " (perkiraan)" : "") }) : null);
    const nodeNilai = (r) => el("span", null, el("div", { text: rpK(r.nilai || 0) }), el("div", { class: "muted", style: "font-size:12px", text: "laba kotor " + rpK(r.laba || 0) + (r.unit_tanpa_harga ? " · " + nf0.format(r.unit_tanpa_harga) + " unit belum ada harganya" : "") }));
    const kartuOngkos = ritOngkos.length ? card("Muatan tidak penuh — rugi ongkos jalan atau tidak?",
      "Tiap mobil di atas dihitung nilai jual dan laba kotor barang yang diangkutnya (harga & HPP rata-rata barang itu di cabang ini, 3 bulan terakhir), lalu dibandingkan dengan ongkos sehari jalan mobil itu yang benar-benar keluar di Accurate (solar, e-tol, uang jalan/makan supir, transport, parkir).",
      el("div", { class: "kpis" },
        kpi("Laba kotor muatan", rpK(totLaba), ritOngkos.length + " mobil pada tanggal ini"),
        kpi("Ongkos jalan", rpK(totOngkos), totLaba > 0 ? nf1.format(totOngkos / totLaba * 100) + "% dari laba kotor muatan" : "–", totOngkos > totLaba ? "bad" : "up"),
        kpi("Mobil rugi ongkos", ritRugi.length ? ritRugi.length + " mobil" : "tidak ada", ritRugi.length ? "laba muatannya < ongkos jalan" : "semua mobil labanya menutup ongkos", ritRugi.length ? "bad" : "up"),
        kpi("Mobil < 60% penuh tapi tetap untung", nf0.format(ritTipis.length), ritTipis.length ? ritTipis.map((r) => (r.mobil || r.nopol) + " " + nf0.format(r.persen) + "%").join(", ") : "–")),
      el("p", { class: "note", text: "Cara bacanya: kolom “impas kalau muatan ≥ …% box” = muatan paling sedikit supaya laba barangnya sudah menutup ongkos jalan hari itu. Biasanya hanya beberapa persen, jadi mobil setengah penuh pun masih untung — yang membuat rugi justru barang yang dijual di bawah HPP. Gaji supir & penyusutan mobil tidak dihitung, karena tetap keluar walau mobil tidak jalan." })) : null;

    // ---------- biaya mobil nyata (Accurate, Pembayaran Lain bernopol) ----------
    const BH = R.biaya_harian || [];
    let kartuBiaya = null;
    if (BH.length) {
      const fb = S.ruteBiaya || (S.ruteBiaya = {});
      const akhirB = R.biaya_meta?.akhir || BH[BH.length - 1].tanggal;
      if (!fb.dari) { const d = new Date(akhirB); d.setDate(1); fb.dari = d.toISOString().slice(0, 10); }
      if (!fb.sampai) fb.sampai = akhirB;
      if (fb.kend == null) fb.kend = "Mobil";
      const cabB = [...new Set(BH.map((r) => r.cabang))].sort();
      if (S.cabang) fb.cab = "";
      const dasarB = BH.filter((r) => (!fb.cab || r.cabang === fb.cab) && r.tanggal >= fb.dari && r.tanggal <= fb.sampai
        && (!fb.kend || r.kendaraan.startsWith(fb.kend)));
      const nopolB = [...new Set(dasarB.map((r) => r.nopol))].sort();
      if (fb.nopol && !nopolB.includes(fb.nopol)) fb.nopol = "";
      const jenisB = [...new Set(BH.flatMap((r) => Object.keys(r.rinci)))].sort();

      const nilaiB = (r) => fb.jenis ? r.rinci[fb.jenis] || 0 : r.jalan;

      const selB = (id, label, opsi, k) => { const s = el("select", { id }, opsi.map(([v, t]) => el("option", { value: v, text: t, selected: v === (fb[k] || "") }))); s.addEventListener("change", ubah(k)); return el("label", { class: "ctl", for: id }, label, s); };
      const tglB = (id, label, k) => { const i = el("input", { id, type: "date", value: fb[k] }); i.addEventListener("change", ubah(k)); return el("label", { class: "ctl", for: id }, label, i); };
      // ringkas per mobil dari baris tersaring
      const pm = new Map();
      for (const r of rowsB) {
        const k = r.cabang + "|" + r.nopol;
        const x = pm.get(k) || { cabang: r.cabang, nopol: r.nopol, kendaraan: r.kendaraan, hari: 0, total: 0, rinci: {}, terakhir: "" };
        const v = nilaiB(r);
        if (v > 0) x.hari++;
        x.total += v;
        for (const [j, n] of Object.entries(r.rinci)) x.rinci[j] = (x.rinci[j] || 0) + n;
        x.terakhir = r.tanggal > x.terakhir ? r.tanggal : x.terakhir;
        pm.set(k, x);
      }
      const daftarMobil = new Map((R.biaya_mobil || []).map((m) => [m.cabang + "|" + m.nopol, m]));
      const perMobil = [...pm.values()];
      const totB = perMobil.reduce((a, r) => a + r.total, 0);
      const hariB = perMobil.reduce((a, r) => a + r.hari, 0);
      const tglPendek = (t) => new Date(t).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "2-digit" });
      const bulanB = (R.biaya_bulan || []).filter((b) => (!fb.cab || b.cabang === fb.cab) && b.bulan >= fb.dari.slice(0, 7) && b.bulan <= fb.sampai.slice(0, 7));
      kartuBiaya = el("div", { style: "display:grid;gap:14px" },
        el("h2", { style: "margin:8px 0 0", text: "Biaya mobil nyata (dari Accurate)" }),
        card("Mobil yang benar-benar jalan dan ongkosnya",
